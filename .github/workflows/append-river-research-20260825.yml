name: Append river research 2026-08-25

on:
  push:
    paths:
      - '.github/workflows/append-river-research-20260825.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append verified research to README
        shell: bash
        run: |
          set -euo pipefail
          marker='# 60. 追加調査（2026-08-25・第46回）'
          if ! grep -Fq "$marker" README.md; then
            printf '%s' '' | base64 -d >> README.md
          fi
          git rm .github/workflows/append-river-research-20260825.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Add lower Yanagibata River land-use and buried-valley research'
          git push
