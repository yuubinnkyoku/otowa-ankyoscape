name: insert-312
on:
  push:
    branches: [main]
    paths: ['.312-bullet.txt']
permissions:
  contents: write
jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert round-312 bullet into README
        run: python3 .312-insert.py
      - name: Commit README and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .312-bullet.txt .312-insert.py .github/workflows/insert-312.yml
          git add README.md
          git commit -m "第312回: READMEに実行記録bulletを挿入（定期実行bot・ヘルパー自己削除）" || echo "nothing to commit"
          git push
