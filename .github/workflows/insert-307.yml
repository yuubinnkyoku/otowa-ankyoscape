name: insert-307
on:
  push:
    branches: [main]
    paths: ['.github/workflows/insert-307.yml', '.307-insert.py', '.307-bullet.txt']
permissions:
  contents: write
jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .307-insert.py
      - name: Commit and push
        run: |
          git config user.name "otowa-ankyoscape-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "第307回: INDEX行挿入・README bullet挿入とヘルパー削除"
          git push
