name: Append research 132b

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append researched section
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          if '# 132. 追加調査' in text:
              raise SystemExit(0)

          addition = textwrap.dedent(r'''
          ---
          # 132. 追加調査（2026-08-30・第132回）

          ## 132.1 弦巻川上流を「丸池で終わり」と決める前に：1911年番地界入図・1925/1926年高田町図が示す追加検証線

          既存READMEでは、豊島区公式資料により現在の西池袋1-9-12付近にあった**丸池を弦巻川の源流**と確認している一方、丸池から下流までの細かな上流線形には未解決部分が残っている。[S26][S27] 今回、これを地番・字界の側から検証できる新たな地図史料の所在を確認した。

          CiNii Booksには、**『東京府北豊島郡高田村豊多摩郡戸塚村』**が「東京市近傍郡部町村番地界入地圖」の一枚として登録されている。1911（明治44）年7月刊、逓信協会・小林又七発行、地図1枚、77×74 cmで、別題は**「番地界入東京府北豊島郡高田村豊多摩郡戸塚村五千分一圖」**。著作権所有者は東京逓信管理局とされる。国立国会図書館にも、東京逓信管理局編纂の『東京市近傍郡部町村番地界入地図 : 明治四十四年調査』の復刻版が所蔵されている。〔史料所在確認／書誌〕[S249]

          さらに豊島区立郷土資料館の公式「豊島区地域地図集（複製）」には、**1925（大正14）年4月10日発行『東京府下高田町・戸塚町』**、および**1926（大正15）年6月1日発行『東京府下高田町北部住宅明細図』**が収録資料として明記されている。前者は町全図、後者は住宅明細図であり、1911年番地界入図と合わせることで、通常の陸地測量部地形図とは異なる粒度で弦巻川上流の街区・地番・境界を追える可能性がある。〔確認／豊島区公式〕[S250]

          この3史料を実際に比較した二次的な現地・地籍調査では、陸地測量部の地形図で弦巻川の水路表示が終わる地点よりも、**1911年高田村・戸塚村全図と1925年高田町・戸塚町全図では、さらに西側の上流が描かれている**と報告されている。また、首都高速5号池袋線～都電荒川線付近では、ブルーマップ・住居表示新旧対照表との照合から、**公図上の筆界の一部（場所によっては豊島区・文京区境）が旧川筋を示す可能性**が指摘されている。〔観察／二次資料による地図・地籍比較〕[S251]

          同調査はさらに、元池袋史跡公園付近について、1911年図・1925年図では丸池付近を上流端として読める一方、**1926年『高田町北部住宅明細図』には丸池よりさらに上流側へ続く水路表示があり、図郭が高田町外へ出るため上流端自体は描かれていない**と報告する。〔観察／二次資料による原図判読〕[S251]

          これは、豊島区公式の「丸池＝弦巻川の源流」という説明を直ちに否定する材料ではない。1926年図の線が自然河道なのか、丸池へ入る排水・用水なのか、あるいは弦巻川として認識された連続水路なのかを原図から判別できていないためである。ただし、**「丸池が水文学的にも地形的にも必ず最上流端で、それより上流には水路が存在しなかった」とまで読むのは早い**ことを示す検証材料にはなる。〔推定／要原図直接照合〕[S250][S251]

          近代の暗渠化時の流路変更についても、地域記憶を一件追加できる。2026（令和8）年6月8日の文春オンラインの現地取材で、弦巻通り沿いの赤丸ベーカリー店主は、**この付近では店の裏側を川が流れていたと聞いており、暗渠化して道路を造った際には、当時和菓子屋だった店を曳家で動かしたと聞いている**と証言している。〔確認／2026年聞き取り記事中の伝聞証言〕[S252]

          この証言は工事記録や土地台帳ではなく、店主自身も過去の出来事を「聞いた」形なので、移転年・距離・方向を確定する根拠にはならない。しかし、既存READMEで確認している**旧弦巻川・暗渠後の雑司ヶ谷幹線・現在の弦巻通りが完全には一致しない**という理解[S88][S177]と整合し、暗渠・道路化の際に沿道敷地や建物配置まで動いた可能性を具体的な一地点で検証する手掛かりになる。〔観察／既存仮説を補強する弱い証言〕[S252]

          ### ここから追えること

          - [ ] 1911年『高田村・戸塚村』五千分一図、1925年『高田町・戸塚町』、1926年『高田町北部住宅明細図』の高精細画像を取得し、丸池～西武池袋線～都電荒川線～護国寺西の水路記号を同じ現在図へ幾何補正して比較する。
          - [ ] 1926年図で丸池より西側へ続く線について、線種・幅・接続関係・地番を原図で確認し、「弦巻川本流」「丸池への流入路」「排水路・用水路」のどれとして読むのが妥当かを分ける。
          - [ ] 首都高速～都電間で旧川筋とされる筆界を、法務局地図・旧土地台帳・住居表示新旧対照表と照合し、現在の区境と旧河道が一致する区間／一致しない区間を切り分ける。
          - [ ] 赤丸ベーカリー周辺について、1930年代前後の住宅明細図・土地台帳・建築記録を追い、曳家の時期・移動方向・旧河道との位置関係を確認する。

          ## 追加出典

          - **[S249]** CiNii Books「東京府北豊島郡高田村豊多摩郡戸塚村」―（東京市近傍郡部町村番地界入地圖）、逓信協会・小林又七、1911年7月、別題「番地界入東京府北豊島郡高田村豊多摩郡戸塚村五千分一圖」、著作権所有者：東京逓信管理局。国立国会図書館サーチ「東京市近傍郡部町村番地界入地図 : 明治四十四年調査」―東京逓信管理局編纂、1986年復刻版。  
            https://ci.nii.ac.jp/ncid/BA55911066  
            https://ndlsearch.ndl.go.jp/books/R100000002-I000001861528
          - **[S250]** 豊島区立郷土資料館「豊島区地域地図集（複製）」―第1集に1925年4月10日発行『東京府下高田町・戸塚町』、第2集に1926年6月1日発行『東京府下高田町北部住宅明細図』を収録。ページ更新2023年12月20日。  
            https://www.city.toshima.lg.jp/129/bunka/bunka/shiryokan/kankobutu/005951.html
          - **[S251]** Natrium.jp「神田川周辺の水路敷群（弦巻川）」―1911年高田村・戸塚村全図、1925年高田町・戸塚町全図、1926年高田町北部住宅明細図、公図・住居表示新旧対照表を比較した現地調査。2023～2024年撮影写真を掲載。本文の旧河道比定は二次資料として利用し、原図直接照合前は確定扱いしない。  
            https://natrium.jp/canal_lot/kanda/tsurumaki/index.html
          - **[S252]** 葉上太郎「『えっ、ここを川が流れていたの？』地元では言い伝えが残るだけ…かつて池袋を流れていた『幻の川』の流域をたどる」文春オンライン、2026年6月8日―赤丸ベーカリー店主への聞き取りを収録。証言は暗渠化当時の本人観察ではなく伝聞として扱う。  
            https://bunshun.jp/articles/-/88509
          ''').lstrip()
          p.write_text(text.rstrip() + '\n\n' + addition, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --cached --quiet; then
            echo 'No README change.'
            exit 0
          fi
          git commit -m 'docs: add cadastral sources for Tsurumaki River upstream'
          git push
