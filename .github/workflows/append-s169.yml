name: append-s169
on:
  push:
    paths:
      - '.github/workflows/append-s169.yml'
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append and clean up
        shell: bash
        run: |
          cat .s169-append.txt >> README.md
          git rm .s169-append.txt .github/workflows/append-s169.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Add research on Seikei name for Yabata River'
          git push
