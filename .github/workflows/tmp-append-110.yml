name: Temporary append research 110

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  append-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append research notes
        shell: bash
        run: |
          if grep -q '^# 118\. 追加調査（2026-08-29・第110回）' README.md; then
            exit 0
          fi
          cat .tmp-research-110.md >> README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: add river corridor and well research'
          git push origin HEAD:main
