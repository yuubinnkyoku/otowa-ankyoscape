name: Append research update 40

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append verified research and remove temporary workflow
        shell: bash
        run: |
          echo '' | base64 -d >> README.md
          git rm .github/workflows/research-update-40.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Add urban hydrology research on Yabata basin"
          git push origin HEAD:main
