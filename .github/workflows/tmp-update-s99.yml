name: Temporary README update S99
on:
  push:
    paths:
      - '.github/workflows/tmp-update-s99.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append researched note
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '\[S99\]' README.md; then
            printf '%s' ' 辺の湧水口・側溝・下水管を下水道台帳と旧水窪川筋に重ね、1991年度測定地点の排水先を確認する。
- [ ] 5.2、5.8、1.1 m³/日の3地点を地形断面に置き、小日向台崖線のどの標高帯から湧出しているかを比較する。
- [ ] 過去の湧水量調査が複数年代に存在する場合、減少・増加傾向を調べ、宅地化・地下工事・下水道整備との時系列を比較する。

## 追加出典

- **[S99]** 東京都建設局『神田川流域河川整備計画』, 表2-4「神田川流域の湧水」―今宮神社（文京区音羽1丁目4番）5.2 m³/日、音羽1丁目の民家2地点5.8 m³/日・1.1 m³/日を掲載。※印の湧水量は平成3年度調査結果。流域全体では、市街化・地下水汲み上げ・湧水の下水道流入などによる平常時水量減少も説明  
  https://www.kensetsu.metro.tokyo.lg.jp/documents/d/kensetsu/000062580
' | base64 -d >> README.md
          fi
          git rm .github/workflows/tmp-update-s99.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Add measured spring-flow evidence near Mizukubo River'
          git push
