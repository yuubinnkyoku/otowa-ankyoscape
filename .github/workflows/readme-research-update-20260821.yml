name: Apply README research update

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.title == 'run-readme-research-update-20260821b'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Append verified research notes
        shell: python
        run: |
          from pathlib import Path
          import base64
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          if '[S64]' not in text:
              addition = base64.b64decode('').decode('utf-8')
              p.write_text(text.rstrip() + '\n\n' + addition.lstrip(), encoding='utf-8')
      - name: Remove temporary files and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/readme-research-update-20260821.yml
          rm -f .readme-research-trigger-20260821b
          git add -A
          git commit -m "docs: add greenway photo and archaeology sources"
          git push origin HEAD:${{ github.head_ref }}
