name: Apply researched README update

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.title == 'run-append-research-20260820'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Append verified research note
        shell: python
        run: |
          from pathlib import Path
          import base64
          p = Path("README.md")
          text = p.read_text(encoding="utf-8")
          marker = "# 26. 追加調査（2026-08-20・第12回）"
          if marker not in text:
              addition = base64.b64decode("").decode("utf-8")
              p.write_text(text.rstrip() + addition + "\n", encoding="utf-8")
      - name: Remove temporary files and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/append-research-20260820.yml
          rm -f .append-research-trigger
          git add -A README.md .github/workflows/append-research-20260820.yml .append-research-trigger
          git commit -m "docs: add further river archive research"
          git push origin HEAD:${{ github.head_ref }}
