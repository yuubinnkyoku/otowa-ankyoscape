name: Apply verified river source corrections

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.title == 'run-append-research-20260820'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Correct bibliography and refine map dating
        shell: python
        run: |
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')

          replacements = {
              '**第9巻第8号（1933年8月）pp.13–17に、上村為人「旧高田町地内都市計画道路高低交叉に就て」**': '**第9巻第7号（1933年7月）pp.13–17に、上村為人「旧高田町地内都市計画道路高低交叉に就て」**',
              '**[S57]** 上村為人「旧高田町地内都市計画道路高低交叉に就て」『土木建築工事画報』第9巻第8号, 工事画報社, 1933年8月, pp.13–17（本文未確認、土木学会図書館・昭和館デジタルアーカイブで書誌確認）': '**[S57]** 上村為人「旧高田町地内都市計画道路高低交叉に就て」『土木建築工事画報』第9巻第7号, 工事画報社, 1933年7月, pp.13–17（本文未確認、土木学会図書館・昭和館デジタルアーカイブで書誌確認。旧記載の「第8号・1933年8月」は目次の号境界を取り違えたため訂正）',
              "小坂克信『近代化を支えた多摩川の水』（とうきゅう環境財団研究助成成果、2021年）": "小坂克信『近代化を支えた多摩川の水』（とうきゅう環境財団研究助成成果、2011年）",
              '**[S60]** 小坂克信『近代化を支えた多摩川の水』とうきゅう環境財団研究助成成果, 2021年,': '**[S60]** 小坂克信『近代化を支えた多摩川の水』とうきゅう環境財団研究助成成果, 2011年（東急財団の成果一覧は2011年、国立国会図書館書誌は2011年12月）,',
              '- [ ] 「豊島区地域地図第6集―近代（千川上水路図）編」の原図年代・縮尺・範囲・凡例を確認する。': '- [x] 「豊島区地域地図第6集―近代（千川上水路図）編」の原図年代を確認：豊島区公式刊行物ページは「千川上水路図（完）」を**明治14～17年頃（1881～1884年頃）**とする。縮尺・描画範囲・凡例は引き続き未確認。',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected text: {old[:80]}')
              text = text.replace(old, new, 1)

          old = '''ただし、複製図そのものの高精細画像と凡例はまだ確認していない。したがって、**この地図に谷端川への分水口や1879年の浄連寺裏転流地点が実際に描かれているとは現段階では言えない。** 原図の年代、縮尺、描画範囲も含めて確認が必要である。〔未解決〕[S63]'''
          new = '''豊島区の現行公式刊行物ページでは、この第6集の収録図を **「千川上水路図（完）」、明治14年から明治17年頃（1881～1884年頃）** と明記している。〔確認／豊島区公式刊行物ページ〕[S63] これにより原図年代はかなり絞れ、1879年の浄連寺裏での一時転流[S60]から約2～5年後の水路状況を示す可能性がある。ただし、**一時的な転流施設がその時点まで残存・記載されたとは限らない**ため、同図から1879年の転流経路を直接確認できるとはまだ言えない。〔観察／未解決〕[S60][S63]\n\nまた、複製図そのものの高精細画像・縮尺・描画範囲・凡例は今回未確認である。したがって、**この地図に谷端川への分水口や浄連寺裏の接続が実際に描かれているとは現段階では断定しない。**'''
          if old not in text:
              raise SystemExit('missing S63 unresolved paragraph')
          text = text.replace(old, new, 1)

          old_src = '''  https://adeac.jp/toshima-history/viewer/mp404418/pressH051222/  
  年表：https://adeac.jp/toshima-history/timeline/tm000001_1?key=41%E6%96%87%E5%8C%96%E8%B2%A1%E3%83%BB%E9%83%B7%E5%9C%9F%E5%8F%B2%E6%96%99'''
          new_src = '''  https://adeac.jp/toshima-history/viewer/mp404418/pressH051222/  
  豊島区公式刊行物ページ（収録図「千川上水路図（完）」を明治14～17年頃と記載）：https://www.city.toshima.lg.jp/129/bunka/bunka/shiryokan/kankobutu/005951.html  
  年表：https://adeac.jp/toshima-history/timeline/tm000001_1?key=41%E6%96%87%E5%8C%96%E8%B2%A1%E3%83%BB%E9%83%B7%E5%9C%9F%E5%8F%B2%E6%96%99'''
          if old_src not in text:
              raise SystemExit('missing S63 source block')
          text = text.replace(old_src, new_src, 1)

          p.write_text(text, encoding='utf-8')
      - name: Remove temporary files and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/append-research-20260820.yml
          rm -f .refine-river-sources-trigger
          git add -A
          git commit -m "docs: correct sources and date Senkawa map"
          git push origin HEAD:${{ github.head_ref }}
