name: append-s170
on:
  push:
    paths:
      - '.github/workflows/append-s170.yml'
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append and clean up
        shell: bash
        run: |
          cat .s170-append.txt >> README.md
          git rm .s170-append.txt .append-s170-trigger .github/workflows/append-s170.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Add Edo-period Yabata River width note'
          git push
