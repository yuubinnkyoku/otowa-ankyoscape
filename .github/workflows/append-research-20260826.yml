name: Append river research 2026-08-26

on:
  push:
    paths:
      - '.github/workflows/append-research-20260826.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append verified research
        shell: bash
        run: |
          python -c "import base64; open('README.md','ab').write(base64.b64decode(''))"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git rm .github/workflows/append-research-20260826.yml
          git commit -m 'Add research on Tsurumaki and Yabata land use'
          git push
