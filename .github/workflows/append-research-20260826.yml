# 66. 追加調査（2026-08-26・第52回）

## 66.1 弦巻川沿いに「洗場」という生活地名―大正初期まで大根などを洗った小川

豊島区立雑司が谷旧宣教師館だより第35・36合併号（2005年11月1日）の本吉瑠璃夫「私の小さな故郷　雑司が谷」は、筆者の生家付近を**東京府北豊島郡高田町大字雑司ヶ谷字古木田（現・雑司が谷2丁目付近）**とし、雑司ヶ谷墓地（現・雑司ヶ谷霊園）から清立院のある坂を下り鬼子母神へ抜ける道筋の**坂下に小川が流れ、その場所を「洗場」と呼んでいた**と記す。〔確認／地域住民による回想・豊島区公的刊行物〕[S135]

同記事は、「おそらく大正の初期までは」一帯に大根を主とする野菜畑があり、地元農家が野菜の土を小川で洗ったため「洗場」と呼ばれたのだろう、と説明している。これは呼称の語源についての筆者の推定を含むため、**洗場という呼称の存在**と**その語源説明**は分けて扱う。〔確認／語源は史料中の推定〕[S135]

さらに筆者は、父が雑司が谷へ移った**大正4（1915）年頃の少し以前から、大根畑の地主が畑を宅地へ変え、売地・貸地としてサラリーマン住宅が建ち始めた**と回想している。既存[S102][S113]で追ってきた「震災以前から進んでいた雑司ヶ谷の宅地化」を、弦巻川沿いの具体的な生活地名・農作業・宅地化の記憶から補強する資料になる。〔確認／回想資料、観察〕[S135][S102][S113]

ただし、この「洗場」の正確な位置、どの支流・本流区間を指すのか、呼称がいつからいつまで使われたのかは本文だけでは確定できない。清立院・御嶽坂周辺の旧地番、1910年代の地形図、弦巻川支流図を重ねる必要がある。〔未解決〕

## 66.2 谷端川への千川上水分水を位置と利用村まで具体化―明治10年文書では「四ケ村用水」

練馬区の公的地域資料「千川上水の分水を訪ねて（2）」（2024年5月1日）は、**長崎村外三村分水―谷端川**について、現在の**豊島区要町3丁目45番付近**で千川上水から南東へ分かれ、**要町2丁目41番の粟島神社境内の池を水源とする谷端川へ接続していた**と位置を具体化している。〔確認／練馬区公的地域資料〕[S136]

同資料は、明治10（1877）年7月の**「千川用水組合村樋口伏替願」**に、この分水が**「長崎村、中丸村、池袋村、金井窪村四ケ村用水」**と記されることを紹介している。谷端川への分水が単に「千川上水の水を足した」というだけでなく、少なくとも明治10年には**複数村が共同利用する農業用水系統として認識されていた**ことを具体化できる。〔確認／公的資料による史料紹介〕[S136]

また同シリーズは、千川上水の分水の多くが**自然河川の源頭部や湧水池、それから流れ出す小川へ接続され、自然地形を利用していた**と整理している。谷端川でも、粟島神社の湧水池を起点とする自然水系へ人工の分水を継ぎ足す構成だったと読むのが自然である。〔観察〕[S136]

ただし、1877年文書の原本画像は今回未確認であり、分水口の位置が明治10年当時から現在の要町3丁目45番付近で固定されていたか、分水量・樋口寸法・利用時期がどう変化したかは未確認である。〔注意／未解決〕

### ここから追えること

- [ ] 雑司が谷旧宣教師館だより第35・36合併号の「洗場」記述を旧地番図へ落とし、弦巻川本流・支流のどちらかを特定する。
- [ ] 清立院・御嶽坂周辺の1910年代地形図、地籍図、道路・筆界を重ね、「洗場」と宅地化の進行を地図化する。
- [ ] 明治10年「千川用水組合村樋口伏替願」の原本・翻刻を探し、四ケ村用水の樋口寸法、分水量、分担・水利権を確認する。
- [ ] 要町3丁目45番付近の分水口から粟島神社弁天池・谷端川までを明治17年「千川上水絵図」や旧地籍図で照合する。

