name: validate knowledge graph

on:
  push:
    paths:
      - "ontology/**"
      - "data/**"
      - "docs/**"
      - "scripts/validate_graph.py"
      - "scripts/export_kge.py"
      - "scripts/export_temporal_kge.py"
      - "scripts/export_discovery_kge.py"
      - "scripts/export_hakken_thiger_raw.py"
      - "scripts/make_kge_split.py"
      - "scripts/make_temporal_backtest.py"
      - "scripts/scan_temporal_cutoffs.py"
      - "scripts/collect_tagged_passages.py"
      - "scripts/graph_stats.py"
  pull_request:
    paths:
      - "ontology/**"
      - "data/**"
      - "docs/**"
      - "scripts/validate_graph.py"
      - "scripts/export_kge.py"
      - "scripts/export_temporal_kge.py"
      - "scripts/export_discovery_kge.py"
      - "scripts/export_hakken_thiger_raw.py"
      - "scripts/make_kge_split.py"
      - "scripts/make_temporal_backtest.py"
      - "scripts/scan_temporal_cutoffs.py"
      - "scripts/collect_tagged_passages.py"
      - "scripts/graph_stats.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_graph.py
      - run: python scripts/graph_stats.py
      - run: python scripts/collect_tagged_passages.py --summary-only
      - run: python scripts/export_kge.py
      - run: python scripts/make_kge_split.py
      - run: python scripts/export_temporal_kge.py
      - run: python scripts/scan_temporal_cutoffs.py
      - run: python scripts/make_temporal_backtest.py --train-end 1930 --val-end 1960
      - run: python scripts/export_discovery_kge.py
      - run: python scripts/scan_temporal_cutoffs.py --input experiments/kge/discovery/all.tsv --output experiments/kge/discovery/cutoff-scan.json
      - run: python scripts/export_hakken_thiger_raw.py
      - name: Show generated split
        run: |
          cat experiments/kge/split/metadata.json
          echo "--- train" && wc -l experiments/kge/split/train.tsv
          echo "--- valid" && wc -l experiments/kge/split/valid.tsv
          echo "--- test" && wc -l experiments/kge/split/test.tsv
          echo "--- historical-time temporal facts" && wc -l experiments/kge/temporal/all.tsv
          echo "--- historical-time cutoff scan" && cat experiments/kge/temporal/cutoff-scan.json
          echo "--- historical-time chronological backtest" && cat experiments/kge/temporal/backtest/metadata.json
          echo "--- corpus-evidence discovery facts" && wc -l experiments/kge/discovery/all.tsv
          echo "--- corpus-evidence cutoff scan" && cat experiments/kge/discovery/cutoff-scan.json
          echo "--- Hakken THiGER raw edges" && wc -l experiments/kge/hakken/raw/edges.tsv
          echo "--- Hakken THiGER raw nodes" && wc -l experiments/kge/hakken/raw/nodes_corrected.tsv
