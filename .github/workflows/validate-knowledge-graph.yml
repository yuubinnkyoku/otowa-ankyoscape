name: validate knowledge graph

on:
  push:
    paths:
      - "ontology/**"
      - "data/**"
      - "docs/**"
      - "scripts/validate_graph.py"
      - "scripts/export_kge.py"
      - "scripts/export_temporal_kge.py"
      - "scripts/make_kge_split.py"
      - "scripts/collect_tagged_passages.py"
      - "scripts/graph_stats.py"
  pull_request:
    paths:
      - "ontology/**"
      - "data/**"
      - "docs/**"
      - "scripts/validate_graph.py"
      - "scripts/export_kge.py"
      - "scripts/export_temporal_kge.py"
      - "scripts/make_kge_split.py"
      - "scripts/collect_tagged_passages.py"
      - "scripts/graph_stats.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_graph.py
      - run: python scripts/graph_stats.py
      - run: python scripts/collect_tagged_passages.py --summary-only
      - run: python scripts/export_kge.py
      - run: python scripts/make_kge_split.py
      - run: python scripts/export_temporal_kge.py
      - name: Show generated split
        run: |
          cat experiments/kge/split/metadata.json
          echo "--- train" && wc -l experiments/kge/split/train.tsv
          echo "--- valid" && wc -l experiments/kge/split/valid.tsv
          echo "--- test" && wc -l experiments/kge/split/test.tsv
          echo "--- temporal" && wc -l experiments/kge/temporal/all.tsv
