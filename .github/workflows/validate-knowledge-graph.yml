name: validate knowledge graph

on:
  push:
    paths:
      - "ontology/**"
      - "data/**"
      - "scripts/validate_graph.py"
  pull_request:
    paths:
      - "ontology/**"
      - "data/**"
      - "scripts/validate_graph.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_graph.py
