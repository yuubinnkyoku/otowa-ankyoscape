name: validate knowledge graph

on:
  push:
    paths:
      - "ontology/**"
      - "data/**"
      - "docs/**"
      - "scripts/validate_graph.py"
      - "scripts/export_kge.py"
      - "scripts/export_temporal_kge.py"
      - "scripts/export_discovery_kge.py"
      - "scripts/export_hakken_thiger_raw.py"
      - "scripts/make_kge_split.py"
      - "scripts/make_temporal_backtest.py"
      - "scripts/scan_temporal_cutoffs.py"
      - "scripts/collect_tagged_passages.py"
      - "scripts/graph_stats.py"
      - "scripts/build_research_queue.py"
  pull_request:
    paths:
      - "ontology/**"
      - "data/**"
      - "docs/**"
      - "scripts/validate_graph.py"
      - "scripts/export_kge.py"
      - "scripts/export_temporal_kge.py"
      - "scripts/export_discovery_kge.py"
      - "scripts/export_hakken_thiger_raw.py"
      - "scripts/make_kge_split.py"
      - "scripts/make_temporal_backtest.py"
      - "scripts/scan_temporal_cutoffs.py"
      - "scripts/collect_tagged_passages.py"
      - "scripts/graph_stats.py"
      - "scripts/build_research_queue.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_graph.py
      - run: python scripts/graph_stats.py
      - run: python scripts/collect_tagged_passages.py --summary-only
      - run: python scripts/export_kge.py
      - run: python scripts/make_kge_split.py
      - run: python scripts/export_temporal_kge.py
      - run: python scripts/scan_temporal_cutoffs.py
      - run: python scripts/make_temporal_backtest.py --train-end 1930 --val-end 1960
      - run: python scripts/export_discovery_kge.py
      - run: python scripts/scan_temporal_cutoffs.py --input experiments/kge/discovery/all.tsv --output experiments/kge/discovery/cutoff-scan.json
      - run: python scripts/make_temporal_backtest.py --input experiments/kge/discovery/all.tsv --output-dir experiments/kge/discovery/backtest --train-end 2016 --val-end 2021
      - run: python scripts/export_discovery_kge.py --exclude-year-kinds page_update --output experiments/kge/discovery/no-page-update.tsv
      - run: python scripts/scan_temporal_cutoffs.py --input experiments/kge/discovery/no-page-update.tsv --output experiments/kge/discovery/no-page-update-cutoff-scan.json
      - run: python scripts/make_temporal_backtest.py --input experiments/kge/discovery/no-page-update.tsv --output-dir experiments/kge/discovery/no-page-update-backtest --train-end 2016 --val-end 2021
      - run: python scripts/export_discovery_kge.py --exclude-year-kinds page_update,unspecified,unknown --output experiments/kge/discovery/classified-only.tsv
      - run: python scripts/scan_temporal_cutoffs.py --input experiments/kge/discovery/classified-only.tsv --output experiments/kge/discovery/classified-only-cutoff-scan.json
      - run: python scripts/make_temporal_backtest.py --input experiments/kge/discovery/classified-only.tsv --output-dir experiments/kge/discovery/classified-only-backtest --train-end 2016 --val-end 2021
      - run: python scripts/export_hakken_thiger_raw.py
      - run: python scripts/export_hakken_thiger_raw.py --input experiments/kge/discovery/all.tsv --output-dir experiments/kge/hakken/raw-discovery
      - run: python scripts/build_research_queue.py
      - name: Show generated split
        run: |
          cat experiments/kge/split/metadata.json
          echo "--- train" && wc -l experiments/kge/split/train.tsv
          echo "--- valid" && wc -l experiments/kge/split/valid.tsv
          echo "--- test" && wc -l experiments/kge/split/test.tsv
          echo "--- historical-time temporal facts" && wc -l experiments/kge/temporal/all.tsv
          echo "--- historical-time cutoff scan" && cat experiments/kge/temporal/cutoff-scan.json
          echo "--- historical-time chronological backtest" && cat experiments/kge/temporal/backtest/metadata.json
          echo "--- corpus-evidence discovery facts" && wc -l experiments/kge/discovery/all.tsv
          echo "--- corpus-evidence cutoff scan" && cat experiments/kge/discovery/cutoff-scan.json
          echo "--- corpus-evidence chronological backtest" && cat experiments/kge/discovery/backtest/metadata.json
          echo "--- no-page-update discovery facts" && wc -l experiments/kge/discovery/no-page-update.tsv
          echo "--- no-page-update cutoff scan" && cat experiments/kge/discovery/no-page-update-cutoff-scan.json
          echo "--- no-page-update chronological backtest" && cat experiments/kge/discovery/no-page-update-backtest/metadata.json
          echo "--- classified-only discovery facts" && wc -l experiments/kge/discovery/classified-only.tsv
          echo "--- classified-only cutoff scan" && cat experiments/kge/discovery/classified-only-cutoff-scan.json
          echo "--- classified-only chronological backtest" && cat experiments/kge/discovery/classified-only-backtest/metadata.json
          echo "--- Hakken THiGER historical raw edges" && wc -l experiments/kge/hakken/raw-historical/edges.tsv
          echo "--- Hakken THiGER historical raw nodes" && wc -l experiments/kge/hakken/raw-historical/nodes_corrected.tsv
          echo "--- Hakken THiGER discovery raw edges" && wc -l experiments/kge/hakken/raw-discovery/edges.tsv
          echo "--- Hakken THiGER discovery raw nodes" && wc -l experiments/kge/hakken/raw-discovery/nodes_corrected.tsv
          echo "--- research queue" && cat experiments/kge/research-queue.md
