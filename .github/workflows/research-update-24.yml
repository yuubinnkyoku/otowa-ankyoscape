name: Update river research README

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append verified research notes
        shell: bash
        run: |
          if grep -q '^# 24\. 追加調査（2026-08-20・第10回）' README.md; then
            exit 0
          fi
          printf '%s' '' | base64 -d >> README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: add Tsurumaki and Yabata river source findings'
          git push
