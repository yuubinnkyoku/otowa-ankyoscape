name: append-s222
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append research section
        shell: python
        run: |
          from pathlib import Path
          p = Path("README.md")
          text = p.read_text(encoding="utf-8")
          if "[S222]" in text:
              raise SystemExit(0)
          appendix = r'''

---
# 115. 追加調査（2026-08-29・第107回）

## 115.1 谷端川・大塚：王子電気軌道は開業初期、開渠の谷端川を鉄橋で横断していたことを示す社史写真

三井住友トラスト不動産「このまちアーカイブス」の池袋・大塚交通史は、王子電気軌道（王電）が **1911（明治44）年に飛鳥山上～大塚間を開通**したことを記し、明治末期～大正初期とする写真について、**大塚付近で谷端川の橋梁を渡る王電**を写したものと説明している。現在地についても、**大塚駅前停留場の北側にあった谷端川橋梁付近**としている。〔確認／地域史資料による社史写真の位置づけ〕[S222]

さらに、2020年の大塚地域史調査ページは、1940（昭和15）年刊の **『王子電氣軌道株式會社三十年史』** 掲載写真について、社史キャプションを **「創業當時ノ電車（大塚八幡（谷端）川鐵橋附近）」** と転記している。CiNii Booksでも同社史が王子電氣軌道株式會社編纂、1940年4月刊として確認できる。〔書誌確認＋二次資料による社史キャプション確認〕[S222]

〔観察〕この写真情報が重要なのは、谷端川の流路を単に1920年代の地形図から読むだけでなく、**王電の軌道と開渠の谷端川が立体的に交差していた地点を、鉄道施設という固定物から絞れる**ことである。王電の大塚方面開業は1911年なので、少なくとも開業初期の大塚では、軌道側が谷端川を橋梁で越える必要のある地形・河道関係だったことを示す資料候補になる。[S222]

既存READMEでは、大塚付近を含む谷端川下流について1930年代の暗渠化、旧橋、1921年地形図などを追っている。今回の資料をそれらと組み合わせると、**開渠の谷端川 → 王電の鉄橋横断 → 1930年代の暗渠・道路化**という土地利用・交通施設の変化を同一点付近で比較できる可能性がある。〔観察〕

ただし、いくつか留保がある。今回オンラインで直接確認できたのは、現代の地域史ページによる写真説明と、別ページによる1940年社史キャプションの転記、そして社史の書誌であり、**『王子電氣軌道株式會社三十年史』原本の該当頁・写真を直接画像確認したわけではない。** したがって、写真の正確な撮影年月、橋梁の正式名称・橋長・構造は未確定とする。またキャプション中の **「八幡（谷端）川」** が当時の正式河川名・地域呼称・社史編纂時の補記のどれに当たるかも、原本の前後記述を確認するまで断定しない。〔注意／未解決〕[S222]

### ここから追えること

- [ ] 『王子電氣軌道株式會社三十年史』原本の写真頁を確認し、キャプション、撮影年代、写真番号、前後の説明を直接確定する。
- [ ] 豊島区立郷土資料館年報第15号（1999年度）所収、伊藤暢直「豊島区域における王子電気軌道株式会社の軌道敷設状況」を確認し、大塚の谷端川鉄橋に関する図面・工事記録・橋梁名称があるか調べる。
- [ ] 1910～20年代の王電線路平面図・橋梁台帳と1921年1万分1地形図を重ね、大塚駅前停留場北側の谷端川横断地点を現在地へ固定する。
- [ ] 社史キャプションの「八幡（谷端）川」という表記が、別の地図・橋梁台帳・地域史料にも現れるか確認し、谷端川の別称として一般化できるか検証する。

## 追加出典

- **[S222]** 王子電氣軌道株式會社編纂『王子電氣軌道株式會社三十年史』王子電氣軌道、1940年4月（CiNii Booksで書誌確認）。三井住友トラスト不動産「このまちアーカイブス 池袋・2：鉄道の開通、交通の要衝へ」は、1911年開業の王電が大塚付近で谷端川の橋梁を渡る明治末期～大正初期の写真を紹介し、地点を大塚駅前停留場北側の旧谷端川橋梁付近と説明。「今日も日暮里富士見坂」2020年8月27日記事は同社史掲載写真のキャプションを「創業當時ノ電車（大塚八幡（谷端）川鐵橋附近）」と転記する。**社史原本の該当写真頁は今回直接画像確認できていないため、キャプションと撮影年代は二次資料を介した確認として扱う。** あわせて豊島区公式の研究紀要一覧で、伊藤暢直「豊島区域における王子電気軌道株式会社の軌道敷設状況」が豊島区立郷土資料館年報第15号（1999年度、2001年3月16日発行）に掲載されていることを確認した。  
  https://ci.nii.ac.jp/author/DA12834538  
  https://smtrc.jp/town-archives/city/ikebukuro/p02.html  
  https://fujimizaka.wordpress.com/2020/08/27/asami-saka/  
  https://www.city.toshima.lg.jp/129/bunka/bunka/shiryokan/kankobutu/005957.html
'''
          p.write_text(text.rstrip() + appendix + "\n", encoding="utf-8")
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: add S222 Oji railway Yabata bridge source"
          git push origin HEAD:main
