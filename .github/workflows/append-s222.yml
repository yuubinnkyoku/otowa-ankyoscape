name: append-s222
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append research section
        shell: python
        run: |
          from pathlib import Path
          import base64
          p = Path("README.md")
          text = p.read_text(encoding="utf-8")
          if "[S222]" in text:
              raise SystemExit(0)
          payload = ""
          appendix = base64.b64decode(payload).decode("utf-8")
          p.write_text(text.rstrip() + "\n\n" + appendix + "\n", encoding="utf-8")
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: add S222 Oji railway Yabata bridge source"
          git push origin HEAD:main
