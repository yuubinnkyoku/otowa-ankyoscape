# 119. 追加調査（2026-08-29・第111回）

## 119.1 谷端川・小石川系の現代下水道：千川増強幹線は全体計画約4.8 km、そのうち第一期約2.5 kmを直径3.75 mの貯留管として先行整備

東京都議会公営企業委員会の2020（令和2）年速記録で、東京都下水道局建設部長は、豊島区南大塚地区の浸水対策として、既設の **千川幹線・第二千川幹線** の排水能力を強化する **千川増強幹線** を2018（平成30）年度から整備していると説明している。全体計画は **延長約4.8 km・直径3.75 m** の下水道管を第一期・第二期に分けて整備するもので、第一期は **約2.5 km** をシールド工法で施工し、完成後は事業効果を早期に出すため **貯留管として暫定利用** する計画とされる。〔確認／東京都議会・東京都下水道局答弁〕[S228]

既存READMEでは、谷端川下流が小石川・千川と呼ばれ、暗渠化後に千川幹線系の下水道へ移行したことを追っている。[S10][S28][S103] 今回の資料は、その近代暗渠の系譜上にある現代の雨水対策が、単なる既設管補修ではなく、**旧谷端川・小石川低地を含む千川幹線流域の排水能力を別の大断面管で増強する事業**として計画されていることを具体化する。〔観察〕[S228]

重要なのは、一般向け資料でしばしば示される「約2.5 km」は **第一期区間** であり、2020年の都答弁では全体計画を約4.8 kmとしている点である。2018年の専門誌『トンネルと地下』にも「1時間75mm降雨に対応する下水道施設をシールドトンネルで整備―東京下水道 千川増強幹線」という技術報告が掲載されており、事業が時間75 mm降雨対応の下水道強化として位置付けられていることを別系統の書誌からも確認できる。〔確認／専門誌書誌〕[S228]

2020年度の東京都議会決算審査では、2013（平成25）年8月の集中豪雨で豊島・文京両区の千川幹線流域に大きな浸水被害が生じたことを踏まえ、第一期の貯留管を **直径3.75 m・延長2.5 km** として整備していることも確認できる。〔確認／東京都議会〕[S228]

さらに2026（令和8）年8月現在、東京都下水道局の現行工事情報には **「豊島区北大塚二丁目付近枝線工事」** が掲載され、施工箇所を北大塚二丁目、工期を **2023（令和5）年10月～2026（令和8）年9月** としている。したがって、第一期シールド本体の完成後も、既設幹線との接続・枝線整備が継続している。〔確認／東京都下水道局現行工事情報〕[S228]

ただし、千川増強幹線の線形をそのまま旧谷端川の河道中心線とみなすことはできない。増強幹線は現代の浸水対策上の必要性、地下埋設物、立坑位置などを踏まえて設計された地下施設であり、**旧河道の位置復元資料ではない**。旧谷端川・千川幹線・第二千川幹線・増強幹線の平面的な一致／不一致は、下水道台帳や工事平面図を重ねて別途検証する必要がある。〔注意／未解決〕

## 119.2 第二千川幹線は合流式下水道で、水道橋分水路の吐口から一定降雨時に河川へ放流する構造

東京都下水道局は2022（令和4）年10月25日、**第二千川幹線は合流式下水道であり、水道橋分水路に接続する吐口から一定の降雨時に下水を河川へ放流する構造**であると公表している。同年、所定の条件より小さい状況でも流出する「規定外の流出」が確認され、都は既に停止したと説明した。〔確認／東京都下水道局〕[S229]

これは、旧谷端川・小石川が暗渠化されて「地上から消えた」後も、水系の名を引き継ぐ下水道が単純な閉鎖管路として完結しているわけではなく、**降雨時には水道橋側の吐口を介して河川へ排水する現代の水循環・排水系統を持つ**ことを示す。〔観察〕[S229]

一方、この吐口からの放流先・流量・放流条件を、江戸期～近代の谷端川の自然流量や河道と直接比較することはできない。また「合流式」であるため、放流水は雨水だけではない。旧河川の復元とは分け、**暗渠化後の都市排水史**として扱う。〔注意〕[S229]

### ここから追えること

- [ ] 千川増強幹線の第一期・第二期の計画平面図を入手し、約4.8 km全体の起終点と、第一期約2.5 km区間を地図上で分ける。
- [ ] 旧谷端川河道、千川幹線、第二千川幹線、千川増強幹線を同一座標系で重ね、旧河道を踏襲する区間と独立して通る区間を区別する。
- [ ] 北大塚二丁目付近枝線工事の完成後資料を確認し、2026年9月の工期後にどの接続機能が供用されたか確認する。
- [ ] 第二千川幹線の水道橋分水路吐口の位置、放流先、越流水位・放流条件を東京都下水道局資料で確認し、暗渠化後の下流排水系統を図化する。

