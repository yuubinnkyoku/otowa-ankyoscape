name: Temporary append research 20260829

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-append-research-20260829.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append new research
        shell: bash
        env:
          ADDITION_B64: 
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          if '[S228]' not in text:
              addition = base64.b64decode(__import__('os').environ['ADDITION_B64']).decode('utf-8')
              p.write_text(text.rstrip() + '\n' + addition.rstrip() + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: add Senkawa sewer system research'
            git push origin HEAD:main
          fi
