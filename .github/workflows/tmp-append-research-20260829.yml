name: Temporary append research 20260829

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-append-research-20260829.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix README source text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          fixes = {
              'htttps://www.gikai.metro.tokyo.lg.jp/record/municipal-utility-account/fy2020-09.html': 'https://www.gikai.metro.tokyo.lg.jp/record/municipal-utility-account/fy2020-09.html',
              '東京都下水道局現代「下水道幹線（第二千川幹線）から河川へ放流状況にでで」2022年10月25日': '東京都下水道局「下水道幹線（第二千川幹線）から河川への放流状況について」2022年10月25日',
          }
          for old, new in fixes.items():
              if old not in text:
                  raise SystemExit(f'missing expected text: {old}')
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: correct Senkawa source text'
          git push origin HEAD:main
