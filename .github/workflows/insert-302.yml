name: insert-302
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/insert-302.yml
permissions:
  contents: write
jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert INDEX rows and README bullet, then clean up
        run: |
          set -eu
          python3 .302-insert.py
          rm -f .302-bullet.txt .302-insert.py .github/workflows/insert-302.yml
          git config user.name "otowa-ankyoscape-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "第302回: INDEX行挿入・README bullet挿入とヘルパー削除"
          git push
