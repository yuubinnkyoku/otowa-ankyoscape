name: Append S214 research note once

on:
  push:
    paths:
      - '.github/workflows/append-s214-once.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append research note and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          test -f .tmp-s214.md
          ! grep -q '\[S214\]' README.md
          cat .tmp-s214.md >> README.md
          rm -f .tmp-s214.md .github/workflows/append-s214-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Document Yabata River name at Itabashi Station'
          git push
