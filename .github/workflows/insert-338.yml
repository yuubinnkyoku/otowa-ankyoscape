name: insert-338

on:
  push:
    branches:
      - main
    paths:
      - '.338-bullet.txt'
      - '.338-insert.py'

permissions:
  contents: write

jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run insert script
        run: python3 .338-insert.py
      - name: Commit README and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/sources/INDEX.md
          git rm .338-bullet.txt .338-insert.py .github/workflows/insert-338.yml
          git commit -m "第338回: READMEに実行記録bulletを挿入しINDEXにMAP-230・231行を追加（定期実行bot・ヘルパー自己削除）"
          git push
