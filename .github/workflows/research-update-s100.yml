name: research-update-s100
on:
  push:
    paths:
      - .github/workflows/research-update-s100.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'README.md';
            const res = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
            const original = Buffer.from(res.data.content, 'base64').toString('utf8');
            if (original.includes('[S100]')) return;
            const addition = `

---

# 46. 追加調査（2026-08-21・第32回）

## 46.1 1935年前後の雲雀ヶ谷：谷端川・鉄道にはさまれた低地に町工場が密集していた

豊島区立郷土資料館だより『かたりべ』44号（1996年11月30日）は、**昭和10（1935）年前後の雲雀ヶ谷自由学園の昼食光景**を写した写真を資料紹介している。自由学園は1926（大正15）年、夫婦共働き家庭のための保育施設として、藤山友吉が自営の屋根板工場を改造して設立したもので、所在地は **西巣鴨町大字池袋字雲雀ヶ谷2081番地（現・池袋本町4丁目）** とされる。〔確認／豊島区立郷土資料館の写真資料・地域史整理〕[S100]

同号はこの場所を、**赤羽線（現・埼京線）と東上鉄道（現・東武東上線）と谷端川にはさまれた三角形の低地帯**と明記し、そこに**町工場が密集していた**と説明している。〔確認〕[S100] これは、谷端川沿いの土地利用について、旧字・番地、二つの鉄道路線、谷端川を境界として1930年代半ばの低地利用を具体化できる資料である。

この記述からは、少なくとも1935年前後には、谷端川低地の一部が水田中心の景観から、鉄道に囲まれた**小規模工業・居住の混在地域へ転換していた**ことがうかがえる。〔観察〕[S100] ただし、『かたりべ』44号が「町工場が密集」とする範囲を地図上で厳密に画定しているわけではなく、字雲雀ヶ谷2081番地周辺の全筆が工場化していたとは言えない。工場の業種・戸数・敷地境界も今回の資料だけでは未確定である。〔未解決〕

また、同号は近くに山手線開通工事の残土を積んだ通称**「赤土山」**があり、子どもの遊び場になっていたと記す。これは谷端川そのものの河川工事ではないが、鉄道建設による盛土・残土処理が低地周辺の微地形と地域生活に痕跡を残した事例として扱える。〔確認／地域史資料〕[S100] ただし、「赤土山」が谷端川の氾濫原を直接埋め立てた、あるいは洪水流下を変えたとまでは資料から確認できないため、その関係は仮説化しない。

この写真資料は、谷端川の暗渠化前後を検討する際にも年代基準になる。1935年前後という写真年代は、既存READMEで確認した1935年の谷端川暗渠工事陳情委員設置や、北大塚1丁目付近の1935年頃の先行暗渠化説とほぼ同時期である。[S75][S78] ただし、**雲雀ヶ谷自由学園付近が写真撮影時に開渠だったか、すでに工事の影響を受けていたかは写真・記事から直接確認できない。** ここは別の地図・工事記録で確認する必要がある。〔観察／未解決〕

### ここから追えること

- [ ] 西巣鴨町大字池袋字雲雀ヶ谷2081番地を旧土地台帳・地番図から現在地へ落とし、谷端川旧河道との距離を確定する。
- [ ] 1930年代の火災保険特殊地図、商工名鑑、工場台帳で、雲雀ヶ谷低地に密集した町工場の業種・敷地・操業年代を具体化する。
- [ ] 『かたりべ』44号掲載写真の原版・郷土資料館収蔵情報を確認し、背景から谷端川・鉄道・工場建物を同定できるか検討する。
- [ ] 「赤土山」の位置と造成時期を鉄道工事記録・旧版地形図で確認し、谷端川低地の地形改変との関係があるかを検証する。

## 追加出典

- **[S100]** 豊島区立郷土資料館『かたりべ』44号, 1996年11月30日, p.4「資料紹介 雲雀ヶ谷自由学園の昼食」―1935年前後の写真を掲載。自由学園を1926年に屋根板工場を改造して設立、所在地を西巣鴨町大字池袋字雲雀ヶ谷2081番地（現・池袋本町4丁目）とし、赤羽線・東上鉄道・谷端川にはさまれた三角形の低地帯に町工場が密集していたと説明。  
  https://www.city.toshima.lg.jp/documents/2548/kataribe44.pdf
`;
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: 'docs: add 1930s Yabata lowland photo evidence',
              content: Buffer.from(original + addition, 'utf8').toString('base64'),
              sha: res.data.sha,
              branch: 'main'
            });
