name: Append researched river notes

on:
  push:
    paths:
      - '.github/workflows/append-research-20260825.yml'
      - '.github/append-research-20260825.md'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append and clean temporary files
        shell: bash
        run: |
          if ! grep -Fq '# 56. 追加調査（2026-08-25・第42回）' README.md; then
            printf '\n' >> README.md
            cat .github/append-research-20260825.md >> README.md
            printf '\n' >> README.md
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/append-research-20260825.yml .github/append-research-20260825.md
          git add README.md
          git commit -m 'docs: add current legal traces of Yabata River'
          git push
