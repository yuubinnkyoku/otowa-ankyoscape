          python3 -c "import base64; open('README.md','ab').write(base64.b64decode('CgotLS0KCiMgNTUuIOi/veWKoOiqv+afu++8iDIwMjYtMDgtMjXjg7vnrKw0MeWbnu+8iQoKIyMgNTUuMSDml6fpq5jnlLDnlLrk%BADhgrE5MzDvvZ4zMuW5tOOBqjEwLDY2OSBt5pa95bel4oCUIOW8puW3uOW3neaagua4o+OCkuS6uuWFqOOBruS4iua0tOmBk+S6i+alreOBuOS9jee9ruOBpeOBkeOCieOCjOOCiw=='))"
          rm -f .github/workflows/append-research-20260825.yml
