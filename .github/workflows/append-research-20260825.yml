name: Append research 2026-08-25

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-research-20260825.yml'

permissions:
  contents: write

jobs:
  append:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append research section
        shell: bash
        run: |
          python3 -c "import base64; open('README.md','ab').write(base64.b64decode(''))"
          rm -f .github/workflows/append-research-20260825.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/append-research-20260825.yml
          git commit -m "Add Takada sewer and spring research [skip ci]"
          git push
