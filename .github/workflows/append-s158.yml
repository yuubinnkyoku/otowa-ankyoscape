name: Append S158 research note

on:
  push:
    paths:
      - '.trigger-s158'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append research note
        shell: bash
        run: |
          echo '' | base64 -d >> README.md
          rm -f .trigger-s158
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .trigger-s158
          git commit -m 'docs: add East Ikebukuro detention basin seismic retrofit source S158'
          git push
