name: append-readme-round-69

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-readme-83.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append research
        shell: bash
        run: |
          cat .append-83.txt >> README.md
          git rm .append-83.txt .github/workflows/append-readme-83.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: add round 69 river research"
          git push origin HEAD:main
