name: insert-bullet-292
on:
  push:
    branches: [main]
    paths:
      - '.292-bullet.txt'
      - '.github/workflows/insert-bullet-292.yml'
permissions:
  contents: write
jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert bullet and remove helpers
        run: |
          git config user.name "otowa-ankyoscape-bot"
          git config user.email "otowa-ankyoscape-bot@users.noreply.github.com"
          python3 - <<'PY'
          with open('.292-bullet.txt', encoding='utf-8') as f:
              bullet = f.read().rstrip('\n')
          with open('README.md', encoding='utf-8') as f:
              readme = f.read()
          if bullet[:40] in readme:
              print('bullet already present')
          else:
              anchor = '- **第291回:'
              i = readme.index(anchor)
              readme = readme[:i] + bullet + '\n' + readme[i:]
              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(readme)
              print('bullet inserted before 第291回')
          PY
          git rm .292-bullet.txt .github/workflows/insert-bullet-292.yml
          git add README.md
          git commit -m "第292回: READMEの更新履歴にbulletを追記・ヘルパーを削除" && git push || echo "nothing to commit"
