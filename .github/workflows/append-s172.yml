### 今回の調査で残る問い

- [ ] 『御府内備考 五十』の画像から東青柳町の水路記述を直接特定し、九尺・流路・「鼠ヶ谷下水」の原文と前後文脈を確認する。
- [ ] 1829年の九尺と、近代～昭和期資料の「一間ほど」を地点・年代別に比較し、音羽谷東側で水路幅が変化した区間を絞る。
- [ ] 神田上水との交差・合流関係を近世絵図と照合し、「鼠ヶ谷下水」がどの水路区間を指す名称だったかを確認する。
