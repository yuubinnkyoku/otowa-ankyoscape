name: Apply river research update 31

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.title == 'apply-readme-river-research-31'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append researched findings
        shell: bash
        run: |
          echo '' | base64 -d >> README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git rm .github/workflows/update-readme-river-research-31.yml
          git commit -m 'docs: add prewar Yabata culvert campaign and Ikebukuro terrain'
          git push origin HEAD:main
