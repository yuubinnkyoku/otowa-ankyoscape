name: Temporary cat research append

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-cat-research-append.yml'

permissions:
  contents: write

jobs:
  append-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append staged research
        shell: bash
        run: |
          if grep -q '\[S236\]' README.md; then
            echo 'S236 already present'
            exit 0
          fi
          cat .tmp-research-append-109.md >> README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: add spring-fed tributaries and wash places'
          git push origin HEAD:main
