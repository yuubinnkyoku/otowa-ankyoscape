name: Append river research findings

on:
  push:
    paths:
      - '.github/workflows/research-readme-append.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append verified research to README
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          marker = '# 61. 追加調査（2026-08-25・第47回）'
          if marker in text:
              raise SystemExit(0)

          addition = r'''
---

# 61. 追加調査（2026-08-25・第47回）

## 61.1 本郷4丁目で「東大下水」とみられる石垣構築の下水溝を発掘―谷端川・小石川支流の物証

全国文化財総覧に掲載された『真砂町遺跡第10地点』（2014年）は、**東京都文京区本郷4丁目36番2号**で2013年6月10日～9月6日に行われた400㎡の発掘調査を報告している。江戸時代の遺構として土坑35基、植栽痕12基、井戸5基、**下水溝1基**、道路2条などが確認された。〔確認／発掘調査報告書の公開書誌・抄録〕[S124]

そのうち調査区北側で検出された **石垣構築の下水溝** について、報告書は、かつて **谷端川・小石川へ通じた支流の一つで、いわゆる「東大下水（ひがしおおげすい）」と考えられる** としている。また、同遺構は江戸時代から明治20年頃まで約210年間使用され、その後暗渠となったと整理している。〔確認／報告書中の遺構解釈〕[S124]

これは、谷端川下流の支流について、旧版地形図や道路形状だけではなく、**本郷台地東端の傾斜地で実際の石組排水施設が発掘され、谷端川・小石川へ接続する支流と解釈された**事例である。既存[S123]の西片一丁目1-15で確認された埋没谷と合わせると、谷端川下流には本郷・丸山台側から複数の支谷・排水路が入る複雑な低地系があったことを、別種の証拠から具体化できる。〔観察〕[S123][S124]

ただし、発掘された下水溝そのものが自然河道を石組化したものか、当初から人工排水路として設けられたものかは、この公開抄録だけでは確定できない。また「東大下水」という呼称の成立時期、上流端、谷端川本流への正確な合流点も別途確認が必要である。〔未解決〕[S124]

## 61.2 1970年代の谷端川は「完全都市化した試験流域」として水文観測されていた―5.42 km²・不浸透面53.1％

助川登・北川善廣「都市化流域の洪水流出モデル」（土木学会論文報告集第325号、1982年）は、建設省土木研究所の谷端川観測資料を用いて洪水流出解析を行っている。論文が対象とした谷端川流域は **流域面積5.42 km²、流路延長3.4 km、流域斜面勾配1/69、市街化率100％、不浸透面積率53.1％** で、下水道が整備済みとされる。〔確認／土木学会論文〕[S125]

同研究系統の後続論文では、元資料を建設省土木研究所『都内谷端川・桃園川排水区水文観測資料（昭和47～49年）』（1975年）として参照し、1972年7月15日など実際の出水について計算値と観測値を比較している。したがって、少なくとも **1972～1974年の谷端川排水区には、降雨と流出を定量的に追う水文観測資料が存在した** ことが確認できる。〔確認／論文の参考文献・解析例〕[S125]

この数値は、戦前・戦後の暗渠化史とは別に、暗渠化後の谷端川が1970年代には **都市下水道・雨水排水系として水文学的に測定される対象へ変わっていた** ことを示す。同じ「谷端川」でも、自然河川史、暗渠工事史、下水道施設史に加えて、洪水流出を測る都市排水試験流域という段階を区別して扱える。〔観察〕[S125]

ただし、この **5.42 km²・流路3.4 km** は歴史的な谷端川全長約11 km全体の諸元ではなく、論文で設定された都市試験流域・排水区の値である。歴史的河道全体の流域面積・平均勾配として転用しない。観測点の位置、当時の下水管網境界、現在の谷端川幹線系統との対応は、元の土木研究所資料を確認して確定する必要がある。〔注意／未解決〕[S125]

### ここから追えること

- [ ] 『真砂町遺跡第10地点』本文・図版を確認し、石垣構築下水溝の平面位置、断面、方位、構築年代、改修痕を抽出する。
- [ ] 本郷4丁目36-2の発掘地点を1883年5千分1図、1909年・1921年1万分1地形図、旧地籍図へ重ね、「東大下水」の谷軸と谷端川・小石川への合流位置を復元する。
- [ ] 建設省土木研究所『都内谷端川・桃園川排水区水文観測資料（昭和47～49年）』の原本を探し、雨量計・流量観測点、排水区界、管渠網、観測期間を確認する。
- [ ] 1970年代の5.42 km²試験流域を、現在の谷端川幹線・谷端川上幹線・谷端川一号幹線の系統図と照合する。

## 追加出典

- **[S124]** 大成エンジニアリング株式会社埋蔵文化財調査部門『真砂町遺跡第10地点』B-134, 2014年7月31日―文京区本郷4丁目36番2号の発掘調査。調査区北側の石垣構築下水溝を、谷端川・小石川へ通じる支流「東大下水」と考えられる遺構として整理し、江戸時代から明治20年頃まで約210年使用後に暗渠化したとする。  
  https://sitereports.nabunken.go.jp/48072
- **[S125]** 助川登・北川善廣「都市化流域の洪水流出モデル」『土木学会論文報告集』第325号, 1982年9月―谷端川の都市試験流域を5.42 km²、流路3.4 km、斜面勾配1/69、市街化率100％、不浸透面53.1％、下水道整備済みとして解析。建設省土木研究所の谷端川水文資料を使用。関連する研究は元資料を『都内谷端川・桃園川排水区水文観測資料（昭和47～49年）』1975年として引用。  
  https://www.jstage.jst.go.jp/article/jscej1969/1982/325/1982_325_51/_pdf  
  https://cir.nii.ac.jp/crid/1572261549134088576
'''

          path.write_text(text.rstrip() + '\n\n' + addition.strip() + '\n', encoding='utf-8')
          PY

          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: add river archaeology and hydrology findings'
          git push
