name: insert-330

on:
  push:
    branches:
      - main
    paths:
      - '.330-bullet.txt'
      - '.330-insert.py'

permissions:
  contents: write

jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run insert script
        run: python3 .330-insert.py
      - name: Commit README and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/sources/INDEX.md
          git rm .330-bullet.txt .330-insert.py .github/workflows/insert-330.yml
          git commit -m "第330回: READMEに実行記録bulletを挿入しINDEXにGAZ-196・GAZ-197・BOOK-331行を追加（定期実行bot・ヘルパー自己削除）"
          git push
