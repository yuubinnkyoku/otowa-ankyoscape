name: Append pending research notes fixed

on:
  pull_request:
    types: [synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append S104 and S105
        shell: bash
        run: |
          if grep -q '\[S104\]' README.md || grep -q '\[S105\]' README.md; then
            echo 'S104/S105 already present'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import base64, re
          wf = Path('.github/workflows/append-s104-s105.yml').read_text(encoding='utf-8')
          m = re.search(r'^\s*APPEND_B64:\s*(\S+)\s*$', wf, re.M)
          if not m:
              raise SystemExit('APPEND_B64 not found')
          addition = base64.b64decode(m.group(1)).decode('utf-8')
          p = Path('README.md')
          p.write_text(p.read_text(encoding='utf-8').rstrip() + addition + '\n', encoding='utf-8')
          PY
      - name: Commit if changed
        shell: bash
        run: |
          if git diff --quiet README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: add geomorphology and Kamakura Bridge findings'
          git push origin HEAD:main
