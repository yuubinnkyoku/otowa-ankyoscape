name: Apply ankyoscape research update
on:
  push:
    paths:
      - '.github/workflows/ankyoscape-research-update.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append researched findings
        shell: bash
        run: |
          if ! grep -q '\[S238\]' README.md; then
            cat .research-update-124.md >> README.md
          fi
      - name: Remove staging files and commit
        shell: bash
        run: |
          git rm .github/workflows/ankyoscape-research-update.yml .research-update-124.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: add lower Koishikawa waterway findings'
          git push
