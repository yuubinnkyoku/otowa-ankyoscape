# 35. 追加調査（2026-08-20・第21回）

## 35.1 南長崎1丁目の「谷端橋」：1951年の橋梁が旧谷端川の交差位置を固定する基準点になる

豊島区の1996（平成8）年2月26日・区民建設委員会資料に掲載された東京都管理橋梁一覧では、**「谷端橋」**について、道路を **山手通り**、位置を **南長崎1丁目18番地先**、建設年を **昭和26（1951）年**、交差する施設を **「谷端川・区道」** と記録している。〔確認／豊島区議会資料に掲載された東京都管理橋梁一覧〕[S82]

さらに豊島区『公共施設の概要 平成19（2007）年度版』の「都管理の橋梁」一覧でも、**谷端橋／南長崎1-18先／交差：谷端川・区道**という組合せが再確認できる。〔確認／豊島区公的施設資料〕[S82]

この情報の価値は、橋名だけではない。既存READMEでは1951年5月20日に「椎名町駅より下流、武蔵野鉄道横断まで」の谷端川改修工事が竣工したことを記録しているが[S28]、今回の橋梁資料によって、少なくとも同じ1951年に **山手通りが谷端川と交差する地点が南長崎1丁目18番地先にあり、そこに東京都管理の谷端橋が建設された**ことを地点付きで確認できる。〔観察〕[S28][S82]

ただし、**1951年5月の谷端川改修工事と谷端橋建設が同一工事として一体施工されたことまでは、今回の一覧表だけでは確認できない。** また、2007年資料で「谷端橋」が橋梁として掲載され続けていることは、地上に開渠の谷端川が2007年まで残っていたことを意味しない。暗渠化後も道路・区道等を跨ぐ構造物として橋梁名称・管理単位が存続した可能性があるため、現況構造と旧河道を区別する。〔注意／未解決〕

一方、**南長崎1-18先**という位置は、旧谷端川の曲折部、1951年前後の河川改修、山手通り整備、後年の暗渠化を同じ地点で比較するための強い基準点になる。橋台・桁・暗渠函渠などの構造が現存するか、1951年当初図面に河道幅・橋長・縦断高が記録されていれば、旧河道の位置と高さをさらに具体化できる。〔推定／要橋梁台帳・竣工図確認〕

### ここから追えること

- [ ] 東京都または豊島区の橋梁台帳・竣工図で、谷端橋の橋長、幅員、構造形式、橋台位置、1951年の竣工年月を確認する。
- [ ] 1951年5月20日の谷端川改修工事[S28]と谷端橋建設の設計書・工事件名を照合し、同一事業・関連事業・別事業のどれかを確認する。
- [ ] 南長崎1-18先を旧版地形図・地籍図・1950年代航空写真に重ね、谷端川の河道中心線と山手通り・区道の交差形状を復元する。
- [ ] 暗渠化後も「谷端橋」が橋梁管理単位として残った理由と、現在の構造物の状態を橋梁点検資料・道路台帳で確認する。

