name: append research 20260821

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append researched findings
        shell: bash
        run: |
          if grep -q '\[S96\]' README.md; then
            echo 'README already updated'
            exit 0
          fi
          cat .tmp/research-20260821.md >> README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: add official evidence for Yabata tributaries and sewer history'
          git push origin HEAD:main
