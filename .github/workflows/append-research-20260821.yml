# 46. 追加調査（2026-08-21・第32回）

## 46.1 谷端川低地の1935年前後：雲雀ヶ谷2081番地に町工場が密集

豊島区立郷土資料館だより『かたりべ』44号（1996年11月30日）は、**1935（昭和10）年前後の「雲雀ヶ谷自由学園」**の写真を掲載し、所在地を **西巣鴨町大字池袋字雲雀ヶ谷2081番地（現・池袋本町4丁目）** と特定している。自由学園は1926（大正15）年、藤山友吉が自営の屋根板工場を改造して開設した保育施設だった。〔確認／豊島区立郷土資料館〕[S100]

同資料は、この場所を **赤羽線（現・JR埼京線）・東上鉄道（現・東武東上線）・谷端川にはさまれた三角形の低地帯** とし、そこには **町工場が密集していた** と説明する。また近くには、山手線開通工事の残土を積んだ通称「赤土山」があり、子どもの遊び場になっていたという。〔確認／同時代写真を紹介する郷土資料館資料〕[S100]

この記述により、1935年前後の池袋本町4丁目付近について、**旧字・番地・二つの鉄道・谷端川・町工場密集地**という土地利用条件を一地点に固定できる。〔観察〕[S100]

ただし、この資料だけでは雲雀ヶ谷2081番地がそれ以前に水田・湿地だったことや、町工場の立地が谷端川の水利用を目的としていたことまでは分からない。また「赤土山」の残土が谷端川低地そのものを埋め立てたとも断定できない。地目の変遷、工場種別、盛土範囲は地引絵図・土地台帳・工場台帳・旧版地形図・航空写真で別途確認する必要がある。〔未解決〕[S100]

## 46.2 豊島区景観計画：昭和期の宅地化で「谷端川沿いの一部」が例外として残った

豊島区『豊島区景観計画』の「池袋本町・上池袋地域」は、市街地の変遷について、1885（明治18）年の日本鉄道品川線開通、1914（大正3）年の東上鉄道開通、川越街道・明治通りの整備を経て、**昭和時代には「北西部の谷端川沿いの一部を除き宅地化が進みました」** と整理している。戦後には木造アパートの大量建設と住工混在化が進んだとも記す。〔確認／豊島区都市計画資料〕[S101]

同計画の等高線図には谷端川筋が示され、現在の谷端川北緑道を地域の地形・自然要素として位置づけている。〔確認〕[S101]

[S100]の1935年前後の雲雀ヶ谷低地の町工場密集という記録と合わせると、**谷端川沿いの低地は、周辺の宅地化とは異なる土地利用の推移を示した可能性**が強まる。〔観察〕[S100][S101]

一方、景観計画の「谷端川沿いの一部」が雲雀ヶ谷2081番地を直接指すとは限らず、土地利用変化を単純に「水田→工場地」とする根拠もまだない。旧筆ごとの地目と所有者、工場立地の時期を重ねて初めて判断できる。〔未解決〕[S100][S101]

### ここから追えること

- [ ] 雲雀ヶ谷2081番地を旧公図・地引絵図・土地台帳から現在地へ落とし、明治～昭和初期の地目変化を確認する。
- [ ] 1930年代の工場台帳・商工名鑑で、谷端川低地に集積した町工場の業種と番地を確認する。
- [ ] 「赤土山」の位置・規模を旧版地形図・戦前写真・戦後航空写真で確認し、谷端川低地の盛土との関係を検証する。
- [ ] 景観計画がいう「谷端川沿いの一部」の範囲を、計画作成時の基礎資料や土地利用図から具体化する。

