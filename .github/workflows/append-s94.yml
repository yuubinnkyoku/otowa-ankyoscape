name: append-s94
on:
  pull_request:
    types: [opened]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append research notes
        shell: bash
        run: |
          if grep -q '\[S95\]' README.md; then
            echo 'S95 already present; nothing to do.'
            exit 0
          fi
          echo '' | base64 -d >> README.md
      - name: Commit README
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: add archaeological and sewer-structure findings' || exit 0
          git push origin main
