# 121. 追加調査（2026-08-30・第107回）

## 121.1 谷端川西側の「中丸川」：地籍図上の水路敷は千川上水を越えて旧下板橋村・上板橋村境の北側まで続く

谷端川西側の支流・用水網について、Natrium.jp が2026（令和8）年7月6日に追加した現地調査では、板橋区教育委員会『板橋の地名』（1995年）に、**幸町に発して谷端川まで東西に流れた水路が地元で「中丸川」と呼ばれていた**とする記述を紹介している。〔地域地名資料を引用する二次資料〕[S232]

同調査が東京都主税局公開の地籍図をMapExpertで参照して確認したところ、中丸川本流とみられる水路敷は西前橋南側から西へ延びるだけでなく、上流側では**千川上水を越えた北側にも細長い水路敷が続き、その区画は東側の旧下板橋村と西側の旧上板橋村の境に沿う**。現地では2026年7月6日時点でも路地状の空間として確認でき、北へ進んだ三叉路付近で地籍図上の水路敷が終わる。〔地籍図を参照した現地観察〕[S232]

東京都主税局は、現在公開している23区地籍図を**固定資産税・都市計画税の課税参考資料として地番配置を示す1:1,000図**と説明しており、2026年公開版は2026年1月1日時点のデータである。一方で、同局自身が、地籍図は実際の土地形状・寸法や筆界・所有権を公的に証明するものではないと注意している。したがって、細長い区画の存在は現在まで残る地籍上の痕跡として利用できるが、**それだけで近世・近代の水路中心線や水路幅を数値的に確定しない。**〔確認／注意〕[S232]

〔観察〕この情報は、既存READMEで西前橋付近の1816年『嘉陵紀行』に現れる「用水」候補[S219]や、谷端川沿いの耕地整理前の水田・水路群を扱ってきた内容に対して、**谷端川西側には一本の支流だけでなく、中丸川とその南北に並行する複数の水路敷が地籍上残る**ことを具体化する。とくに千川上水北側まで続く区画が本当に中丸川の最上流部であれば、「中丸川は千川上水から単純に分水した」という図式ではなく、千川上水を横切る／その北側から来る既存水路との関係を検討する必要が生じる。

ただし、**千川上水北側の水路敷と中丸川本流が歴史的に連続していたか、千川上水との立体・平面交差がどのような構造だったか、上水から取水していたかは未確認**である。Natrium.jp も、千川上水との接続部や大谷口給水塔裏付近の谷頭について湧水の可能性を疑問形で示すにとどまる。したがって、今回の地籍図だけから「中丸川の水源は千川上水」「大谷口の湧水が水源」とはしない。〔未解決〕[S232]

さらに同じ地籍図では、西前橋へ北・西から水路敷が集まり、中丸川の南北にも複数の並行水路敷が確認される。金井窪橋・中丸橋付近でも西側から谷端川へ入る細長い区画が複数あり、現地には未舗装区間・細道・グレーチングを伴う空間が残るという。〔観察／現地調査〕[S232] これらが自然支谷、灌漑用水、排水路、耕地整理以前の側流のどれに当たるかは、旧地籍・耕地整理図・水利文書で分けて検証する必要がある。

### ここから追えること

- [ ] 板橋区教育委員会『板橋の地名』（1995年）の現物・該当頁を確認し、「中丸川」の名称、起点「幸町」、谷端川への合流記述を直接転記する。
- [ ] 東京都主税局の地籍図PDFを区画ごとに確認し、千川上水北側の細長い区画、中丸川本流、並行水路敷の地番・現在位置を一次資料側で固定する。
- [ ] 明治期地籍図・旧公図・1920年前後の池袋耕地整理資料を重ね、現在地籍に残る水路敷が耕地整理前から存在するか、整理後に再配置された排水路かを区別する。
- [ ] 千川上水との交差地点について分水口・樋・伏越・掛樋等の施設記録を探し、中丸川が上水から取水したのか、上水を横断する別系統水路だったのかを確認する。
- [ ] 大谷口給水塔裏付近の地形・旧版地図・湧水記録を確認し、地籍図上の最上流端よりさらに上流に自然谷・湧水が存在したか検証する。

