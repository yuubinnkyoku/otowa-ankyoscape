name: Temporary research updater S232-S233

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append staged research
        shell: bash
        run: |
          if grep -q '\[S232\]' README.md; then
            echo 'S232 already present; no change'
            exit 0
          fi
          cat .tmp-research-s232-s233.md >> README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: add cadastral and bridge evidence for Yabata River'
          git push origin HEAD:main
