name: Temporary append research 114
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append researched section once
        run: |
          if grep -Fq '[S220]' README.md; then exit 0; fi
          printf '\n' >> README.md
          cat .tmp-append-114.md >> README.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Document 1914 Mizukubo flood and Taisho urbanization evidence"
          git push origin HEAD:main
