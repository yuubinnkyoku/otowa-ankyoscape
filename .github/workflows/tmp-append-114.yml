# 114. 追加調査（2026-08-29・第106回）

## 114.1 水窪川上流・水久保：1914年8月の大雨で巣鴨監獄東側崖下の濁流が押し寄せ、田舟で救助したとの災害記録

国土交通省の災害伝承情報資料『現在までに語り継がれる「災害」について』は、豊島区の事例 **「水久保の大洪水」** として、**1914（大正3）年8月**の水害を収録している。被災地は **現在の豊島区東池袋4丁目付近（当時・高田村雑司ヶ谷）** とされる。〔確認／国土交通省の災害伝承資料による地域史料整理〕[S220]

同資料によれば、8月12～13日、24日、26日の三度の大雨で東京各地の河川・水路が氾濫し、水久保では **巣鴨監獄の東側崖下に集まった濁流が水久保一帯へ押し寄せ、当時多かった棟割長屋を浸水させ、屋根上に逃げ遅れた人々を田舟で救出した** と伝えられる。資料はこの記述の典拠として、豊島区立豊島図書館編『豊島の歳時記』郷土シリーズ第3集（1978年3月30日）を挙げている。〔確認／二次的な災害伝承記録〕[S220]

これは、水窪川そのものが1914年8月に越水したことを直接証明する河川工事・水防記録ではない。国交省資料の概況欄は神田川・神田上水・千川上水・藍染川など広域の氾濫をまとめており、水久保で押し寄せた水の全量を水窪川本流へ帰属させることはできない。〔注意〕[S220]

一方、**巣鴨監獄東側の崖下 → 水久保（東池袋4丁目付近）**という局地的な集水・流下方向が地域の災害記憶として記録されている点は重要である。既存READMEでは水久保を水窪川名の由来となった旧字として扱い、1999年の現地調査でも旧水窪川周辺の低地・浸水史を記録している。[S03][S93] 今回の資料は、少なくとも1914年にはこの低地で大雨時に崖下から水が集中し、住居地を浸水させる現象が起きたとする具体的な時点・場所を加える。〔観察／旧水窪川低地の集水性を補強〕[S220]

ただし、1914年の濁流が **旧水窪川の開渠だけを通ったのか、道路・側溝・田畑を面的に流れたのか、巣鴨監獄の排水施設が関係したのか** は未解決である。水窪川の河道位置、当時の監獄配置図、地形図、水害記録を重ねて検証する必要がある。

## 114.2 1924年には東京府の「高田診療所」が「高田町水久保」に所在――停留場名より前の行政的な地名使用を独立確認

東京都公文書館「東京府組織一覧（大正13年4月1日現在）」は、東京府社会課所管の診療所として **「高田診療所（北豊島郡高田町水久保）」** を掲載している。〔確認／東京都公文書館〕[S221]

既存READMEでは、王子電気軌道の停留場が1925（大正14）年11月に **「水久保」** として開業したことを確認している。[S201] 今回の1924年4月1日現在の東京府組織一覧により、少なくともその約1年半前には、**「水久保」が東京府の公的施設所在地を示す住所・地域名として現役で使われていた**ことを独立に確認できる。〔観察〕[S201][S221]

さらに国交省の災害伝承資料は、1926（大正15）年3月15日の **「水久保の大火事」** について、水久保付近には小さな棟割長屋が密集し、路地幅も約1mだったと記録する。焼失家屋600戸、罹災者2,000人超とされ、典拠は1914年洪水と同じ『豊島の歳時記』である。〔確認／国土交通省の災害伝承資料による地域史料整理〕[S220]

〔観察〕1924年の府立診療所所在地、1925年の停留場名、1926年の大火記録を並べると、**大正末期の水久保は単なる旧字名ではなく、公的施設・交通・高密度な住宅地の名称として同時代に認識される市街地になっていた**ことが分かる。[S201][S220][S221] これは、既存[S93]が記す大正期の水窪川流域への紙漉き業者の移住や、昭和初期から戦後にかけての下水化より前に、水久保周辺の都市化がかなり進んでいたことを示す土地利用上の補助線になる。

ただし、**都市化が1914年洪水を増幅した、または1926年までに水窪川が暗渠化されていた**とは今回の資料から言えない。むしろ既存[S03][S93]は下水化を昭和初期以降に置いており、1920年代の高密度化と河道・排水設備の状態を同時期の住宅明細図・下水道計画・火災保険図等で照合する余地がある。〔未解決〕

### ここから追えること

- [ ] 『豊島の歳時記』郷土シリーズ第3集（1978）の「水久保の大洪水」「水久保の大火事」該当頁を直接確認し、聞き取り元・原資料・記述範囲を確定する。
- [ ] 1914年8月の新聞・東京府水害記録・気象資料から、東池袋4丁目／水久保周辺の浸水範囲、水深、流下方向を独立に確認する。
- [ ] 1914年当時の巣鴨監獄配置図と旧水窪川・崖線・道路を重ね、「監獄東側崖下に集まった濁流」がどの谷筋・水路を通ったか検証する。
- [ ] 高田診療所の所在地を1924年前後の住宅明細図・地番資料で特定し、旧水窪川との距離、周辺の長屋・工場・農地の分布を確認する。
- [ ] 1926年大火前後の地図・写真から、水久保の棟割長屋密集地と水窪川開渠／排水路の位置関係を確認する。

## 追加出典

- **[S220]** 国土交通省関係資料『現在までに語り継がれる「災害」について』、豊島区事例No.131164-1「水久保の大洪水」・131164-3「水久保の大火事」―「水久保の大洪水」を1914（大正3）年8月、東池袋4丁目付近（当時高田村雑司ヶ谷）とし、巣鴨監獄東側崖下に集まった濁流が水久保一帯の棟割長屋を浸水させ、田舟で救助したとの伝承を収録。「水久保の大火事」は1926（大正15）年3月15日、焼失600戸・罹災者2,000人超、約1m幅の路地に棟割長屋が密集していたと記録。両項の出典を豊島区立豊島図書館編『豊島の歳時記』郷土シリーズ第3集（1978年3月30日）とする。**同時代一次記録ではなく、後年収集された地域史・災害伝承を国交省資料が整理したものとして扱う。**  
  https://www.hrr.mlit.go.jp/hokugi/wp-content/uploads/2023/02/database009_01_01.pdf

- **[S221]** 東京都公文書館「東京府組織一覧（大正13年4月1日現在）」―東京府社会課所管の診療所一覧に **「高田診療所（北豊島郡高田町水久保）」** を掲載。1924年4月1日時点で「水久保」が東京府の公的施設所在地として使用されていたことを確認できる。  
  https://www.soumu.metro.tokyo.lg.jp/01soumu-archives/07edo_tokyo/0702enkaku/0702f_t13
'''
          p.write_text(text.rstrip() + addition + "\n", encoding="utf-8")
