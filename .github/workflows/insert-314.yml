name: insert-314
on:
  push:
    branches: [main]
    paths: ['.314-bullet.txt']
permissions:
  contents: write
jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert round-314 bullet into README and INDEX
        run: python3 .314-insert.py
      - name: Commit README/INDEX and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .314-bullet.txt .314-insert.py .github/workflows/insert-314.yml
          git add README.md docs/sources/INDEX.md
          git commit -m "第314回: READMEに実行記録bulletを挿入しINDEXにGOV-590/ORG-050行を追加（定期実行bot・ヘルパー自己削除）" || echo "nothing to commit"
          git push
