name: insert-339

on:
  push:
    branches:
      - main
    paths:
      - '.339-bullet.txt'
      - '.339-insert.py'

permissions:
  contents: write

jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run insert script
        run: python3 .339-insert.py
      - name: Commit README and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git rm .339-bullet.txt .339-insert.py .github/workflows/insert-339.yml
          git commit -m "第339回: READMEに実行記録bulletを挿入（定期実行bot・ヘルパー自己削除）"
          git push
