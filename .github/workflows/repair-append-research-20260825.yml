name: Repair and append research 2026-08-25

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-append-research-20260825.yml'

permissions:
  contents: write

jobs:
  repair_append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original README and append verified research
        shell: bash
        run: |
          git checkout 70d931d71d55264b25f92e1f02fc3177f0000145 -- README.md
          cat .tmp/append-research-20260825.md >> README.md
          rm -f .tmp/append-research-20260825.md
          rm -f .github/workflows/repair-append-research-20260825.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .tmp/append-research-20260825.md .github/workflows/repair-append-research-20260825.yml
          git commit -m "Repair README and add verified river research [skip ci]"
          git push
