name: Fix S211 typo once

on:
  push:
    paths:
      - '.github/workflows/fix-s211-typo-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix typo and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/延びていはか/延びていたか/' README.md
          rm -f .github/workflows/fix-s211-typo-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix typo in S211 research note'
          git push
