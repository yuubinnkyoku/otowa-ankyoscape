name: insert-309
on:
  push:
    branches: [main]
    paths: ['.309-bullet.txt', '.309-insert.py', '.github/workflows/insert-309.yml']
permissions:
  contents: write
jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Run insert script
        run: python3 .309-insert.py
      - name: Commit and push
        run: |
          git config user.name "otowa-ankyoscape-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "第309回: INDEX行挿入・README bullet挿入とヘルパー削除" || echo "no changes"
          git push
