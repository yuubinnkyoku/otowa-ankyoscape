name: insert-bullet-290
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  insert-bullet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Insert bullet into README
        run: |
          python3 - <<'PY'
          import sys
          bullet = open('.290-bullet.txt', encoding='utf-8').read().strip()
          readme = open('README.md', encoding='utf-8').read()
          anchor = '\n- **第289回:'
          n = readme.count(anchor)
          assert n == 1, ('anchor count %d' % n)
          assert bullet.startswith('- **第290回:'), 'bullet prefix mismatch'
          assert readme.count('\n- **第290回:') == 0, 'bullet already present'
          i = readme.index(anchor)
          end = readme.index('\n', i + 1)
          new = readme[:end + 1] + bullet + '\n' + readme[end + 1:]
          assert new.count('\n- **第290回:') == 1
          open('README.md', 'w', encoding='utf-8').write(new)
          print('bullet inserted OK')
          PY
          rm .290-bullet.txt .github/workflows/insert-bullet-290.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "第290回: READMEの更新履歴にbulletを追記・ヘルパーを削除"
          git push
