name: Temporary README research update 8

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append researched source to README
        shell: bash
        run: |
          if grep -q '^# 22\. 追加調査（2026-08-20・第8回）' README.md; then
            echo 'README already updated.'
            exit 0
          fi
          printf '%s' '' | base64 -d >> README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: add Takada sewer monument chronology'
          git push