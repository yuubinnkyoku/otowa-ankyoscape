  https://www.gesui.metro.tokyo.lg.jp/documents/d/gesui/r5_nenpo_3-pdf

- **[S153]** 豊島区「としまひすとりぃ」オーラルヒストリー・現地ロケ編（横山庸佼氏ほか）―旧平和小学校跡周辺について、千川上水の余水・弁天の湧水、田んぼ、昭和28年ごろまで残った沼地を回想。また千早付近の山手通り拡幅前について、谷端川との間にもう1本の道路があったと証言。回想資料のため位置・年代・因果関係は別資料で要検証。  
  https://adeac.jp/toshima-history/texthtml/d000000/mp00500101/ht420150
