# 76. 追加調査（2026-08-26・第62回）

## 76.1 谷端川：2023～2024年にも「谷端川処理分区」を含む再構築調査が継続

東京都下水道局『令和5年度 東京都下水道事業年報』の設計委託一覧には、工事番号 **05114214「新河岸・落合処理区谷端川処理分区ほか2処理分区再構築調査設計」** が掲載されている。工事内容は **計画系統調査路線15km、流出解析450ha**、期間は **2023（令和5）年8月10日～2024（令和6）年6月13日** である。〔確認／東京都下水道局公的事業年報〕[S152]

既存[S150]では2011～2012年に「小台処理区谷端川処理分区ほか1処理分区調査設計」が行われていたことを確認している。今回の資料により、**「谷端川処理分区」という下水道計画上の名称が少なくとも2023～2024年にも再構築調査で使われていた**ことが分かる。谷端川幹線という物理的な管きょ名、谷端川処理分区という計画単位、2000年前後の都市計画上の施設名称を分けて扱う必要性がさらに強まる。〔観察〕[S150][S152]

ただし、件名は **「谷端川処理分区ほか2処理分区」** であるため、15km・450haはいずれも委託全体の数量であり、谷端川処理分区単独の延長・面積ではない。また「新河岸・落合処理区」とあるため、谷端川処理分区がこの委託内でどの処理区側に属するか、他2処理分区の名称・境界、2011年調査との区域の一致までは一覧表だけでは確定できない。〔注意／未解決〕[S152]

## 76.2 谷端川源頭・千早：住民回想では昭和28年ごろまで沼地が残った

豊島区「としまひすとりぃ」のオーラルヒストリー現地ロケ編で、旧平和小学校跡周辺を歩いた横山庸佼氏は、千川上水の余水と「弁天様」の湧水に触れたうえで、周辺には田んぼがあり、撮影時に立っていた十字路付近について **「昭和28年ぐらいまではまだ沼地だった」** と回想している。家が建つ頃まで湿地的な土地が残っていた、という生活記憶である。〔確認／豊島区オーラルヒストリーに記録された住民回想〕[S153]

既存[S128]では、千早2丁目39番の旧平和小学校校庭で採取した約4mの地層からイネ属の植物珪酸体・湿地性のヨシ属が検出され、1909年地形図でも谷端川両岸に水田が描かれることを確認している。今回の回想は年代・精度の異なる資料ではあるが、**谷端川水源低地の湿地・水田的土地利用が戦後初期まで局地的に残った可能性**を補強する。〔観察／地層資料と回想の照合〕[S128][S153]

同じ回想では、2011年3月11日の地震時に「この通り」や自宅など沼地だった場所で被害が目立った、という趣旨の証言もある。ただし、これは住民の経験・解釈であり、地盤調査や被害統計による確認ではないため、**旧沼地＝地震被害の原因**とは断定しない。ボーリング柱状図、微地形区分、2011年被害記録との照合が必要である。〔回想／未検証〕[S153]

## 76.3 谷端川沿い：山手通り拡幅前には川との間にもう1本の道路があったという回想

同じオーラルヒストリーで、横山氏は千早付近の山手通りについて、昔は現在より狭く、道路の向こう側に家が並び、**「谷端川との間にもう一本道があった」** と回想する。その道路をなくして家屋側を整理したため、山手通りを比較的広げやすかったのではないか、と述べている。〔確認／住民回想〕[S153]

この証言が指す旧道の正確な位置、道路廃止・家屋移転・山手通り拡幅の年代、谷端川旧河道との距離は、回想だけでは確定できない。ただし、旧版地形図・道路台帳・戦後航空写真を比較する際の**「山手通り―旧道―谷端川」という三列配置の候補**として記録する価値がある。〔観察／要地図検証〕[S153]

### 今回の調査で残る問い

- [ ] 工事番号05114214の設計書・系統図を確認し、「ほか2処理分区」の名称と谷端川処理分区単独の面積・調査延長を分離する。
- [ ] 2011～2012年の調査[S150]と2023～2024年の調査[S152]の処理分区境界を比較し、再構築計画の対象区域がどう変化したか確認する。
- [ ] 旧平和小学校周辺について、1950年代航空写真・住宅地図・地籍図を確認し、「昭和28年ごろまで沼地」という回想を土地利用の変化として検証する。
- [ ] 千早の旧谷端川低地について、ボーリング柱状図・地形分類図・2011年地震被害資料を重ね、回想された地盤差が地質資料でも説明できるか確認する。
- [ ] 山手通り拡幅前の旧道を旧版地形図・道路台帳・航空写真から特定し、谷端川旧河道との位置関係と廃道時期を絞る。

