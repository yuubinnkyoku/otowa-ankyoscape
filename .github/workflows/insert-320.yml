name: insert-320

on:
  push:
    branches:
      - main
    paths:
      - '.320-bullet.txt'

permissions:
  contents: write

jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run insert script
        run: python3 .320-insert.py
      - name: Commit README/INDEX and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/sources/INDEX.md
          git rm .320-bullet.txt .320-insert.py .github/workflows/insert-320.yml
          git commit -m "第320回: READMEに実行記録bulletを挿入しINDEXにMAP-223行を追加（定期実行bot・ヘルパー自己削除）"
          git push
