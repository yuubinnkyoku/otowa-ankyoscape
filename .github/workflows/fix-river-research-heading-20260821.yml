name: Fix river research heading 2026-08-21

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.title == 'fix-river-research-heading-20260821'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix heading and clean up
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          old = '\n29. 追加調査（2026-08-21・第15回）\n'
          new = '\n# 29. 追加調査（2026-08-21・第15回）\n'
          if old not in s:
              raise SystemExit('target heading not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/fix-river-research-heading-20260821.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/fix-river-research-heading-20260821.yml
          git commit -m "docs: fix river research section heading"
          git push origin main
