- **[S183]** 板橋区公文書館 電子展示室76号「板橋駅前！むかし写真館」―1980（昭和55）年撮影の板橋駅地下通路完成式典写真を収録。地下通路を「矢畑川自由地下通路ガード／矢畑川自由通路地下道架道橋」とし、通常は「谷端川」表記が多いが、この地下道名では「矢畑川」を使用すると注記  
