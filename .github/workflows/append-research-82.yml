name: Append research update 82

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-research-82.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append research update and remove one-shot workflow
        shell: bash
        run: |
          if ! grep -q '\[S183\]' README.md; then
            python3 -c "import base64; open('README.md','ab').write(base64.b64decode(''))"
          fi
          rm -f .github/workflows/append-research-82.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/append-research-82.yml
          git commit -m 'Add research update 82: Yabata name at Itabashi Station'
          git push
