name: Update README S85

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-readme-s85.yml'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append research note
        shell: bash
        env:
          S85_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, os
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          if '[S85]' not in text:
              addition = base64.b64decode(os.environ['S85_B64']).decode('utf-8')
              p.write_text(text.rstrip() + addition + '\n', encoding='utf-8')
          PY
      - name: Commit README and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/update-readme-s85.yml
          git add README.md
          git commit -m 'docs: add 1733 Tsurumaki River stone bridge source'
          git push origin HEAD:main
