name: append-s140
on:
  push:
    paths:
      - '.trigger-s140'
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append research note
        shell: bash
        run: |
          if grep -q '\[S140\]' README.md; then
            echo 'S140 already present'
            exit 0
          fi
          printf '%s' '' | base64 -d >> README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Add Yabata bridge-ledger research'
          git push
