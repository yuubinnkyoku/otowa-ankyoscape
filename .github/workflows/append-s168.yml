# 85. 追加調査（2026-08-27・第71回）

## 85.1 弦巻川：丸池の現地保存は1991年の地下下水道工事で中断し、1998年に隣接地へ史跡公園として再構成された

豊島区『広報としま』平成10（1998）年3月25日号は、弦巻川水源の丸池跡にあった**元池袋公園**について、昭和52（1977）年に「池袋」の地名由来の地を保存しようとする東京池袋ライオンズクラブの働きかけにより、公園内に**新しい池と記念碑**が設置されたと記録している。〔確認／豊島区広報〕[S168]

同号によれば、元池袋公園は**地下下水道工事のため平成3（1991）年から休園**となり、工事完了後の平成10（1998）年に**元池袋史跡公園**として再整備された。豊島区の現行公園ページも、旧公園が下水道工事のため隣接する現在地と土地を交換し、1998年4月に史跡公園が開園したと説明している。したがって、現在の元池袋史跡公園は丸池の旧位置をそのまま保存したものではなく、下水道工事を契機に隣接地へ移された記念空間として扱う必要がある。〔確認／豊島区広報・現行公園資料〕[S168]

1998年の区広報は、再整備後の池について**「昔のような丸池を復元したとは言えない」**と明記している。これは、現公園の水景や「池袋地名ゆかりの池」の碑を、近世・近代の丸池の形状・水面範囲・湧水位置そのものと同一視してはならないことを示す。現在の公園は、旧水源地の記憶を保存する史跡的な再構成であり、旧河道復元の座標資料として使う場合には旧元池袋公園の位置、1991年前後の下水道工事図、土地交換の境界を別に確認する必要がある。〔観察＋注意〕[S168]

さらに、丸池の水源史を年代でみると、既存資料が伝える近世の大きな湧水池、近代以降の縮小、1977年の記念的な「新しい池」、1991年からの工事休園、1998年の隣接地への史跡公園化という複数段階を分離できる。特に**1991年は、少なくとも旧公園上で丸池由来の場所を現地保存していた段階が中断した時点**として使える。ただし、自然の丸池が物理的に完全消滅した正確な工事年月、最後まで残っていた水面・湧水の状態、地下下水道工事の対象管渠名は今回の資料だけでは確定しない。〔観察／未解決〕[S168]

### ここから追えること

- [ ] 1991年からの「地下下水道工事」の工事名・対象幹線・施工範囲を東京都下水道局の工事台帳・竣工図から確認する。
- [ ] 1977年の元池袋公園、1991年休園直前、1998年元池袋史跡公園の各平面図を比較し、旧丸池・記念池・現在の水景の位置関係を復元する。
- [ ] 土地交換前後の公園境界を公園台帳・公図で確認し、現在の碑・池から旧丸池位置へどの程度ずれるかを測る。
- [ ] 自然の丸池が最後に水面・湧水を保っていた年代を、航空写真・写真資料・公園管理記録・住民証言から絞る。

