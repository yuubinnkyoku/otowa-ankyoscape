name: Append research 62

on:
  push:
    paths:
      - '.github/workflows/append-research-62.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append verified research to README
        shell: bash
        run: |
          echo '' | base64 -d >> README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Add research 62 on Yabata flood-control planning'
          git push origin HEAD:main
