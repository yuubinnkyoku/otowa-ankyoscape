# 132. 追加調査（2026-08-30・第132回）

## 132.1 弦巻川上流は1万分1地形図の上流端より西へ続く史料がある：1911年「番地界入」5千分1図と1925年町全図

弦巻川上流については、陸地測量部の1万分1地形図だけを見ると西武池袋線より東側で水路表示が終わる時期がある。しかし、より地番・町村界を細かく記した別系統の地図史料が存在する。〔確認／史料所在〕[S249][S250]

明治44（1911）年7月刊行の **『東京府北豊島郡高田村豊多摩郡戸塚村』** は、逓信協会・小林又七刊、東京逓信管理局の著作権表示をもつ **5千分1の「番地界入」地図**である。CiNii Booksでは筑波大学・東京大学駒場・一橋大学の所蔵を確認でき、国立国会図書館にも復刻版の書誌がある。特別区協議会は、この種の番地入り町村図について、郵便・電信集配のため局員が実地踏査して作成し、町名・番地変更に応じて改訂された地図群だと説明している。〔確認／公的・図書館書誌〕[S249]

さらに豊島区立郷土資料館の公式刊行物一覧には、地域地図集第1集として **1925（大正14）年4月10日発行『東京府下高田町・戸塚町』** が収録されている。〔確認／公的資料〕[S250]

Natrium.jp の2024年現地・地図調査は、これらの地図を比較し、**陸地測量部地図で水路表示が終わる地点よりさらに上流側が1911年高田村・戸塚村全図や1925年高田町・戸塚町全図では描かれている**と報告している。また、首都高速5号池袋線～都電荒川線間では、ブルーマップ・住居表示新旧対照表上の公図境界や一部の豊島区／文京区境が旧川筋とおおむね対応すると観察している。〔観察／二次資料による地図・地籍比較〕[S251]

これは、弦巻川の「源流＝丸池」という公的説明[S26]と矛盾するというより、**丸池から下流へ出る水路の線形を、通常の地形図より地番図系史料の方が長く追える可能性**を示す。特に1911年図は5千分1かつ番地界入りなので、旧河道を現在の街区・筆界へ落とす基準史料として価値が高い。〔推定〕

一方で、今回のウェブ調査では1911年・1925年の高精細原図を全域にわたり直接判読できていない。したがって、**「1911年図に描かれた全ての水路線＝弦巻川本流」「現在の区境＝旧河道中心線」までは断定しない。** Natrium.jp が示す公図境界との対応も、有力な位置復元材料ではあるが、筆界形成の年代や暗渠化・道路化に伴う換地を確認する必要がある。〔未解決〕[S251]

### ここから追えること

- [ ] 1911年5千分1『東京府北豊島郡高田村豊多摩郡戸塚村』の高精細画像を入手し、丸池～JR・西武池袋線～明治通り間の水路線・地番・村界を直接転記する。
- [ ] 1925年『東京府下高田町・戸塚町』、1926年『高田町北部住宅明細図』と重ね、上流端が版ごとに違う理由が図式省略なのか実際の水路変化なのかを検証する。
- [ ] 現在の公図・区境と1911年水路線を比較し、川筋と一致する区間／一致しない区間を分ける。特に清土鬼子母神堂付近から都電荒川線までを優先する。
- [ ] 1931～32年の下水道化・道路化時の換地、道路認定、下水道平面図を探し、蛇行河道から弦巻通り・雑司ヶ谷幹線へ移した区間を筆界変化から特定する。

## 132.2 暗渠化・道路化に伴う「曳家」の地域伝承：弦巻通り形成時に建物を移したとの証言

2026年6月8日の文春オンラインによる弦巻川現地取材では、弦巻通り沿いの赤丸ベーカリー店主が、**暗渠化されて道路ができた際、当時和菓子屋だった店を曳家で移動したと聞いている**と証言している。〔オーラルヒストリー／伝聞〕[S252]

この証言は工事記録そのものではないが、既存の「弦巻川を単純に蓋掛けしたのではなく、下水道と道路の線形に合わせて一部を付け替えた」という理解[S04][S05]と整合する。もし店舗の旧地番・建築台帳・道路敷取得記録を特定できれば、**河道→下水道・道路への変換時に、どの程度宅地側を動かしたか**を具体的な一点で検証できる可能性がある。〔推定〕

ただし店主自身の直接経験ではなく、前世代から「聞いた」内容であるため、移動年・移動距離・方向・工事主体は未確認である。1931年の下水道工事開始、1932年の暗渠化という既存年代と機械的に同一視しない。〔未解決〕[S252]

