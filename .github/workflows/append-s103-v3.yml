name: append-s103-v3
on:
  push:
    paths:
      - '.github/workflows/append-s103-v3.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update README
        shell: bash
        run: |
          python -c 'from pathlib import Path; import base64; p=Path("README.md"); t=p.read_text(encoding="utf-8"); a=base64.b64decode("").decode("utf-8"); p.write_text(t.rstrip()+"\n\n"+a.strip()+"\n", encoding="utf-8") if "[S103]" not in t else None'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git rm .github/workflows/append-s103-v3.yml
          git commit -m "docs: add 1964 Yabata culvert completion source"
          git push
