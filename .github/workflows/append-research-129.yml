name: Append research 129
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-research-129.yml'
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch research branch
        run: |
          git fetch origin research-129
          git switch research-129
      - name: Append staged text
        run: |
          test -f append129.md
          if ! grep -qF '[S245]' README.md; then
            cat append129.md >> README.md
          fi
      - name: Remove staging file
        run: rm append129.md
      - name: Commit README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md append129.md
          git commit -m 'docs: add Takada sewer approval chronology'
      - name: Push research branch
        run: git push origin research-129
