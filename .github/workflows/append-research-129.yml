# 129. 追加調査（2026-08-30・第129回）

## 129.1 弦巻川暗渠化を含む高田町下水道：1930年12月24日の「内閣認可」と12月29日の「内務省告示」は別の行政段階だった

既存READMEでは、高田町の下水道計画について、1929年の調査費計上、1930年の実地調査・設計、同年10月の町会可決、1931年の起工、1932年前後の弦巻川暗渠・道路化までを追っている。[S23][S56][S88][S177][S205] 今回、国立国会図書館が公開する1930（昭和5）年12月29日『官報』第1201号の目次から、**内務省告示第250号「東京都市計畫高田町下水道及其事業執行年割」**が同日付で掲載されたことを直接確認した。〔確認／国立国会図書館・官報〕[S246]

一方、豊島区立郷土資料館の2014年度秋の収蔵資料展解説リーフレットに収録された高田町年表は、**1930年12月24日に「高田町下水道築造、内閣認可」**、同年10月14日に高田町会が下水道条例を議決したと記録する。〔確認／豊島区立郷土資料館〕[S245]

〔観察〕これにより、既存[S56]で地域資料から確認していた「1930年12月29日・内務省告示」という日付を一次資料側で裏付けるとともに、**12月24日の内閣認可と12月29日の内務省告示を同一の出来事として混同しない**時系列が得られる。少なくとも資料上は、町会での条例議決→内閣認可→内務省告示という複数の行政段階を経ている。

さらに同リーフレットの年表は、**1931年1月27日に高田町会が下水道部設置規程を議決し、7月6日に下水道部処務規程・下水道部事務取扱規程を制定**したことを記す。また、1930年10月14日に議決された下水道条例について、**1931年12月12日に「更正許可」**があったとする。〔確認／豊島区立郷土資料館〕[S245]

〔観察〕これは、弦巻川の暗渠化を含む高田町下水道事業が、工事着手だけでなく**専管組織・事務規程を整えながら進められた町域規模の事業**だったことを行政史の側から具体化する。また、1931年12月12日の更正許可は、工事進行中にも条例上の変更・修正手続があったことを示す新たな時点資料になる。

ただし、**高田町下水道全体の認可・条例・組織に関する日付を、そのまま弦巻川の個別工区の施工日とみなさない。** 内務省告示第250号の「事業執行年割」がどの路線・工区・予算を含むか、1931年12月12日の「更正許可」が何を変更したのかは、官報本文、都市計画図、高田町会議事録・認可文書を直接確認するまで未確定である。とくに「更正」を流路変更・断面変更と直結させない。〔注意／未解決〕[S245][S246]

### ここから追えること

- [ ] 『官報』1930年12月29日第1201号 p.748 の内務省告示第250号本文を画像で確認し、認可対象、事業執行年割、計画区域・路線に関する記載を転記する。
- [ ] 1930年12月24日の内閣認可に対応する都市計画関係文書を探し、12月29日告示との法的・行政的な関係を確認する。
- [ ] 1931年12月12日の「更正許可」の原文・申請書・図面を確認し、条例の料金・徴収・組織上の変更なのか、工事計画にも関係する変更なのかを分ける。
- [ ] 1931年1月27日の下水道部設置規程、7月6日の処務規程・事務取扱規程を町会議事録等で確認し、弦巻川暗渠工事の担当部署・工区管理・直営施工との関係を具体化する。

