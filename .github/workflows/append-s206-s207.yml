name: append-s206-s207
on:
  push:
    paths:
      - '.trigger-s206-s207'
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append research note
        shell: bash
        run: |
          if grep -q '\[S206\]' README.md; then
            echo 'S206 already present'
            exit 0
          fi
          cat .s206-207-append.txt >> README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Add Yabata source-valley and Takada archive research'
          git push
