name: append-research-75

on:
  push:
    paths:
      - '.github/workflows/append-research-75.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append research findings
        shell: bash
        run: |
          cat .append-research-75.md >> README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git rm .append-research-75.md .github/workflows/append-research-75.yml
          git commit -m "Add Edo-period Mizukubo River note"
          git push
