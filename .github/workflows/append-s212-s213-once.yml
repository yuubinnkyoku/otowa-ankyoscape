name: Append research notes S212-S213 once

on:
  push:
    paths:
      - '.github/workflows/append-s212-s213-once.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append S212-S213 and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          grep -q '# 107. 追加調査（2026-08-29・第99回）' README.md
          if ! grep -q '\[S212\]' README.md; then
            printf '%s' '' | base64 -d >> README.md
          fi
          rm -f .github/workflows/append-s212-s213-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Add Yabata River post-culvert land-use chronology'
            git push
          fi
