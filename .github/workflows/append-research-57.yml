name: Append research 57

on:
  push:
    paths:
      - '.research-57-append.md'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append research once
        shell: bash
        run: |
          set -euo pipefail
          marker='# 71. 追加調査（2026-08-26・第57回）'
          if ! grep -Fq "$marker" README.md; then
            printf '\n\n---\n\n' >> README.md
            cat .research-57-append.md >> README.md
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md
            git commit -m 'Add research on 水窪川跡 and 大塚架道橋'
            git push
          fi
