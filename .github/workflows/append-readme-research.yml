name: Append latest river research

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append research to README
        shell: bash
        env:
          PAYLOAD_B64: 
        run: |
          if grep -q '^# 50\. 追加調査（2026-08-22・第36回）' README.md; then
            echo 'Section already present; skipping append.'
          else
            printf '\n\n' >> README.md
            printf '%s' "$PAYLOAD_B64" | base64 --decode >> README.md
          fi
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/append-readme-research.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/append-readme-research.yml
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'docs: add 1980s flood transition evidence'
          git push origin HEAD:main
