name: Append river research 2026-08-26 run 55

on:
  push:
    paths:
      - '.github/workflows/append-research-20260826-55.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append verified research and clean workflow
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '\[S139\]' README.md; then
            echo '' | base64 -d >> README.md
          fi
          rm -f .github/workflows/append-research-20260826-55.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/append-research-20260826-55.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Add river research update 55'
            git push
          fi
