name: Append S150-S151 research
on:
  push:
    paths:
      - '.research-s150-s151-trigger'
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append staged research
        run: |
          cat .s150-s151-append.txt >> README.md
          rm .s150-s151-append.txt .research-s150-s151-trigger .github/workflows/append-research-s150-s151.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: add research round 61 on sewer reconstruction and flood traces"
          git push