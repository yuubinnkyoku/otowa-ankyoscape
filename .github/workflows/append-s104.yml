# 48. 追加調査（2026-08-21・第34回）

## 48.1 国交省の土地履歴調査：下板橋～谷端川側にも、更新世の古い荒川水系に関係する谷地形がある

国土交通省 土地・水資源局 国土調査課『**土地分類基本調査（土地履歴調査）説明書「東京西北部」**』（2011年3月）は、旧版地図・空中写真・既存地形分類図などを用いて、人工改変前の自然地形と土地利用履歴を復元した公的調査である。〔確認／国土交通省土地履歴調査〕[S104]

同説明書の「3.2 地形細説」は、**板橋区志村西方の谷から板橋本町付近を通る一段低い段丘面が、谷端川上流が向きを変える東武東上線下板橋駅付近に至り、そこから現在暗渠化された谷端川の谷付近まで延びる**と整理している。さらに、この台地を刻む谷は周辺に多い東西方向ではなく**北西―南東方向**を示すため、武蔵野台地の大部分を形成した古多摩川系とは異なり、**古い荒川（更新世の古い利根川）水系に関係して形成された**と説明している。〔確認／国交省による地形解釈〕[S104]

これは既存[S01]の、弦巻川・水窪川上流の「高い河床」を更新世の旧河道とみなし、お茶の水女子大学付近を経て谷端川へ接続した可能性を考える仮説に対して、**谷端川側にも現在の谷端川だけでは説明しにくい古い谷地形が存在する**という独立した材料を加える。〔観察／既存仮説の地形的前提を部分的に補強〕[S01][S104]

ただし、国交省資料が直接述べるのは **志村西方―板橋本町―下板橋―谷端川側の低位面・谷地形** であり、**お茶の水女子大学付近や弦巻川・水窪川との地形的連続を示したものではない**。また、古い谷筋が存在したことと、当時の河川がどちら向きへ流れたかは別問題である。したがって、[S104]を根拠に「更新世の弦巻川・水窪川が谷端川へ流れていた」と確定することはできない。〔注意／未解決〕

現段階では、次のように評価するのが安全である。

- **〔確認〕** 板橋本町～下板橋～谷端川上流側に、周囲と方向・性格の異なる低位面・谷地形がある。[S104]
- **〔確認〕** 国交省は、その地形を古い荒川（更新世の古い利根川）水系と関係するものとして解釈している。[S104]
- **〔観察〕** 現在の谷端川が最近形成した単純な谷だけを利用しているのではなく、より古い地形を継承・利用している可能性を検討する根拠が強まる。[S01][S104]
- **〔未解決〕** その古い谷が弦巻川・水窪川側の「高い河床」と同じ時代・同じ谷系なのか、両者の間に地形・礫層・谷埋め堆積物の連続があるのか、古流向がどちらだったのか。

したがって、既存第4節の注意である **「谷筋の連続」と「水がどちら向きに流れたか」は別問題** は維持する。むしろ[S104]によって、地表の谷筋だけでなく、地下の礫層・ローム層・谷埋め堆積物を照合する必要性が高まった。

### ここから追えること

- [ ] 『東京西北部』の地形分類図で、志村西方―板橋本町―下板橋―谷端川の低位面・谷地形の範囲をGIS上に写す。
- [ ] お茶の水女子大学付近～谷端川・下板橋方向について、国土地理院DEMで縦横断面を作り、[S01]の推定旧河道との標高連続性を検証する。
- [ ] 東京都・国土地理院等のボーリング柱状図を集め、礫層上面、ローム層、谷埋め堆積物の高度・層相が両側で連続するか比較する。
- [ ] 古荒川・古利根川系とする国交省の解釈が依拠する地質・段丘研究を原文まで遡り、形成時期と古流向を確認する。
- [ ] [S37]の谷端川水源地付近研究本文を入手し、千早二丁目の更新世後期以降の地層・古環境と[S104]の古地形解釈が整合するか検証する。

## 追加出典

- **[S104]** 国土交通省 土地・水資源局 国土調査課『土地分類基本調査（土地履歴調査）説明書「東京西北部」』2011年3月、「3.2 地形細説」―板橋区志村西方から板橋本町付近を通る一段低い段丘面が、下板橋駅付近を経て暗渠化された谷端川の谷付近まで延びると整理。北西―南東方向の谷地形について、古い荒川（更新世の古い利根川）水系との関係を指摘。  
