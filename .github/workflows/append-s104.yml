# 48. 追加調査（2026-08-21・第34回）

## 48.1 国交省「東京西北部」：谷端川上流側の谷地形を古い荒川（更新世の古い利根川）水系とみる公的地形解釈

国土交通省 土地・水資源局 国土調査課『土地分類基本調査（土地履歴調査）説明書「東京西北部」』（2011年3月）は、既存の地形分類図、明治以降の旧版地図、昭和20年頃の空中写真、最新の空中写真などを用い、人工改変地についても**改変前の自然地形を復元して分類**した公的な土地履歴調査である。〔確認／国土交通省土地履歴調査〕[S104]

同説明書の「3.2 地形細説」は、**板橋区志村西方の谷から板橋本町付近を通る一段低い段丘面が、かつての谷端川の谷の上流部が向きを変える東武東上線下板橋駅付近に至り、そこから現在暗渠化された谷端川の谷付近まで延びる**と記している。さらに、この台地を刻む谷が**北西―南東方向**を示し、周辺の多くの台地の谷が東西方向を示すのと異なることから、この地形を形成した水系を**古い荒川（更新世の古い利根川）水系**に関係するものと解釈している。〔確認／国土交通省による地形解釈〕[S104]

これは既存[S01]の「弦巻川・水窪川上流の高い河床を更新世の旧河道とみなし、お茶の水女子大学付近を経て谷端川側へつながった可能性」という仮説を検討するうえで、**谷端川側にも更新世の古い水系に由来すると考えられる谷・低位面が存在する**という独立した公的根拠を追加する。〔観察／既存仮説の一部を補強〕[S01][S104]

ただし、国土交通省資料が具体的に述べているのは、志村西方―板橋本町―下板橋―暗渠化された谷端川付近の地形である。**お茶の水女子大学付近、弦巻川、水窪川との地形的連続や、更新世当時の水がどちら向きに流れたかは同資料では示していない。** したがって、[S01]の「弦巻川・水窪川 → 谷端川」という流向まで確認されたとは扱わない。〔未解決〕[S01][S104]

ここでは特に、**「谷筋が連続していた可能性」と「その谷を水がどちら向きに流れたか」は別問題**という既存READMEの注意がさらに重要になる。谷端川側の地形的な古さについては根拠が強まった一方、両側が同一の旧河道だったのか、同じ形成時期なのか、途中に分水界・河川争奪・流路逆転があったのかは、標高断面と地層の連続を確認するまで判断できない。〔観察／未解決〕

### ここから追えること

- [ ] 国土交通省「人工地形及び自然地形分類図」のGISデータを用い、志村西方―板橋本町―下板橋―谷端川の低位面を現在のDEM上へ重ねる。
- [ ] お茶の水女子大学付近から谷端川側までの標高断面を作り、[S01]がいう弦巻川・水窪川側の「高い河床」と[S104]の低位面が地形上連続するか確認する。
- [ ] 東京都のボーリング柱状図等を用いて、礫層・ローム層・谷埋め堆積物の高度と層相を比較し、両側が同一時期の旧河道か検証する。
- [ ] 古河床の縦断勾配を復元し、地形の連続性とは独立に更新世の流向を検討する。

## 追加出典

- **[S104]** 国土交通省 土地・水資源局 国土調査課『土地分類基本調査（土地履歴調査）説明書「東京西北部」』2011年3月―既存地形分類図・旧版地図・空中写真等から改変前の自然地形を復元。板橋区志村西方～板橋本町付近の一段低い段丘面が、下板橋駅付近の谷端川上流屈曲部を経て暗渠化された谷端川の谷付近まで延びるとし、この北西―南東系の谷地形を古い荒川（更新世の古い利根川）水系に関係するものと解釈。  
  https://nlftp.mlit.go.jp/kokjo/inspect/landclassification/land/land_history_2011/mapdata/533944/533944_REF.pdf
