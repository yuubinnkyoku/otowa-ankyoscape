name: Polish researched river notes

on:
  push:
    paths:
      - '.github/workflows/append-otowa-research.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Polish README wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('一斴', '一方')
          old = '水窪川との関係を説明する現地案内・地域資料では、排水口が周辺を流れていた水窪川へつながっていた可能性がある、という留保付きの説明がされている。したがってREADMEでは、'
          new = 'したがって、水窪川への接続については一次図面や管路資料が確認できるまで推定に留め、READMEでは、'
          text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet -- README.md; then
            echo 'No README polish needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: polish drainage connection caveat'
          git push origin HEAD:main
