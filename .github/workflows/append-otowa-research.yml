name: Append researched river notes

on:
  create:
  push:
    paths:
      - '.github/workflows/append-otowa-research.yml'
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  append:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append new findings to README
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          marker = '# 18. 追加調査（2026-08-20・第4回）'
          if marker in text:
              raise SystemExit(0)
          addition = base64.b64decode('').decode('utf-8')
          p.write_text(text.rstrip() + addition + '\n', encoding='utf-8')
          PY
          if git diff --quiet -- README.md; then
            echo 'No README change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: add drainage relic and Yabata promenade chronology'
          git push origin HEAD:main
