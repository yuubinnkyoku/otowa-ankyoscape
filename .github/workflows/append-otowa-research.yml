  https://www.mlit.go.jp/common/000024056.pdf
- **[S52]** 国土交通省「東京都　雑司ヶ谷幹線工事における事故について」, 2008年8月5日―事故第一報。SPR工法による管きょ更生L=600 m、雑司ヶ谷幹線を「□2100×1600」と記載  
  https://www.mlit.go.jp/report/press/city13_hh_000009.html
