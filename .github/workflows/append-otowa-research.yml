name: Append researched river notes

on:
  push:
    paths:
      - '.github/workflows/append-otowa-research.yml'
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  append:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append README research
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          marker = '# 20. 追加調査（2026-08-20・第6回）'
          if marker in text:
              raise SystemExit(0)
          addition = base64.b64decode('').decode('utf-8')
          p.write_text(text + addition, encoding='utf-8')
          PY
          if git diff --quiet -- README.md; then
            echo 'No README update needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m '2008年雑司ヶ谷幹線再構築資料を追記'
          git push origin HEAD:main