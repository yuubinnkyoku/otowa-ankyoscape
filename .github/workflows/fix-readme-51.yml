name: Fix README research update 51

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-readme-51.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct S134 interpretation and clean workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          s = s.replace('## 65.1 2023～2024年にも雑司ヶ谷幹線120mを対象に再構築調査―2008年の更生後も区間ごとの老朽化対策が続く', '## 65.1 2023～2024年にも雑司ヶ谷幹線が再構築調査対象―「外1幹線」は舎人雨水幹線')
          s = s.replace('作業概要は**流域踏査1.2ha、提案系統調査路線120m、管路内調査120m、構造解析（常時）2か所、構造解析（地震時）2か所**である。〔確認／東京都下水道局事業年報〕[S134]', '作業概要は、2幹線を合わせて**流域踏査1.2ha、提案系統調査路線120m、管路内調査120m、構造解析（常時）2か所、構造解析（地震時）2か所**である。〔確認／東京都下水道局事業年報〕[S134]')
          s = s.replace('同委託の対象を**「経年による管渠の老朽化が著しい雑司ヶ谷幹線及び合流雨水幹線」**と説明し', '同委託の対象を**「経年による管渠の老朽化が著しい雑司ヶ谷幹線及び舎人雨水幹線」**と説明し')
          s = s.replace('今回の資料はそれより約15年後にも、**雑司ヶ谷幹線系統が再構築のための管内調査・構造解析対象になっていた**ことを示す。', '今回の資料はそれより約15年後にも、**雑司ヶ谷幹線が再構築のための管内調査・構造解析を含む調査委託の対象になっていた**ことを示す。')
          s = s.replace('ただし、今回の**120mが2008年に施工された約600m前後の区間と重複するかどうかは、この2資料だけでは分からない**。また、件名の「外1幹線」は東京都下水道サービス資料では「合流雨水幹線」と説明されるが、その120mの内訳が雑司ヶ谷幹線と合流雨水幹線でそれぞれ何mなのか、具体的な施工・調査位置がどこなのかも未確認である。〔未解決〕[S134]', 'ただし、今回の**120mは雑司ヶ谷幹線と舎人雨水幹線を合わせた委託全体の数量であり、雑司ヶ谷幹線だけの延長とは確認できない**。したがって、2008年に施工された約600m前後の区間と重複するかどうかも、この2資料だけでは分からない。件名の「外1幹線」は東京都下水道サービス資料から**舎人雨水幹線**と確認できるが、120mの内訳と具体的な調査位置は未確認である。〔未解決〕[S134]')
          s = s.replace('- [ ] 「合流雨水幹線」の正式な路線・起終点・雑司ヶ谷幹線との接続位置を下水道台帳・事業計画図で確認する。', '- [ ] 委託全体120mのうち雑司ヶ谷幹線分の延長と調査位置を、特記仕様書・位置図・設計図書で確認する。')
          s = s.replace('東京都下水道サービス資料は対象を老朽化が著しい「雑司ヶ谷幹線及び合流雨水幹線」とし、受託額23,760千円と記載。', '東京都下水道サービス資料は対象を老朽化が著しい「雑司ヶ谷幹線及び舎人雨水幹線」とし、受託額23,760千円と記載。')
          p.write_text(s)
          PY
          rm -f .github/workflows/fix-readme-51.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Correct S134 trunk identification and scope'
          git push
