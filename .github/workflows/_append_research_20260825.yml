name: Temporary README research append

on:
  push:
    paths:
      - '.github/workflows/_append_research_20260825.yml'

permissions:
  contents: write

jobs:
  append-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append verified findings and remove temporary workflow
        shell: bash
        env:
          ADDITION_B64: 
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          marker = '# 58. 追加調査（2026-08-25・第44回）'
          if marker not in text:
              addition = base64.b64decode(os.environ['ADDITION_B64']).decode('utf-8')
              path.write_text(text.rstrip() + addition + '\n', encoding='utf-8')
          PY
          rm -f .github/workflows/_append_research_20260825.yml
      - name: Commit README update and cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/_append_research_20260825.yml
          git commit -m 'Add 1953 Yabata River waterway findings'
          git push
