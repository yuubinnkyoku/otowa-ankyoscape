name: append-s247-trigger3

on:
  push:
    branches: [main]
    paths:
      - '.research-trigger-s247-3'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append researched note
        shell: bash
        run: |
          if ! grep -Fq '# 130. 追加調査（2026-08-30・第130回）' README.md; then
            echo '' | base64 -d >> README.md
          fi
          rm -f .research-trigger-s247 .research-trigger-s247-2 .research-trigger-s247-3 .github/workflows/append-s247.yml .github/workflows/append-s247-trigger.yml .github/workflows/append-s247-trigger2.yml .github/workflows/append-s247-trigger3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: add 1998 public record on Yabata River use and memory'
          git push
