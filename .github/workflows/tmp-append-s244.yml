# 128. 追加調査（2026-08-30・第128回）

## 128.1 弦巻川の下水道化は一度で終わっていない：第二雑司ヶ谷幹線への流域切替を1996～2002年まで追える

既存READMEでは、弦巻川が1930年代に暗渠化され、その一部が現在の**雑司ヶ谷幹線**として残ること、また2008年8月5日に雑司ヶ谷二丁目で同幹線の再構築工事中に事故が起きたことを確認している。一方、豊島区の公的アーカイブには、これとは別に **1996（平成8）年7月2日「第二雑司ヶ谷幹線の概要」** という区民建設委員会資料が所蔵されている。〔史料所在確認／豊島区公的アーカイブ〕[S244]

東京都議会公営企業委員会の2001（平成13）年3月の答弁によれば、南池袋一丁目の通称**びっくりガード**では、従来から区の排水機場ポンプで道路排水を行っていたが、東京都下水道局は **1996年度に道路排水管の一部を第二雑司ヶ谷幹線へ取り込む工事を実施し、同幹線を暫定的な貯留にも利用した**。その後も改良が続けられたが、周辺道路やJR鉄道敷地から雨水が集中するため、強雨時の浸水はなお発生していたと説明されている。〔確認／東京都議会答弁〕[S244]

同じ答弁はさらに、**既設雑司ヶ谷幹線のうち山手線より西側の流域について、雨水・汚水を新設の第二雑司ヶ谷幹線へ流すための取水人孔（取り入れ人孔）を2002（平成14）年夏までに設置し、その後、面整備の再構築によって既設幹線流域の一部を順次第二雑司ヶ谷幹線へ切り替える**計画だったとする。第二雑司ヶ谷幹線は明治通り側に整備されたと議会で説明されており、旧弦巻川筋・既設雑司ヶ谷幹線の線形をそのまま複製した施設ではない。〔確認／東京都議会答弁〕[S244]

豊島区地域防災計画の2019年度修正案でも、第二雑司ヶ谷幹線は第二千川幹線・谷端川一号幹線（一部）・坂下幹線などとともに、**1時間50 mmの降雨に対応する幹線として整備済み**の施設に挙げられている。〔確認／豊島区防災計画〕[S244]

以上から、弦巻川の近代以降の水路史は、単純な「1930年代に川へ蓋をして現在まで同じ管を使用」という形では捉えにくい。少なくとも、**旧弦巻川 → 既設雑司ヶ谷幹線 → 第二雑司ヶ谷幹線への一部流域切替・暫定貯留・再構築**という複数段階の排水系統再編が確認できる。〔観察〕[S244]

ただし、今回確認した資料だけでは、1996年時点の第二雑司ヶ谷幹線の全延長・管径・管底高、既設雑司ヶ谷幹線との具体的な交差位置、2002年夏までに設けるとされた取水人孔の正確な地点までは確定できない。また、第二雑司ヶ谷幹線の地下線形を旧弦巻川の旧河道として扱うことはできない。旧河道復元と、後世の下水道流域・管路再編は区別する。〔注意／未解決〕[S244]

### ここから追えること

- [ ] 1996年7月2日「第二雑司ヶ谷幹線の概要」の図面を高精細画像で確認し、施工区間・管径・立坑・既設幹線との接続点を抽出する。
- [ ] 1996年7月15日「下水幹線整備状況」、2000年1月14日「東京都市計画下水道東京都公共下水道の変更について」と照合し、第二雑司ヶ谷幹線の計画変更・供用範囲を時系列化する。
- [ ] 2002年夏までに設置予定とされた取水人孔の竣工記録を探し、山手線西側のどの範囲が既設雑司ヶ谷幹線から第二雑司ヶ谷幹線へ切り替えられたかを地図化する。
- [ ] 旧弦巻川推定線・既設雑司ヶ谷幹線・第二雑司ヶ谷幹線・2008年再構築工事区間を重ね、自然河道と各時代の人工排水線がどこで一致し、どこで離れるかを検証する。

