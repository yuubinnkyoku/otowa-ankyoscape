name: temporary README research append

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  append:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append and commit research note
        shell: bash
        run: |
          python3 -c "import base64; open('README.md','ab').write(base64.b64decode(''))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: add second Zoshigaya sewer history"
            git push
          fi
