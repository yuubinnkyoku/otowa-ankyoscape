# 80. 追加調査（2026-08-27・第66回）

## 80.1 池袋本町2丁目西側は、1997年の防災資料でも「谷端川の谷底低地」として別区分されていた

豊島区の1997（平成9）年5月15日付資料「池袋本町地区の現況と課題」は、**池袋本町2丁目の西側を「谷端川の谷底低地」**として地図上で独立に区分し、**「揺れやすい地盤であり、震動被害を受けやすい箇所がある」**と記している。さらに、この低地側には老朽化した町工場・作業所・木造住宅がみられるとし、西側の谷端川緑道・児童遊園以外は公共空間が少ないことも挙げている。〔確認／豊島区の防災まちづくり資料〕[S159]

この資料は、旧谷端川筋が単に古地図上の河道として残るだけではなく、**暗渠化から30年以上後の都市防災計画でも「谷底低地」という地形単位として識別されていた**ことを示す。既存READMEでは、上池袋1丁目で旧谷端川低地に内水氾濫が生じた記録や、谷端川処理分区の現代的な浸水対策を整理しているが、今回の資料は水害とは別に、**地震時の地盤条件と、谷底低地上の土地利用（町工場・作業所・木造住宅）を同じ図上で結びつける**根拠になる。〔観察〕[S159]

ただし、1997年資料の「揺れやすい地盤」は地区計画上の防災評価であり、個々の敷地の地盤増幅率・沖積層厚・液状化可能性を直接測定した結果ではない。旧河道の正確な幅や埋積層の厚さを、この図だけから逆算しない。地盤モデル・ボーリング柱状図・土地条件図との照合が必要である。〔注意／未解決〕[S159]

### ここから追えること

- [ ] 1997年資料の「谷端川の谷底低地」図を現在の谷端川緑道・橋位置・1920年代の耕地整理街区と重ね、低地区分の幅と旧河道・旧水田域との対応を確認する。
- [ ] 池袋本町2丁目周辺の東京都地盤情報・ボーリング柱状図を確認し、谷底低地の軟弱層厚や地下水位が台地側とどの程度異なるか比較する。
- [ ] 1997年資料で低地側に集中するとされた町工場・作業所を、既存[S100][S101][S137]の土地利用史とつなぎ、河川低地が工業・住宅混在地へ変わった過程を時系列化する。

## 80.2 上池袋1丁目には谷端川へ注ぐ湧水支流があり、途中に「滝」と呼ばれた洗い場と瓢箪形の池があったという記録

地域史サイトD.2.C.は、豊島区立郷土資料館の研究成果「豊島区の湧き水をたずねて」を引用し、**上池袋1-3付近から湧き出した清水が北上し、上池袋1-14で東へ折れ、西巣鴨1-10の丹羽藤吉郎邸（のち山口玉造邸）内を通って谷端川へ注いでいた**と紹介している。途中の**上池袋1-27には洗い場があり、流れが急なため「滝」と呼ばれた**という。〔確認候補／豊島区郷土資料館研究の二次引用〕[S160]

同じ引用では、谷端川への合流付近の丹羽邸内に**瓢箪に似た大きな池**があり、のちに東京謄写堂社長・山口玉造の邸宅となってからは**「山玉（やまたま）の池」**と呼ばれたとされる。これは、谷端川本流だけでなく、上池袋側の崖・谷頭から湧く短い支流、生活上の洗い場、邸宅池が一つの小水系として連続していた可能性を示す。〔確認候補／二次引用＋観察〕[S160]

一方で、今回は郷土資料館の原論文・原図そのものの該当頁を直接確認できていない。したがって、**上池袋1-3→1-14→西巣鴨1-10という線形、「滝」という呼称、瓢箪池＝山玉の池の同定は、現段階では二次引用として扱う**。旧地籍図・住宅地図・郷土資料館紀要の原図で位置を再確認する必要がある。〔注意／未解決〕[S160]

### ここから追えること

- [ ] 豊島区立郷土資料館「豊島区の湧き水をたずねて」の原論文・原図を確認し、上池袋支流・洗い場・瓢箪池の記載を一次的に照合する。
- [ ] 上池袋1-3、1-14、1-27、西巣鴨1-10を旧地籍図・戦前住宅地図・航空写真へ落とし、支流の谷筋と池の位置を復元する。
- [ ] 「滝」と呼ばれた洗い場の落差が自然地形によるものか、堰・護岸・洗い場施設による人工的な落差かを確認する。
- [ ] 谷端川本流との合流地点を既存の橋・暗渠・下水道資料と重ね、この支流が現在の排水系へどのように取り込まれたか調べる。

## 追加出典

- **[S159]** 豊島区「池袋本町地区の現況と課題」（1997年5月15日、防災対策調査特別委員会関係資料）―池袋本町2丁目西側を「谷端川の谷底低地」と区分し、揺れやすい地盤・震動被害を受けやすい箇所、町工場・作業所・木造住宅の分布などを記載。  
  https://adeac.jp/viewitem/toshima-history/viewer/viewer/13_H090515_03/data/13_H090515_03.pdf

- **[S160]** D.2.C.「宮仲（巣鴨村） 谷端川 上池袋支流（瓢箪池支流） 滝と呼ばれた洗い場跡 瓢箪池跡（山玉の池）」（2021年3月2日）―豊島区立郷土資料館の「豊島区の湧き水をたずねて」を引用し、上池袋1-3付近の湧水から谷端川へ注ぐ小川、上池袋1-27の「滝」と呼ばれた洗い場、丹羽藤吉郎邸の瓢箪池／山玉の池を紹介。**原論文該当頁を今回直接確認できていないため二次引用として扱う。**  
  https://www.d-2-c.jp/column_back174.html
