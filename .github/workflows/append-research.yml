name: Append research section

on:
  push:
    paths:
      - '.append-trigger.txt'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append staged research
        shell: bash
        run: |
          cat .append-research.md >> README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: add research round 66"
          git push
