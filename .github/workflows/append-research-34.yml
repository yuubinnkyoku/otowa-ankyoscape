# 48. 追加調査（2026-08-21・第34回）

## 48.1 谷端川側にも更新世の古い谷地形：国交省の土地履歴調査は古い荒川水系との関係を指摘

国土交通省 土地・水資源局 国土調査課『土地分類基本調査（土地履歴調査）説明書「東京西北部」』（2011年3月）は、旧版地図・空中写真・既存地形分類図などを用いて、人工改変前の自然地形を復元した公的な土地履歴調査である。[S104]

同説明書の「3.2 地形細説」は、**板橋区志村西方の谷から板橋本町付近を通る一段低い段丘面が、谷端川上流部が向きを変える東武東上線下板橋駅付近に至り、そこから現在暗渠化された谷端川の谷付近まで延びる**と記している。さらに、この谷が周辺で目立つ東西方向ではなく**北西―南東方向**を示すことから、この台地の形成を**古い荒川（更新世の古い利根川）水系**に関係するものと考えている。〔確認／国土交通省土地履歴調査〕[S104]

これは既存[S01]の「弦巻川・水窪川上流の高い河床を更新世の河道とみなし、お茶の水女子大学付近を経て谷端川方向へつながった可能性」という仮説に対して、**谷端川側にも現在の谷端川だけでは説明しきれない古い水系に由来すると解釈された谷地形が存在する**という独立した材料を加える。〔観察〕[S01][S104]

ただし、国交省資料が直接述べているのは志村西方―板橋本町―下板橋―谷端川側の地形であり、**お茶の水女子大学付近や弦巻川・水窪川側まで同じ谷が連続するとは述べていない。** また、古い河川の流向も示していない。したがって、[S01]の旧河道接続説そのものが確認されたとは扱わず、**仮説Dの地形的前提を谷端川側から部分的に補強する資料**とする。〔観察／仮説補強〕[S104]

残る問題は、両側の谷地形が同時代のものか、礫層・谷埋め堆積物が連続するか、そして古流向がどちら向きだったかである。**「谷筋の連続」と「水の流向」は引き続き別問題**として扱う。〔未解決〕

## 48.2 谷端川の「鎌倉橋」：旧橋位置を現交差点の約10 m上流まで絞れる

『広報としま』第1322号（2005年8月5日）の「みち［鎌倉街道］⑩」は、明治通りを北上した**上池袋4丁目11番と北区滝野川7丁目49番の間の交差点**に、かつて谷端川へ架かる木橋「鎌倉橋」があったと記録している。江戸時代には**池袋村・巣鴨村・滝野川村の村境**で、2005年時点でも豊島区・北区の区境に当たるとしている。〔確認／豊島区広報〕[S105]

さらに同記事は、鎌倉橋の旧位置を**現在の交差点から約10 m上流（西側）**とし、昭和初期に明治通りが開通すると新しい橋が架けられ、その後谷端川の旧跡化が進み、**1937（昭和12）年の地図から鎌倉橋が消える**と説明する。掲載写真の説明でも、明治通り交差点から王子方面を望み、谷端川が左から右へ流れていたとしている。〔確認／豊島区広報による位置・地図解説〕[S105]

この情報により、谷端川旧河道・村境・現在の区境を照合するための基準点を、少なくとも**現交差点＋約10 m西側**まで絞れる。〔観察〕 ただし、「1937年の地図から橋が消える」ことは、その年までに当該区間の川そのものが完全に暗渠化されたことを直接意味しない。記事が参照した地図の種類と、橋の撤去・暗渠工事の施工年は別途確認する。〔未解決〕[S105]

また、既存[B04]には**弦巻川にも「鎌倉橋」**という橋名が記録されている。今回の[S105]は上池袋・滝野川境の**谷端川に架かる別の鎌倉橋**であり、同名橋として混同しない。

### ここから追えること

- [ ] お茶の水女子大学付近から下板橋までのDEM断面・ボーリング柱状図を比較し、[S01]と[S104]の谷地形について礫層上面・ローム層・谷埋め堆積物の連続性を検証する。
- [ ] 国交省の自然地形分類図GISデータで、志村西方―板橋本町―下板橋―谷端川の低位面・谷底低地を抽出し、現在の谷端川旧河道と重ねる。
- [ ] 『広報としま』[S105]が参照した1937年地図を特定し、鎌倉橋の新旧位置、谷端川の開渠／暗渠表現、明治通りの道路敷を確認する。
- [ ] 鎌倉橋について道路・橋梁台帳、明治通りの開通・拡幅資料、地籍図を調べ、旧橋から新橋への架替年と撤去年を絞る。
- [ ] 江戸期の池袋村・巣鴨村・滝野川村境と現在の豊島区・北区境を重ね、谷端川が行政境界として継承された範囲を確認する。

