# 95. 追加調査（2026-08-28・第79回）

## 95.1 弦巻川：暗渠・道路化の際、川沿いの店舗を曳家したという具体的な口述が残る

葉上太郎による2026年6月8日の弦巻川調査記事では、雑司が谷1丁目・弦巻通り沿いの**赤丸ベーカリー**店主が、家族から聞いた話として、現在の店舗周辺では弦巻川が**店の裏側付近を流れていた**こと、暗渠化して道路を造る際、当時和菓子屋だった店舗を**曳家で移動した**と証言している。〔確認／2026年の現地聞き取り・伝聞口述〕[S177]

この証言は、既存READMEで古地図・区界・下水道資料から追ってきた **「旧弦巻川の河道と、暗渠化後の雑司ヶ谷幹線・弦巻通りは完全には一致しない」** という観察を、沿道建物の移動という別系統の生活史料から補強する。単に蛇行した川へ蓋をしてその真上を道路化しただけなら、道路造成時の曳家を必ずしも説明できない。少なくとも赤丸ベーカリー周辺では、**暗渠・道路化に伴って道路線形または道路幅員を確保するため、既存建物の位置を調整した可能性**を検討する価値がある。〔観察／既存仮説を補強する手掛かり〕[S113][S148][S176][S177]

一方、これは店主自身が工事を見た同時代証言ではなく、家族から伝わった話である。記事も移動距離・方向・工事年・工事主体を示していないため、**「1932年に何m移動した」「旧河道から現在地へ直接移した」などとは断定しない。** また、赤丸ベーカリーは現在パン店だが、地域記事では前身を生菓子・和菓子系の店舗として紹介しており、1923（大正12）年創業とされる。暗渠工事が1931年に始まったという既存資料と年代的には整合するものの、創業地が現在地と同一だったか、曳家が1931～32年のどの工程に対応するかは未確認である。〔注意〕[S177]

この地点は、**暗渠化前の河道・暗渠後の幹線・道路・建物位置の4レイヤーを同時に比較できる候補**になる。1920年代後半～1930年代前半の火災保険特殊地図、地籍図、高田町下水道工事平面図、建築関係資料が見つかれば、曳家の方向と距離から旧河道と新設道路のずれを具体化できる可能性がある。〔推定／検証課題〕

### 第79回の追加出典

- **[S177]** 葉上太郎「『えっ、ここを川が流れていたの？』地元では言い伝えが残るだけ…かつて池袋を流れていた『幻の川』の流域をたどる」文春オンライン、2026年6月8日―弦巻通り沿いの赤丸ベーカリー店主への聞き取りとして、店舗裏側付近を弦巻川が流れていたという伝承と、暗渠化・道路造成時に当時の和菓子屋を曳家で移動したという家族伝承を記録。記事自身も、旧河道と雑司ヶ谷幹線・弦巻通りの線形が微妙に異なると整理している。**同時代工事記録ではなく伝聞口述なので、移動距離・方向・工事年は未確定として扱う。**  
