name: Append README

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append researched material when staged
        run: |
          if [ ! -f .append-readme.md ]; then
            echo "No staged README append; nothing to do."
            exit 0
          fi
          printf '\n' >> README.md
          cat .append-readme.md >> README.md
          rm .append-readme.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .append-readme.md
          git commit -m "Document Nakamaru River tributary research"
          git push
