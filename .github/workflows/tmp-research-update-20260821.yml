name: Temporary README research update

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  update-readme:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.title == 'run-maruike-senkawa-update-20260821'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply researched README addition
        shell: bash
        run: |
          awk "/# cat >> README.md <<'EOF'/{flag=1;next} /# EOF$/{flag=0} flag" .github/workflows/append-maruike-senkawa-20260821.yml | sed 's/^# //' >> README.md
          rm -f .github/workflows/append-maruike-senkawa-20260821.yml .github/workflows/tmp-research-update-20260821.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/append-maruike-senkawa-20260821.yml .github/workflows/tmp-research-update-20260821.yml
          git commit -m "docs: add Maruike water-rights and Senkawa map dating"
          git push origin main
