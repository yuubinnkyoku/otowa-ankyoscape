name: Temporary research append 122

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  append-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append research findings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          if '[S234]' in text or '[S235]' in text:
              raise SystemExit('S234/S235 already present')
          appendix = base64.b64decode('¦quawtOWFrOWckuOBoOOBkeOBp+OBquOBj+OAgeOAkumJhOmBk+S4i+OBruWcsOS4i+emAmui3r+WQjeOBq+OCguaXp+ays+W3neOBruiomOaHo+OBjOS/neWtmOOBleOCjOOBnOOAkQ==').decode('utf-8')
          p.write_text(text.rstrip() + appendix + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: add Yabata River name and bridge findings'
          git push origin HEAD:main
