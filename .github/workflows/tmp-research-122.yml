name: Temporary research append 122

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  append-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append research findings
        shell: bash
        run: |
          if grep -q '\[S234\]' README.md || grep -q '\[S235\]' README.md; then
            echo 'S234/S235 already present'
            exit 0
          fi
          cat .tmp-research-122-appendix.md >> README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: add Yabata River name and bridge findings'
          git push origin HEAD:main
