name: One-shot README research update

on:
  push:
    paths:
      - '.github/workflows/one-shot-readme-research.yml'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-water-sources-20260820
      - name: Update README
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')

          def once(old, new):
              global s
              if s.count(old) != 1:
                  raise SystemExit(f'anchor count {s.count(old)} for: {old[:80]!r}')
              s = s.replace(old, new, 1)

          water_section = '''
### 1999年の郷土資料館フィールドワーク：美久仁小路から江戸川橋まで約4 km

豊島区立郷土資料館だより『かたりべ』56号は、1999年10月9日に地域史講座「失われた水辺を探る―水窪川・谷戸川跡を歩こう―」の一環として **「水窪川跡を歩く」** を実施し、**美久仁小路（東池袋1丁目）から護国寺・音羽通りを経て江戸川橋（文京区）まで、約4 km** を歩いたと記録している。〔確認／地域史講座記録〕[S41]

これは歴史上の水窪川そのものの河川長を4 kmと確定する資料ではなく、**1999年時点で郷土資料館が旧流路として現地追跡した経路と距離**を示す資料である。現在の作業仮説である「美久仁小路付近の源頭―護国寺―音羽谷―江戸川橋」という線形を、公的な現地調査記録から補強する。
'''
          once('\n---\n\n## 2.2 弦巻川', '\n' + water_section + '\n---\n\n## 2.2 弦巻川')

          maruike_section = '''
### 「丸池＝池袋地名由来」は確定した語源ではなく、検証対象でもある

豊島区立郷土資料館研究紀要『生活と文化』第18号には、青木哲夫「**丸池（「池袋地名由来の池」）説話成立に関する文献的考証**」（2009）が掲載されている。〔史料所在確認〕[S43]

論文本文の結論はまだ本調査で精読していないため、ここから池袋地名の語源を確定しない。ただし、**「丸池が池袋の地名の由来である」という説明そのものが文献的考証の対象になっている**ことは重要である。したがって本READMEでは、丸池が弦巻川の水源だったという公的説明[S26]と、池袋という地名の語源説とを分けて扱う。
'''
          once('\n### 1772年の雑司谷村絵図：弦巻川の確認年代を大きく遡れる可能性', '\n' + maruike_section + '\n### 1772年の雑司谷村絵図：弦巻川の確認年代を大きく遡れる可能性')

          springs_section = '''
### 2000～01年の郷土資料館調査：区内の湧水・支流・池・洗い場を体系的に追った資料

豊島区立郷土資料館は2000年に地域史講座「**失われた水辺を探る―豊島区の湧き水をたずねて―**」を実施し、『かたりべ』60号で講座終了を報告している。翌2001年12月25日発行の研究紀要『生活と文化』第11号には、横山恵美「**豊島区の湧き水をたずねて**」が調査ノートとして掲載された。〔史料所在確認〕[S42]

公開されている公式目次から論文の所在・題名・発行年は確認できるが、本調査では本文全体をまだ直接精読していない。このため、個々の湧水・支流・池・洗い場の位置や消滅年代は、二次サイトの転載だけを根拠に確定しない。

一方、二次資料ではこの調査ノートが **谷端川・弦巻川・水窪川・谷田川へ注ぐ小流、周辺の湧水、池、洗い場** を扱う資料として繰り返し参照されている。したがって本文を入手できれば、現在READMEで薄い **谷端川の湧水支流網、生活用水としての洗い場、池との接続関係** を具体化できる可能性が高い。〔推定／本文要確認〕[S42]
'''
          once('\n### 現在の下水道幹線は治水・貯留施設としても使われている', '\n' + springs_section + '\n### 現在の下水道幹線は治水・貯留施設としても使われている')

          once('| 1999 | 『旧谷端川の橋の跡を探る』発行 | 橋名・橋位置調査の重要資料候補。[S29] |', '| 1999 | 『旧谷端川の橋の跡を探る』発行 | 橋名・橋位置調査の重要資料候補。[S29] |\n| 1999 | 郷土資料館「水窪川跡を歩く」 | 美久仁小路から護国寺・音羽通りを経て江戸川橋まで約4 kmを現地追跡。[S41] |\n| 2000～01 | 「豊島区の湧き水をたずねて」講座・調査ノート | 区内の失われた湧水・支流・池・洗い場を追う重要資料。本文精読が必要。[S42] |\n| 2009 | 丸池の地名由来説を文献的に検証した専論 | 「丸池＝池袋地名由来」を水源史とは分けて検証する必要を示す。[S43] |')

          once('- [ ] 水窪川の1986年案内表示・辻広場の正確な位置、整備事業名、施工年を公園・まちづくり資料から確定する', '- [ ] **横山恵美「豊島区の湧き水をたずねて」本文を入手し、谷端川・弦巻川・水窪川の湧水・支流・池・洗い場を地図化する**\n- [ ] 青木哲夫「丸池（「池袋地名由来の池」）説話成立に関する文献的考証」本文を精読し、丸池の水源史と池袋地名由来説を切り分ける\n- [ ] 水窪川の1986年案内表示・辻広場の正確な位置、整備事業名、施工年を公園・まちづくり資料から確定する')

          once('- **[S33]** 豊島区「わが街ひすとりぃ　第8回　日出」現地ロケ編全文テキスト—旧水窪川筋の辻広場、1986年の「水窪川　小さな川が流れていた　後世に伝える」案内表示についてのオーラルヒストリー  \n  https://adeac.jp/toshima-history/texthtml/d000000/mp00500101/ht420120', '- **[S33]** 豊島区「わが街ひすとりぃ　第8回　日出」現地ロケ編全文テキスト—旧水窪川筋の辻広場、1986年の「水窪川　小さな川が流れていた　後世に伝える」案内表示についてのオーラルヒストリー  \n  https://adeac.jp/toshima-history/texthtml/d000000/mp00500101/ht420120\n- **[S41]** 豊島区立郷土資料館だより『かたりべ』56号, 1999年12月10日—地域史講座「失われた水辺を探る―水窪川・谷戸川跡を歩こう―」を終えて。10月9日の「水窪川跡を歩く」で、美久仁小路（東池袋1丁目）から護国寺・音羽通りを経て江戸川橋まで約4 kmを歩いたと記録  \n  https://www.city.toshima.lg.jp/documents/2548/kataribe56.pdf')

          once('- **[S40]** 東京都議会「平成二十八年 東京都議会環境・建設委員会速記録第十三号」—下板橋駅付近の谷端川幹線は浅い位置のボックスカルバートで、補助73号線アンダーパス整備には移設が必要と説明  \n  https://www.gikai.metro.tokyo.lg.jp/record/environmental-construction/2016-13.html', '- **[S40]** 東京都議会「平成二十八年 東京都議会環境・建設委員会速記録第十三号」—下板橋駅付近の谷端川幹線は浅い位置のボックスカルバートで、補助73号線アンダーパス整備には移設が必要と説明  \n  https://www.gikai.metro.tokyo.lg.jp/record/environmental-construction/2016-13.html\n- **[S42]** 豊島区立郷土資料館研究紀要『生活と文化』第11号, 2001年12月25日—横山恵美「豊島区の湧き水をたずねて」（調査ノート）。2000年の同題地域史講座は『かたりべ』60号にも記録  \n  https://www.city.toshima.lg.jp/129/bunka/bunka/shiryokan/kankobutu/005957.html  \n  https://www.city.toshima.lg.jp/129/bunka/bunka/shiryokan/kankobutu/kataribe/005996.html')

          once('- **[S27]** 豊島区史「平成ひすとりぃ」—池袋西口公園GLOBAL RINGの意匠と弦巻川水源「丸池」  \n  https://adeac.jp/toshima-history/texthtml/d100010/mp101000/ht0402030', '- **[S27]** 豊島区史「平成ひすとりぃ」—池袋西口公園GLOBAL RINGの意匠と弦巻川水源「丸池」  \n  https://adeac.jp/toshima-history/texthtml/d100010/mp101000/ht0402030\n- **[S43]** 青木哲夫「丸池（「池袋地名由来の池」）説話成立に関する文献的考証」『生活と文化』18, 豊島区教育委員会, 2009年3月27日, pp.3–20（本文未精読、書誌確認）  \n  https://cir.nii.ac.jp/crid/1390574334779064960  \n  豊島区刊行物一覧： https://www.city.toshima.lg.jp/129/bunka/bunka/shiryokan/kankobutu/005957.html')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --cached --exit-code && exit 0
          git commit -m 'Add spring-water and fieldwork archival findings'
          git push origin HEAD:research-water-sources-20260820
