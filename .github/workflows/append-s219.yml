name: Append S219 research note once

on:
  push:
    paths:
      - '.github/workflows/append-s219.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append research note and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          test -f .tmp-s219.md
          ! grep -q '\[S219\]' README.md
          cat .tmp-s219.md >> README.md
          rm -f .tmp-s219.md .github/workflows/append-s219.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Document 1816 Yabata irrigation-landuse evidence'
          git push
