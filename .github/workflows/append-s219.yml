# 113. 追加調査（2026-08-29・第105回）

## 113.1 谷端川・西前橋付近：1816年の『嘉陵紀行』では、池袋村から金井窪村へ向かう道が田圃の中で「用水」を横切ったと記録される

村尾正靖（嘉陵、1760–1841）の紀行『嘉陵紀行』に収められた吹上観音参詣の記録は、文化13年閏8月20日（1816年10月11日）に江戸から現在の和光市方面へ向かった道中を記したものである。国立国会図書館では、江戸叢書刊行会が1916（大正5）年に刊行した『嘉陵紀行 : 全五編』がデジタル化され、インターネット公開されている。〔確認／公的書誌・公開原典の所在確認〕[S219]

2025年にこの紀行の道筋を現地でたどった「Peepooblue’s Sketchbook」は、阿部孝嗣による現代語訳を引用し、旧池袋村の氷川神社（現・池袋本町3丁目）を過ぎて低地へ下った先について、**左右に田圃が広がる場所で、道を横切る「用水」があった**という嘉陵の記述を紹介している。さらに現代の道筋との照合から、その横断地点を**現在の西前橋付近の谷端川跡**と比定し、そこを越えると旧金井窪村（現・大山金井町）へ入ると整理している。〔近世紀行の現代語訳を介した二次引用＋現代の経路比定〕[S219]

〔観察〕この比定が妥当なら、既存READMEで確認している西前橋付近の谷端川・中丸川・耕地整理以前の水田景観に対し、**1816年という近世後期の旅人の記録から「田圃」と「用水」という土地利用・水利用の語を追加できる**。谷端川がこの地点で単に自然河川として認識されていただけでなく、少なくとも嘉陵の記述では農地の中を通る水路を「用水」と表現していた可能性がある。[S140][S141][S173][S219]

ただし、ここには二段階の留保が必要である。第一に、今回国立国会図書館で直接確認できたのは『嘉陵紀行』1916年刊本の書誌・デジタル公開と著者情報までで、**「田圃」「用水」にあたる原文の該当コマを直接照合できていない**。具体的な文言は現代語訳を掲載する二次資料を介している。第二に、**1816年の「用水」＝現在の西前橋地点の谷端川本流**という同定も、現代の旧道追跡による比定であり、原史料自身が「谷端川」「西前橋」と記しているわけではない。〔注意／未解決〕[S219]

したがって、この記録から谷端川そのものが人工的に掘削された用水路だったと断定したり、千川上水の分水がこの地点を流れていたと直結させたりはしない。「用水」という語は水路の利用機能を示す可能性がある一方、自然河川を灌漑に利用してそう呼んだ可能性も残る。既存の1700年前後の水料・千川上水分水資料や、1920年代の耕地整理資料とは、年代と水路系統を分けて照合する必要がある。〔注意〕[S81][S138][S141][S219]

一方、嘉陵の経路が氷川神社から金井窪村へ向かう旧道と一致することを、近世・明治初期の道筋と村境図で独立に確認できれば、**西前橋付近の谷端川低地が1816年時点で水田として開け、道路横断部が用水として認識されていた**という位置比定の確度を上げられる。〔推定／要地図照合〕

### ここから追えること

- [ ] 国立国会図書館デジタルコレクションの『嘉陵紀行 : 全五編』PID 952975で「吹上観音」参詣記の該当コマを特定し、「田圃」「用水」に相当する原文、前後の地名・里程を直接転記する。
- [ ] 嘉陵の1816年経路を、池袋村図・金井窪村関係絵図・明治初期の迅速測図・旧道と重ね、氷川神社から金井窪村へ入る道路が谷端川を横断する地点を西前橋へ独立に比定できるか確認する。
- [ ] 西前橋の既存橋梁位置[S140]、中丸川合流候補[S173]、1920年池袋耕地整理候補区間[S141]を1816年の水田・用水記述と重ね、自然河川・灌漑利用・側流のどれを嘉陵が「用水」と呼んだ可能性が高いか比較する。
- [ ] 近世の池袋村・金井窪村の年貢・水料・用水関係文書を探し、西前橋付近の水田がどの水源・分水を利用していたかを確認する。

## 追加出典

- **[S219]** 村尾正靖『嘉陵紀行 : 全五編』江戸叢書 巻の1、江戸叢書刊行会、1916（大正5）年。国立国会図書館デジタルコレクション PID **952975**、インターネット公開・PDM。国会図書館書誌で著者・刊年・デジタル公開を確認。あわせて Peepooblue’s Sketchbook「嘉陵紀行『吹上観音道くさ』を辿る（その2）」2025年10月19日が、文化13年閏8月20日（1816年10月11日）の紀行の現代語訳として、池袋村から金井窪村へ向かう途中に「左右に田圃」があり道を横切る「用水」があった旨を紹介し、現地経路から西前橋の谷端川跡に比定する。**原文該当コマと地点比定は今回直接一次照合できていないため、文言は二次引用、位置は現代の経路比定として扱う。**  
