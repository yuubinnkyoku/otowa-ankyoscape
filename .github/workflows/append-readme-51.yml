name: Append README research update 51

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-readme-51.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append verified research and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Fq '# 65. 追加調査（2026-08-26・第51回）' README.md; then
            cat .tmp/research_append_20260826_51.md >> README.md
          fi
          rm -f .tmp/research_append_20260826_51.md .github/workflows/append-readme-51.yml
          rmdir .tmp 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Document 2023-24 Zoshigaya trunk reconstruction survey'
          git push
