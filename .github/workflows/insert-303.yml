name: insert-303
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/insert-303.yml
permissions:
  contents: write
jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply appends, insert INDEX row and README bullet, then clean up
        run: |
          set -eu
          python3 .303-insert.py
          rm -f .303-bullet.txt .303-insert.py .303-adds-gov084.md .303-adds-gov577.md .303-adds-gov156.md .303-adds-bridges.md .github/workflows/insert-303.yml
          git config user.name "otowa-ankyoscape-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "第303回: 追記適用・INDEX行挿入・README bullet挿入とヘルパー削除"
          git push
