name: Repair research notes S212-S213 once

on:
  push:
    paths:
      - '.github/workflows/repair-s212-s213-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace malformed section 108 and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          test -f .tmp-s212-s213.md
          grep -q '# 108. 追加調査（2026-08-29・第100回）' README.md
          python3 -c 'from pathlib import Path; p=Path("README.md"); s=p.read_text(); m="\n\n---\n# 108. 追加調査（2026-08-29・第100回）"; assert m in s; s=s.split(m,1)[0]; a=Path(".tmp-s212-s213.md").read_text(); p.write_text(s.rstrip("\n")+a, encoding="utf-8")'
          rm -f .tmp-s212-s213.md .github/workflows/repair-s212-s213-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair S212-S213 research note'
          git push
