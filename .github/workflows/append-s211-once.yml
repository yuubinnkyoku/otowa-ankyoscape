name: Append research note S211 once

on:
  push:
    paths:
      - '.github/workflows/append-s211-once.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append S211 and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          grep -q '# 106. 追加調査（2026-08-29・第98回）' README.md
          if ! grep -q '\[S211\]' README.md; then
            printf '%s' '' | base64 -d >> README.md
          fi
          rm -f .github/workflows/append-s211-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add research note on Tsurumaki River upstream'
          git push
