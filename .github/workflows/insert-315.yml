name: insert-315
on:
  push:
    branches: [main]
    paths: ['.315-bullet.txt']
permissions:
  contents: write
jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert round-315 bullet into README/INDEX and 谷端川.md
        run: python3 .315-insert.py
      - name: Commit README/INDEX/谷端川 and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .315-bullet.txt .315-insert.py .github/workflows/insert-315.yml
          git add README.md docs/sources/INDEX.md docs/谷端川.md
          git commit -m "第315回: READMEに実行記録bulletを挿入しINDEXにGOV-591/592行を追加し谷端川.mdに仁王橋追記（定期実行bot・ヘルパー自己削除）" || echo "nothing to commit"
          git push
