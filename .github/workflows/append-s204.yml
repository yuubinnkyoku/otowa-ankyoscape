name: Append S204 research

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-s204.yml'

permissions:
  contents: write

jobs:
  append:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append research note
        shell: bash
        run: |
          printf '%s' '' | base64 -d >> README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Add research update 94: Negyoin spring pond" || exit 0
          git push
