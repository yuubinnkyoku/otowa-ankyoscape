name: append-research-s144
on:
  push:
    branches: [main]
    paths: ['.research-s144-trigger']
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append research note
        shell: bash
        run: |
          cat .s144-append.txt >> README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: add Yabata culvert public-space history"
          git push origin HEAD:main
