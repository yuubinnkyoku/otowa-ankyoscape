# 48. 追加調査（2026-08-21・第34回）

## 48.1 国交省の土地履歴調査：谷端川上流側には周囲と向きの異なる谷・低位面があり、古い荒川水系との関係が指摘される

国土交通省 土地・水資源局 国土調査課『土地分類基本調査（土地履歴調査）説明書「東京西北部」』（2011年3月）は、土地の人工改変前の自然地形や土地利用履歴を復元した5万分1調査である。説明書は、**板橋区志村西方の谷から板橋本町付近を通る一段低い段丘面が、谷端川の谷の上流部が向きを変える付近へ至り、そこから現在暗渠化された谷端川の谷付近まで延びる**と整理している。〔確認／国土交通省土地履歴調査〕[S104]

同資料は、この台地を刻む谷が **北西―南東方向** を示し、周囲の武蔵野台地にみられるおおむね東西方向の地形と異なることを指摘する。そのうえで、武蔵野台地の大部分が古い多摩川の扇状地に由来するのに対し、この地形については **古い荒川（更新世の古い利根川）水系との関係** を考えている。〔確認／同資料の地形解釈〕[S104]

これは既存[S01]の「弦巻川・水窪川上流の高い河床を更新世の旧河道とみなし、谷端川側との接続を考える」仮説とは別系統の資料であり、**谷端川上流側そのものに、現在の河川配置だけでは説明しにくい更新世由来の地形要素がある**ことを公的な土地履歴調査から補強する。〔観察／既存仮説を検討する独立材料〕[S01][S104]

ただし、この資料は **弦巻川・水窪川が更新世に谷端川へ流入していたことを直接示してはいない**。また「古い荒川（更新世の古い利根川）水系」という説明から、現在の谷端川全線を古荒川の旧河道とみなすこともできない。確認できるのは、板橋本町～下板橋～谷端川上流側へ続く地形の方向・低位面について、国交省調査が古い荒川水系との関連を示していることまでである。〔注意／未解決〕[S104]

既存の更新世旧河道仮説[S01]を検証するには、**谷端川側のこの北西―南東系の地形と、お茶の水女子大学付近へ伸びる弦巻川・水窪川側の高い谷底が、本当に同じ標高面・同じ堆積物・同じ形成時期で連続するか**を確かめる必要がある。方向だけが合っても水の流向は決まらないため、「谷筋の連続」と「どちらへ流れたか」は引き続き別問題として扱う。〔観察／未解決〕[S01][S104]

### ここから追えること

- [ ] 国交省土地履歴調査の自然地形分類GISデータを取得し、板橋本町～下板橋～谷端川上流の低位面・谷底低地を現在の旧河道推定線へ重ねる。
- [ ] [S01]の弦巻川・水窪川側「高い河床」と[S104]の谷端川側地形について、標高断面を同一基準で作り、分水界・勾配・連続性を検証する。
- [ ] 東京都のボーリング柱状図・地質断面から、両側の谷底に同一時期の礫層・谷埋め堆積物が連続するか確認する。
- [ ] 「古い荒川（更新世の古い利根川）水系」という国交省の解釈が依拠した地形・地質文献を同説明書の引用資料まで遡り、年代と根拠を確認する。

## 追加出典

- **[S104]** 国土交通省 土地・水資源局 国土調査課『土地分類基本調査（土地履歴調査）説明書「東京西北部」』5万分1、2011年3月―人工改変前の自然地形・土地利用履歴等を復元する調査。板橋区志村西方～板橋本町の一段低い段丘面が谷端川上流側へ続くこと、台地を刻む谷が北西―南東方向で周囲と異なることを述べ、古い荒川（更新世の古い利根川）水系との関係を指摘。  
