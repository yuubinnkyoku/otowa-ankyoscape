name: Append S215 research note once

on:
  push:
    paths:
      - '.github/workflows/append-s215-once.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append research note and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          test -f .tmp-s215.md
          ! grep -q '\[S215\]' README.md
          cat .tmp-s215.md >> README.md
          rm -f .tmp-s215.md .github/workflows/append-s215-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Document partial completion of Yabata No.1 trunk'
          git push
