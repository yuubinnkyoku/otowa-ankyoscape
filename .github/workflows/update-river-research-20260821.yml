name: Update river research 2026-08-21

on:
  push:
    paths:
      - '.github/workflows/update-river-research-20260821.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch README
        shell: python
        run: |
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')

          marker = """### 首都高速との位置関係
"""
          addition = """### 1930年代直前の汚濁・洪水と、暗渠下水道の線形

2026年の取材記事は、1933年の『高田町史』と1988年の地域誌『ふるさと雑二町会』を用い、暗渠化直前の弦巻川について新たに具体的な情報を紹介している。〔二次資料による原史料引用／原本再確認推奨〕[S71][S72]

『高田町史』には、弦巻川へ裏長屋の炊事・洗濯排水や塵芥が入り、かつて月・蛍の名所だった川が悪臭を放つ状態へ変化した、という同時代の記述があると紹介されている。[S71] したがって、1931年に始まる下水道事業の背景には、都市化に伴う**生活排水・ごみ流入による衛生悪化**があったことを具体的に示す史料候補となる。ただし、現段階では『高田町史』該当頁を原本画像で直接照合していないため、引用文の細部は要再確認とする。

また『ふるさと雑二町会』（1988年、宇佐美俊弘）に収録された元高田町議・元婦人会長らの回想として、**大雨時に田が海のようになり舟が必要だったこと、別地点では約1尺（約30 cm）浸水したこと**が紹介されている。〔確認／後年の聞き取り記録〕[S71][S72] これは弦巻川暗渠化が衛生改善だけでなく洪水対策としても求められていたことを示すが、発生年・場所・浸水範囲は記事だけでは確定できない。

さらに豊島区立郷土資料館の横山恵美学芸員は、1931年以降の下水道について、**できるだけ短い距離を通すよう施工したため現在の下水道線形は旧河道そのものではなく、下水道上を道路化した**と説明している。[S71] これは既存の「暗渠化時に中流部の流路が付け替えられた」[S04][S05]を補強する一方、旧河道と現在の弦巻通り・雑司ヶ谷幹線を一対一で重ねることへの注意をさらに強める。

"""
          if '[S71]' not in s:
              if marker not in s:
                  raise SystemExit('insertion marker not found')
              s = s.replace(marker, addition + marker, 1)

          sources = """
- **[S71]** 葉上太郎「かつて池袋には“大洪水を招く川”が流れていた…戦前に封印された『弦巻川』が“再び猛威をふるう”衝撃の未来とは」文春オンライン, 2026年6月8日―1933年『高田町史』の汚濁記述、1988年『ふるさと雑二町会』の洪水証言、豊島区立郷土資料館・横山恵美学芸員による下水道線形の説明を紹介（原史料引用部分は原本再確認推奨）  
  https://bunshun.jp/articles/-/88508?page=2
- **[S72]** 宇佐美俊弘『ふるさと雑二町会』1988年8月―国立国会図書館サーチで書誌・所蔵を確認。弦巻川の洪水・下水道整備に関する住民聞き取りを収録すると[S71]が紹介  
  https://ndlsearch.ndl.go.jp/search?cs=bib&from=0&q-subject=%2200306446%22&size=20
"""
          if '- **[S71]**' not in s:
              s = s.rstrip() + '\n' + sources

          p.write_text(s, encoding='utf-8')
      - name: Remove temporary workflow
        run: rm .github/workflows/update-river-research-20260821.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/update-river-research-20260821.yml
          git diff --cached --quiet && exit 0
          git commit -m "docs: add evidence on Tsurumaki River pollution and flooding"
          git push
