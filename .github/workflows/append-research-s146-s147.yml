name: Append S146-S147 research
on:
  push:
    paths:
      - '.research-s146-s147-trigger'
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append staged research
        run: |
          cat .s146-s147-append.txt >> README.md
          rm .s146-s147-append.txt .research-s146-s147-trigger .github/workflows/append-research-s146-s147.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Append S146-S147 research to README"
          git push
