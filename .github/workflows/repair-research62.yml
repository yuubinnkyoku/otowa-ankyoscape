name: Repair research 62

on:
  push:
    paths:
      - '.github/workflows/repair-research62.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebuild README from last verified state and append verified section
        shell: bash
        run: |
          git show 6df54432ebf6810ca1e4f99e033e6e21613f1a88:README.md > README.md
          cat .tmp-research62.md >> README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Repair and add research 62 on Yabata flood-control planning'
          git push origin HEAD:main
