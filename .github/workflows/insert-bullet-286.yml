name: insert-bullet-286
on:
  push:
    branches: [main]
    paths: [".286-bullet.txt", ".github/workflows/insert-bullet-286.yml"]
permissions:
  contents: write
jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert bullet, commit, cleanup
        run: |
          set -e
          python3 - <<'PY'
          import sys
          data = open("README.md", "rb").read()
          bullet = open(".286-bullet.txt", "rb").read().rstrip(b"\n")
          lines = data.split(b"\n")
          marker286 = "- **第286回:".encode("utf-8")
          marker285 = "- **第285回:".encode("utf-8")
          if any(l.startswith(marker286) for l in lines):
              print("ALREADY_PRESENT")
              sys.exit(0)
          idx = [i for i, l in enumerate(lines) if l.startswith(marker285)]
          if len(idx) != 1:
              print("ANCHOR_COUNT_%d" % len(idx))
              sys.exit(1)
          lines.insert(idx[0], bullet)
          open("README.md", "wb").write(b"\n".join(lines))
          print("INSERTED_BEFORE_LINE_%d" % idx[0])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md; then CHANGED=0; else CHANGED=1; fi
          git add README.md
          git rm -q -f .286-bullet.txt .github/workflows/insert-bullet-286.yml
          if [ "$CHANGED" -eq 1 ]; then
            git commit -q -m "README: 第286回bulletを追加（GOV-557/558/559・ORG-040/041・BLOG-306・BOOK-285〜288・INDEX 1,692 items）"
            git push
          else
            git commit -q -m "insert-bullet-286: README unchanged, cleanup helper files"
            git push
          fi
