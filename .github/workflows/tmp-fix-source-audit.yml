name: Temporary source audit fixer

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  fix-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Correct source metadata and unsupported claims
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')

          def rep(old, new, count=1):
              global text
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'expected {count} occurrence(s), found {actual}: {old[:100]!r}')
              text = text.replace(old, new)

          rep('**水窪川は護国寺創建以前の1682年の江戸図にも描かれている。** 一方、同じ図では弦巻川を確認できない。ただし江戸図では小河川の省略が実際にあるため、「描かれていない＝存在しない」とは断定できない。〔観察〕[S14][S15]',
              '**水窪川は護国寺創建直後の1682年図と1687年図の双方に描かれている。** 一方、両図では弦巻川を確認できない。ただし江戸図では小河川の省略が実際にあるため、「描かれていない＝存在しない」とは断定できない。〔観察〕[S14][S15]')

          rep('### 1682年の江戸図', '### 1682年・1687年の江戸図')
          rep('護国寺創建翌年の天和2年（1682）の異なる江戸図2点では、護国寺周辺に水窪川とみられる水路が描かれている一方、弦巻川は確認できない。〔観察〕[S14][S15]',
              '護国寺創建翌年の天和2年（1682）の『増補江戸大絵図絵入』[S15]と、貞享4年（1687）の『ゑ入江戸大繪圖』[S14]では、護国寺周辺に水窪川とみられる水路が描かれている一方、弦巻川は確認できない。〔観察〕')
          rep('1682年図の弦巻川不掲載も同じ注意が必要である。', '1682年・1687年図の弦巻川不掲載も同じ注意が必要である。')
          rep('## 5.2 1682年：水窪川だけが見える', '## 5.2 1682年・1687年：水窪川だけが見える')
          rep('護国寺創建翌年の江戸図2点では、水窪川とみられる水路が描かれる一方、弦巻川は確認できない。〔観察〕[S14][S15]',
              '護国寺創建翌年の1682年図と、5年後の1687年図では、水窪川とみられる水路が描かれる一方、弦巻川は確認できない。〔観察〕[S14][S15]')
          rep('> 1682年には音羽谷西側の弦巻川がまだなかった／安定した川でなかった',
              '> 1682年の広域図では音羽谷西側の弦巻川を確認できず、当時まだ未整備・不安定だった可能性がある')
          rep('| 1682 | 江戸図2点 | 水窪川は見えるが弦巻川は確認できない。不存在の証明ではない。[S14][S15] |',
              '| 1682 | 『増補江戸大絵図絵入』 | 水窪川とみられる水路は見えるが弦巻川は確認できない。不存在の証明ではない。[S15] |\n| 1687 | 『ゑ入江戸大繪圖』 | 5年後の図でも水窪川とみられる水路は見えるが弦巻川は確認できない。[S14] |')
          rep('- 1682年図に水窪川だけが明瞭に描かれる。[S14][S15]',
              '- 1682年図・1687年図の双方に水窪川とみられる水路が描かれ、弦巻川は確認できない。[S14][S15]')
          rep('〔観察〕[S14][S15][S18][S86]', '〔観察〕[S15][S18][S86]')

          rep('- **[S14]** 『ゑ入江戸大絵図』天和2年（1682）、国立国会図書館デジタル資料  \n  https://lab.ndl.go.jp/dl/book/2542450',
              '- **[S14]** 『ゑ入江戸大繪圖』貞享4年（1687）、表紙屋市郎兵衛刊、国立国会図書館デジタルコレクション（PID 2542450）。**旧READMEでは天和2年（1682）としていたが、NDL書誌に基づき訂正。**  \n  https://dl.ndl.go.jp/pid/2542450')

          rep('- **[B03]** 東京都豊島師範学校附属国民学校児童教育研究会 編『「郷土の観察」の指導体系』, 1941（本調査で画像を確認。音羽谷の二流について灌漑目的の分流説を記載）',
              '- **[B03]** 東京女子高等師範学校附属国民学校児童教育研究会 編『「郷土の観察」の指導体系』（国民学校教育研究書 第3輯）、皇国青年教育協会, 1941, 161p。国立国会図書館デジタルコレクション PID 1275204（インターネット公開）。本調査では、音羽谷の二流を灌漑目的の分流とみる考察を確認。  \n  https://dl.ndl.go.jp/pid/1275204')

          rep('- **[S25]** 本田創による弦巻川の近年の記事（首都高速沿いの説明）  \n  https://bunshun.jp/articles/-/88509?page=6',
              '- **[S25]** 葉上太郎「『えっ、ここを川が流れていたの？』地元では言い伝えが残るだけ…かつて池袋を流れていた『幻の川』の流域をたどる」文春オンライン, 2026年6月8日（6ページ目で首都高速沿いの弦巻川について説明）  \n  https://bunshun.jp/articles/-/88509?page=6')

          rep('### 1853年の橋の記録\n\n嘉永6年（1853）の雑司ヶ谷村の村方資料には、弦巻川に架かる複数の橋が列挙される。調査中に確認した名称には、卒塔婆橋・鎌倉橋・木村橋・南坂橋・丸太を渡した簡易な橋・弦巻橋・松屋橋・境橋などがある。〔史料確認〕[B04]\n\nこの資料は **1853年には雑司ヶ谷側に明確な弦巻川が存在した**ことの根拠として強い。一方、村方資料なので、護国寺より南、音羽町西側の下流河道が神田川まで存在したことを直接証明する資料としては弱い。',
              '### 「雑司が谷村他沿革起立書上」の史料同定は未解決\n\n豊島区の2000年2月13日プレス資料は、講演会で参照した江戸時代の地誌の一つとして **「雑司が谷村他沿革起立書上」** という呼称を記している。[S58][S163] しかし、同資料は史料目録ではなく講演内容の紹介であり、**正式史料名・成立年は示していない**。以前READMEでこれを「嘉永六年（1853） 雑司ヶ谷村ほか沿革起立書上」として扱っていたが、その根拠を確認できないため撤回する。〔確認／史料同定未了〕[B04]\n\n国立国会図書館の旧幕府引継書には **『町方書上（145） 高田・雑司ヶ谷町方書上 全』**（PID 2571626）が現存する。ただし、これが豊島区記事の「雑司が谷村他沿革起立書上」と同一であることは未確認である。過去調査で橋名列挙の掲載画像を確認していたが、画像の原典を同定できていないため、原資料の該当頁を直接固定できるまでは **「1853年に多数の橋を確認した」という根拠には用いない**。〔史料所在確認／同一性未確認〕[B04]')

          rep('| 1853 | 雑司ヶ谷村方資料 | 雑司ヶ谷側の弦巻川と多数の橋を確認。[B04] |',
              '| 年代未確定 | 「雑司が谷村他沿革起立書上」 | 豊島区2000年記事に呼称は登場するが、正式史料名・年代・『高田・雑司ヶ谷町方書上 全』との同一性は未確認。[B04][S58] |')
          rep('- 雑司ヶ谷側には1853年までに多数の橋を持つ弦巻川がある。[B04]',
              '- 1733年には弦巻川の石橋建立を示す豊島区教育委員会資料があり、18世紀前半の橋梁存在を確認できる。[S85]')
          rep('- [ ] 弦巻川の幅について、1853年村方資料[B04]、地引絵図[S55]、高田町下水道設計平面図[S23]などで区間別の幅・水路敷を比較し、「七尺」がどの区間を指すか検証する。',
              '- [ ] 弦巻川の幅について、地引絵図[S55]、高田町下水道設計平面図[S23]などで区間別の幅・水路敷を比較し、「七尺」がどの区間を指すか検証する。史料未同定の[B04]は原典同定まで幅・年代の根拠に用いない。')

          rep('- **[B04]** 『嘉永六年 雑司ヶ谷村ほか沿革起立書上』, 1853（本調査で掲載画像を確認。弦巻川の橋名列挙。原資料・翻刻の所在を追加調査中）',
              '- **[B04]** **史料未同定**：「雑司が谷村他沿革起立書上」。豊島区2000年2月13日プレス資料[S58][S163]に、弦巻川講演で参照した江戸時代地誌の呼称として登場するが、**「嘉永六年」「1853年」という年代、正式史料名、現存史料との対応は未確認**。旧READMEの『嘉永六年 雑司ヶ谷村ほか沿革起立書上』という表記は撤回する。候補として国立国会図書館旧幕府引継書『町方書上（145） 高田・雑司ヶ谷町方書上 全』（PID 2571626）が現存するが、同一史料とは断定しない。  \n  https://adeac.jp/viewitem/toshima-history/viewer/viewer/pressH120213/data/pressH120213.pdf  \n  https://dl.ndl.go.jp/pid/2571626')

          rep('これは既存READMEで確認していた1853（嘉永6）年の雑司ヶ谷村方資料に出る複数の橋[B04]より **120年早い、年代を伴う弦巻川の橋梁資料** になる。',
              'これは、**弦巻川の橋梁を年代付きで1733（享保18）年まで遡れる資料**である。以前READMEで1853（嘉永6）年の橋名列挙として扱っていた[B04]は史料同定未了のため、年代比較の基準から外す。')
          rep('一方、既存[B04]の1853年資料にある **「木村橋」** と、この1733年の石橋が同一地点・同一系譜の橋だったかは、今回確認した豊島区資料だけでは直接証明できない。',
              '一方、過去に[B04]として扱った未同定画像には **「木村橋」** と読める橋名があったが、原典・年代が未同定であるため、この1733年の石橋と同一地点・同一系譜だったかは現時点で判断できない。')
          rep('この資料により、弦巻川の橋梁史は少なくとも **1733年 → 1853年の橋名列挙 → 1931～32年の下水道化・暗渠化** という三つの時点で追えるようになった。',
              'この資料により、弦巻川の橋梁史は少なくとも **1733年の石橋建立 → 1931～32年の下水道化・暗渠化** という年代付きの基準点で追える。中間期の橋名列挙は[B04]の原典同定後にあらためて位置づける。')
          rep('- [ ] 『嘉永六年 雑司ヶ谷村ほか沿革起立書上』[B04]の「木村橋」と1733年の石橋が同一地点・同一系譜か、記述と絵図で照合する。',
              '- [ ] [B04]として過去に扱った橋名列挙画像の原典・年代を同定し、「木村橋」と1733年の石橋が同一地点・同一系譜か、記述と絵図で照合する。')
          rep('また既存[B04]には弦巻川にも **「鎌倉橋」** が記録されているが、今回の上池袋・滝野川境の鎌倉橋は **谷端川に架かる別の橋**である。同名橋を混同しない。[B04][S105]',
              '過去に[B04]として扱った未同定の橋名列挙画像には弦巻川の **「鎌倉橋」** と読める名称があったが、原典未同定のため確定橋名としては扱わない。今回の上池袋・滝野川境の鎌倉橋は **谷端川に架かる橋**として[S105]で公的資料から確認できるため、両者を混同しない。[B04][S105]')

          rep('- **[S10]** 早稲田大学オープンカレッジ資料「谷端川とは」, 2024  \n  https://yorifuji.thyme.jp/wasedaopc/tikei/waseda20241116/waseda20241116b.pdf',
              '- **[S10]** 早稲田大学オープンカレッジ講義資料「谷端川とは」, 2024（講師側ウェブサイト公開版）  \n  https://yorifuji.thyme.jp/wasedaopc/tikei/waseda20241116/waseda20241116b.pdf')

          p.write_text(text, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: correct weak and misidentified sources'
          git push origin HEAD:main
