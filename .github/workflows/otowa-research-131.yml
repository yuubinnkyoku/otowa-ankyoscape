name: Apply Otowa research update 131

on:
  push:
    paths:
      - '.github/workflows/otowa-research-131.yml'

permissions:
  contents: write

jobs:
  update-readme:
    if: ${{ !contains(github.event.head_commit.message, '[cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append verified research note
        shell: bash
        run: |
          if ! grep -q '^# 131\. 追加調査' README.md; then
            cat .github/otowa-research-131.md >> README.md
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md
            git commit -m 'docs: add Otowa 2-chome archaeological evidence'
            git push
          fi
