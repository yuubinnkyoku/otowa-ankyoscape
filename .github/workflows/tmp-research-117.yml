# 117. 追加調査（2026-08-29・第109回）

## 117.1 弦巻川の代替下水道・雑司ヶ谷幹線：2008年の再構築工事資料で管渠断面・工区延長・位置を具体化できる

国土交通省が2008（平成20）年8月5日に公表した「東京都　雑司ヶ谷幹線工事における事故について」は、東京都下水道局発注の **「雑司ヶ谷幹線再構築工事」** について、工期を **2007年12月3日～2009年1月15日**、SPR工法による管きょ更生延長を **600 m** と記録し、事故発生箇所の雑司ヶ谷幹線を **矩形断面 2100×1600 mm** としている。事故地点は **豊島区雑司が谷2丁目** で、東京都の同日発表では **雑司ヶ谷2-22** とさらに具体化されている。〔確認／国土交通省・東京都公的資料〕[S225]

既存READMEでは、弦巻川暗渠化後の下水道系統として雑司ヶ谷幹線を扱い、現在の神田川への吐口も確認している。一方、管渠そのものの断面・再構築工区延長・2000年代の改修時期までは十分に記録していなかった。今回の資料により、少なくとも雑司ヶ谷2丁目付近では、**2008年時点に内寸約2.1 m×1.6 mの既設矩形管渠があり、その一部を含む600 m区間が老朽化対策のため更生工事の対象になっていた**ことを確認できる。〔確認〕[S225]

この数値は、暗渠化前の弦巻川の川幅・水深をそのまま示すものではない。雑司ヶ谷幹線は都市下水道として流域の雨水・下水を受ける施設であり、1930年代の暗渠化時の初期断面と2008年時点の断面が同一であるかも今回の資料だけでは分からない。したがって、**2100×1600 mmを旧弦巻川の河道断面として逆算しない。** 〔注意〕[S225]

ただし、2008年8月5日の局地的豪雨時には、この管渠で急激な増水が生じたことが国交省・東京都の双方に記録されている。事故そのものの詳細を河川史の中心に置くのではなく、**旧河道を引き継ぐ都市下水道が、現代には大断面の雨水排除施設として機能し、再構築の対象になる段階まで更新されていた**ことを示す現代インフラ史の時点として扱う。〔観察〕[S225]

また東京都の同日20時30分時点の被害資料では、同じ豪雨で文京区 **音羽1丁目に床上浸水4件** が記録されている。雑司ヶ谷幹線の増水と音羽1丁目の浸水が同一の水理経路・能力不足によって直接結び付くことは、この被害一覧だけでは証明できないため、両者を因果関係として結ばない。〔確認＋注意〕[S225]

### ここから追えること

- [ ] 『雑司ヶ谷幹線再構築工事事故調査報告書』（東京都下水道局、2008年9月取りまとめ）の原本を確認し、幹線縦断図、集水区域、マンホール位置、施工区間、既設管の築造年代を特定する。
- [ ] 2007～09年再構築工事の完成図・下水道台帳と、1931～32年の高田町下水道設計平面図[S23][S205]を重ね、現在の雑司ヶ谷幹線が旧弦巻川・初期暗渠の中心線をどこまで踏襲するか確認する。
- [ ] 雑司ヶ谷2-22の事故地点を旧河道・弦巻通り・旧橋位置へ落とし、2100×1600 mm断面が弦巻川暗渠系統のどの区間に当たるか固定する。
- [ ] 2008年8月5日の音羽1丁目浸水について、下水道局の浸水実績図・降雨記録・管渠系統図を確認し、雑司ヶ谷幹線・坂下幹線・神田川水位との関係を因果を断定せず検証する。

### 第109回の追加出典

- **[S225]** 国土交通省「東京都　雑司ヶ谷幹線工事における事故について」2008年8月5日―東京都下水道局発注「雑司ヶ谷幹線再構築工事」の工期を2007年12月3日～2009年1月15日、SPR工法による管きょ更生延長を600 m、事故箇所の雑司ヶ谷幹線断面を **2100×1600 mm**、場所を豊島区雑司が谷2丁目と記録。東京都総務局「平成20年8月5日豪雨に伴う被害状況等について」は事故現場を **豊島区雑司ヶ谷2-22** とし、同日20時30分時点で文京区音羽1丁目の床上浸水4件も記録する。**事故の人的被害の詳細ではなく、管渠の位置・断面・再構築時期・豪雨時の現代排水施設としての挙動を確認する資料として使用。**  
