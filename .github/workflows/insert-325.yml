name: insert-325

on:
  push:
    branches:
      - main
    paths:
      - '.325-bullet.txt'
      - '.325-insert.py'

permissions:
  contents: write

jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run insert script
        run: python3 .325-insert.py
      - name: Commit README/INDEX and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/sources/INDEX.md
          git rm .325-bullet.txt .325-insert.py .github/workflows/insert-325.yml
          git commit -m "第325回: READMEに実行記録bulletを挿入しINDEXにMAP-224・BOOK-329行を追加（定期実行bot・ヘルパー自己削除）"
          git push
