name: temporary append research 126
on:
  push:
    paths:
      - '.github/workflows/tmp-append-research-126.yml'
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append research section
        shell: bash
        env:
          PAYLOAD: ''
        run: |
          python - <<'PY'
          import os, base64
          from pathlib import Path
          p = Path('README.md')
          p.write_text(p.read_text(encoding='utf-8') + base64.b64decode(os.environ['PAYLOAD']).decode('utf-8'), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Add current urban-planning context for Mizukubo River trace'
          git push