          PAYLOAD: ' 間付近にあったと比定している。〔観察／現地調査による二次資料〕[S242]

同じ地点では現在、東京都による都市計画道路**補助第81号線（東池袋地区）**の整備が進行している。東京都第二市街地整備事務所の2026年8月27日更新資料によれば、補助81号線は都電荒川線の軌道を計画線内に取り込み、歩道・車道・軌道を合わせて**幅員25 m**とする整備で、事業計画は2026年時点でさらに5年延伸されている。〔確認／東京都公式〕[S241]

さらに豊島区は、IKE・SUNPARK南側から補助81号線へ接続する**補助第176号線**を一体的に整備している。区の公式資料では、事業認可区間は東池袋4丁目内の**延長30 m・幅員11 m**で、補助81号線へ接続する前段階として**2018（平成30）年度から現道の一部を下げる「盤下げ工事」**を実施したとする。〔確認／豊島区公式〕[S241]

〔観察〕この3資料を重ねると、少なくとも水窪川上流の**都電横断部～旧水久保停留場付近**は、旧河道・水路敷の痕跡を現在地で追える場所であると同時に、道路・都電軌道・接続道路の再編が現在進行している場所でもある。したがって、2024年の現地写真は単なる暗渠散歩の記録ではなく、**道路整備によって路面高・路地形状・水路敷の見え方が変わる前後を比較するための時点資料**として保存価値がある。

一方で、補助81号線・176号線の計画線を**旧水窪川の河道そのもの**とはみなさない。また、補助176号線の「盤下げ」が旧河道地形を理由に行われたとする根拠もない。道路計画と旧河道の関係は、旧版地図・地籍図・事業平面図を同一縮尺で重ねて初めて評価できる。〔注意／未解決〕

既存[S201]では「水久保停留場」が1925年に開業し1939年に「日出町二丁目」へ改称したことまで公的資料で確認しているが、**1925～39年の停留場の正確な初代位置**は未確定としていた。今回の「早稲田13～14号踏切間」という位置はその未解決点を具体化する候補になるものの、現段階では現地調査サイトによる比定であり、王子電気軌道の線路平面図・停留場配置図による一次確認前なので〔推定〕へ格上げしない。

### ここから追えること

- [ ] 2024年7月13日の水窪川跡写真と、補助81号線・176号線の事業平面図を重ね、どの旧水路敷・路地が道路区域へ入るかを確定する。
- [ ] 王子電気軌道の1925～39年線路平面図から旧水久保停留場の位置を直接確認し、「早稲田13～14号踏切間」という比定を検証する。
- [ ] 補助81号線完成後に同地点を再撮影し、旧河道を示していた路面高・路地・踏切周辺の形状がどこまで残ったか比較する。
- [ ] 道路整備に伴う下水道再構築図が公開されていないか確認し、旧水窪川跡・既設雨水管・新設管の位置関係を分離して整理する。

## 追加出典

- **[S241]** 東京都第二市街地整備事務所「東池袋地区」「東池袋地区―併用軌道化」（2026年8月27日更新）／豊島区「都市計画道路補助第176号線の整備」。補助81号線東池袋地区が都電荒川線を計画線内に含み歩道・車道・軌道を合わせ幅員25 mで整備されていること、2026年時点で事業計画が5年延伸されたことを確認。補助176号線は東池袋4丁目の事業認可区間30 m・幅員11 mで、補助81号線との接続前段階として2018年度から盤下げ工事を実施。**これらの道路計画自体は旧水窪川河道を示す資料ではない。**  
  https://www.toshiseibi.metro.tokyo.lg.jp/dainiseibi/tikubetu/ensen_machizukuri/higashi_ike  
  https://www.toshiseibi.metro.tokyo.lg.jp/dainiseibi/tikubetu/ensen_machizukuri/higashi_ike/heiyou  
  https://www.city.toshima.lg.jp/331/machizukuri/doro/dorokoji/000856.html

- **[S242]** Natrium.jp「神田川周辺の水路敷群（水窪川）」―2024年7月13日撮影の上流部現地記録。早稲田13号踏切手前で旧水窪川筋が都電沿い道路ではなく東側路地から出ると観察し、旧水久保停留場を早稲田13～14号踏切間付近と比定。補助81号線・176号線接続部の工事中景観も記録する。**旧停留場位置は一次鉄道図面による直接確認前の二次比定として扱う。**  
  https://natrium.jp/canal_lot/kanda/mizukubo/index.html
