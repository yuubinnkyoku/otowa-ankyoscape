# 63. 追加調査（2026-08-25・第49回）

## 63.1 弦巻川旧流路が現在の豊島区・文京区境界に残る区間を学術研究が特定

日本女子大学家政学部住居学科の古賀碧「古地図を用いた雑司ヶ谷領域の変遷に関する研究――境界に影響する要素についての考察――」（2014年度卒業研究梗概）は、古地図・文献から「雑司ヶ谷領域」の変遷を復元し、河川・道路・宗教施設が境界形成に与えた影響を検討している。[S129]

同研究は、暗渠化され現在は視認できない弦巻川について、**護国寺西交差点から目白台2丁目交差点付近まで、豊島区・文京区の区界が弦巻川の流路と一致する**と記している。〔確認／学術研究による古地図・現代境界の比較〕[S129]

この区間は、現在の行政境界が単に道路や街区に従って引かれたのではなく、**暗渠化以前の弦巻川旧流路を継承している可能性が高い具体的区間**として扱える。既存READMEでは弦巻川の旧河道・暗渠・区史資料を追ってきたが、「護国寺西交差点～目白台2丁目交差点付近」という範囲を示して現行の区界との一致を学術研究から確認する記録は未収録だった。〔観察〕[S129]

さらに古賀の2016年度修士論文梗概『「江戸名所図会」掲載の名所と周辺地域の［領域］の変遷に関する研究――古地図上で確認された地名に基づく考察――』は、2014年度研究を発展させ、1935年と現在の雑司ヶ谷領域を弦巻川と重ねている。その結果、年代によって一致区間には差があるものの、**弦巻川の流路が雑司ヶ谷領域の境界と一致してきた**と整理している。〔確認／学術研究〕[S130]

同論文は雑司ヶ谷以外の複数地域も比較し、暗渠化や廃止によって河川が商店街・緑道などへ姿を変えた後も旧流路が地域境界と一致する例、さらに雑司ヶ谷・王子では**流路変更後も変更前の河道に沿って境界が残る例**を確認している。[S130] したがって弦巻川についても、現在の区界・町界・筆界を旧河道復元の独立した手掛かりとして利用できる可能性が強まる。〔観察／既存仮説を補強〕

ただし、ここでいう「一致」は研究者が古地図・現代地図を重ねて得た結果であり、**現在の区界線が法的に旧河川中心線・河川敷境界のどちらを継承したかまでは示していない**。また、暗渠工事や道路整備で河道・水路敷が移動した区間まで一律に旧自然河道とみなすことはできない。公図、旧地籍図、区界変更資料、下水道台帳を重ねて区間ごとに検証する必要がある。〔注意／未解決〕[S129][S130]

### ここから追えること

- [ ] 護国寺西交差点～目白台2丁目交差点付近の現行豊島区・文京区境をGIS化し、1850年代切絵図・明治期地形図・1930年前後の下水道設計平面図と重ねる。
- [ ] 区界が旧河道の中心、片岸、旧水路敷の筆界のどこを継承するか、公図・旧地籍図・区界変更資料から確認する。
- [ ] 弦巻川の暗渠化前後で区界位置が動いた地点があるかを調べ、自然河道・改修河道・暗渠線のどれが境界として固定されたのか区間別に分ける。
- [ ] 水窪川についても豊島区・文京区境と重なる区間を同じ方法で検証し、弦巻川だけに特有の現象か比較する。

## 追加出典

- **[S129]** 古賀碧「古地図を用いた雑司ヶ谷領域の変遷に関する研究――境界に影響する要素についての考察――」日本女子大学家政学部住居学科2014年度卒業研究梗概―護国寺西交差点から目白台2丁目交差点付近まで、豊島区・文京区の区界が弦巻川流路と一致すると記載。  
  https://mcm-www.jwu.ac.jp/~minaiken/03member/thesis/ronbun/h26/053_koga.pdf

- **[S130]** 古賀碧『「江戸名所図会」掲載の名所と周辺地域の［領域］の変遷に関する研究――古地図上で確認された地名に基づく考察――』日本女子大学2016年度修士論文・修士制作梗概―1935年・現在の雑司ヶ谷領域と弦巻川を比較し、弦巻川流路が領域境界と一致してきたこと、暗渠化・流路変更後も旧流路が境界として残る例を整理。  
  https://mcm-www.jwu.ac.jp/~minaiken/03member/thesis/syuron/h28/s004_koga.pdf
'''
