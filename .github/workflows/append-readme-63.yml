# 63. 追加調査（2026-08-26・第49回）

## 63.1 弦巻川旧流路と現在の豊島区・文京区境界：具体的な一致区間

日本女子大学家政学部住居学科の古賀碧「古地図を用いた雑司ヶ谷領域の変遷に関する研究――境界に影響する要素についての考察――」（2014年度卒業研究梗概）は、古地図・文献を用いて「雑司ヶ谷領域」の変遷と、その境界形成に影響した河川・道路・宗教施設などを検討している。[S129]

同研究は、暗渠化され現在は地表で視認できない弦巻川について、**護国寺西交差点から目白台2丁目交差点付近まで、現在の豊島区・文京区の区界が弦巻川の流路と一致する**と記している。〔確認／学術研究による古地図・現代境界の比較〕[S129]

この記述により、弦巻川の旧流路を復元する際には、暗渠道路・谷底地形・古地図だけでなく、**現在の行政境界も独立した手掛かりになりうる**。とくに護国寺西交差点～目白台2丁目交差点付近は、境界と旧流路の対応を公図・旧地籍図で精査する具体的な対象区間として絞り込める。〔観察／旧河道復元の根拠を補強〕[S129]

ただし、この研究が示しているのは流路と区界の地図上の一致であり、**現在の区界が旧河川の中心線、片岸、河川敷境界、改修後の水路線のどれを法的に継承したかまでは確定しない**。したがって「現区界＝旧自然河道中心線」とは扱わない。〔注意／未解決〕[S129]

## 63.2 暗渠化・流路変更後にも、変更前の河道が境界として残る場合がある

古賀碧『「江戸名所図会」掲載の名所と周辺地域の［領域］の変遷に関する研究――古地図上で確認された地名に基づく考察――』（2016年度修士論文・修士制作梗概）は、収集した156枚の古地図を現代地図上へ地理情報システムで整理し、複数地域の領域境界と河川・道路などとの関係を比較している。[S130]

雑司ヶ谷については、1935年の領域と現在の領域を弦巻川と重ね、**年代によって一致する区間に違いはあるものの、弦巻川の流路が「雑司ヶ谷領域」の境界と一致してきた**と整理している。〔確認／学術研究〕[S130]

さらに比較対象全体では、**河川が暗渠化されて商店街・緑道などへ姿を変えた後も流路が領域境界と一致する例**が確認され、雑司ヶ谷・王子については、**河川の流路変更後にも変更前の流路に沿って境界が引かれる例**が確認されたとしている。〔確認／比較研究〕[S130]

これは弦巻川の旧河道復元に重要な注意点を加える。現在の区界が弦巻川の痕跡を保存しているとしても、その線が現在の暗渠・弦巻通りと同じ年代の流路を示すとは限らず、**流路改変前の、より古い河道を保存している可能性もある**。〔観察／既存仮説を補強・同時に限定〕[S130]

したがって、現行区界を旧河道の証拠として利用する場合は、少なくとも明治期地形図、旧高田村地引絵図[S55]、1932年前後の弦巻川暗渠化・下水道化資料、現在の公図を重ね、**どの年代の河道が境界として固定されたか**を区間ごとに判定する必要がある。〔推定／検証方針〕[S129][S130]

### ここから追えること

- [ ] 護国寺西交差点～目白台2丁目交差点付近の現行豊島区・文京区境を地図化し、明治期地形図・旧高田村地引絵図[S55]・1932年前後の河道と重ねる。
- [ ] 区界が旧河道中心、左岸・右岸、河川敷の筆界、改修水路のどれを継承するか、公図・旧地籍図・区界変更資料から確認する。
- [ ] 暗渠化時の流路付け替え区間と現区界を比較し、区界が付け替え前後どちらの河道を保存しているか判定する。
- [ ] 水窪川についても現行の豊島区・文京区境や町界と旧流路の一致区間があるか比較し、弦巻川だけに特有の現象か検証する。

