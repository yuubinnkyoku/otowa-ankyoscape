name: Trigger river research update

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.title == 'run-itabashi-river-research-update-20260820'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply researched README addition
        shell: bash
        run: |
          awk "/cat >> README.md <<'EOF'/{flag=1;next} /^EOF$/{flag=0} flag" .github/workflows/append-river-research.yml >> README.md
          rm -f .github/workflows/append-river-research.yml .github/workflows/trigger-river-research.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/append-river-research.yml .github/workflows/trigger-river-research.yml
          git commit -m "docs: add Itabashi-side Yabata River sources"
          git push origin main
