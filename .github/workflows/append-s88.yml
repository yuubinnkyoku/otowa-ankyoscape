name: Apply S88 river research update

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.title == 'run-river-research-update-20260821-s88'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Append verified research note
        shell: python
        run: |
          from pathlib import Path
          import base64
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          if '[S88]' not in text:
              addition = base64.b64decode('').decode('utf-8')
              p.write_text(text + addition, encoding='utf-8')
      - name: Remove temporary workflow and trigger, then commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/append-s88.yml
          rm -f .s88-trigger
          git add -A
          git commit -m "docs: add official source on 1931 Tsurumaki River works"
          git push origin HEAD:${{ github.head_ref }}
