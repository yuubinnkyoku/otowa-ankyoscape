# 120. 追加調査（2026-08-30・第106回）

## 120.1 水窪川・弦巻川：現在の雨水幹線は音羽通り下で交差し、旧河口位置をそのまま踏襲していない

水路跡を現地調査している Natrium.jp は、東京都下水道局の下水道台帳を参照したうえで、江戸川橋付近の現在の雨水排水について、**音羽通り東側の水窪川筋に対応する雨水管が音羽通りの下で西側へ渡り、江戸川橋西側の「坂下幹線」吐口へ出る一方、弦巻川側の雑司ヶ谷幹線は反対に音羽通りの下を交差して江戸川橋東側へ出る**と整理している。〔下水道台帳を参照した現地調査／二次資料〕[S230]

この位置関係は、旧河道と現在の下水道を同一視しないための具体例になる。水窪川の近世・近代の下流は、現在の巻石通り付近にあった旧神田上水へ注いだとされる一方、現在の雨水はその旧河口位置をそのまま使わず、音羽通りを横断して西側の神田川へ排水される。弦巻川側も同様に、現在の吐口位置だけから歴史的河口を逆算することはできない。〔観察〕[S230]

```mermaid
flowchart LR
    A[水窪川旧流路<br/>音羽通り東側] --> B[現在の雨水管]
    B --> C[音羽通り下を西へ横断]
    C --> D[坂下幹線吐口<br/>江戸川橋西側]

    E[弦巻川旧流路<br/>音羽通り西側] --> F[雑司ヶ谷幹線]
    F --> G[音羽通り下を東へ横断]
    G --> H[雑司ヶ谷幹線吐口<br/>江戸川橋東側]
```

ただし、今回直接確認できた公開資料は Natrium.jp の現地調査記事であり、東京都下水道局の台帳画面そのものを保存・引用したものではない。**管径、上下関係、交差位置の数値、坂下幹線の正式な系統範囲**は、東京都下水道局の最新台帳または工事図面で再確認する必要がある。特に、現在の雨水管の線形をそのまま昭和初期の暗渠化時点の線形とみなさない。〔注意／要一次資料確認〕[S230]

## 120.2 谷端川・小石川：猫又橋の1918年親柱と1975年の橋際ポケットパークが旧河道横断点を現在まで固定している

谷端川下流の小石川筋にあった猫又橋について、現地調査資料では、都道437号（不忍通り）付近に残る親柱に **「ねこまたはし」「大正七年三月成」** と刻まれていることが確認されている。大正7年3月は1918年3月であり、少なくともこの時点の架橋・改築を示す現物資料になる。〔現存親柱の観察／現地調査〕[S231]

さらに文京区『土木現況』（令和4年4月）は、旧橋際の**千石3-13と千石2-7**に「猫又橋際①」「猫又橋際②」という2か所のポケットパークがあり、いずれも **1975（昭和50）年3月設置**と記録している。①は79.6㎡で遊歩道・便所、②は51.5㎡で遊歩道を備える。〔確認／文京区公的土木資料〕[S231]

この二つを合わせると、暗渠化後に河道そのものが見えなくなっても、**1918年の橋梁部材と1975年の橋際公共空間が同じ横断地点の記憶を別の形で保持している**ことが分かる。旧河道を現在地へ落とす際、猫又橋は単なる橋名ではなく、親柱・不忍通り・2か所の橋際ポケットパークを組み合わせた位置基準点として使える。〔観察〕[S231]

一方、親柱の「大正七年三月成」が橋の初架設年を意味するとは限らず、改築・架替えの竣工年である可能性が高い。また、現在の親柱が原位置に完全に残るのか、暗渠化・道路改修時に数m単位で移設されたのかは今回の資料だけでは確定できない。1975年のポケットパークも旧河道敷そのものを全面的に占めるとは限らない。〔注意／未解決〕[S231]

### ここから追えること

- [ ] 東京都下水道局の下水道台帳で坂下幹線・雑司ヶ谷幹線の管径、管底高、交差位置、吐口番号を一次確認し、旧河道と現在管渠の水平・鉛直のずれを図化する。
- [ ] 江戸川橋付近の大正～昭和初期の下水道・河川工事図を探し、いつ現在の「東西を交差する」排水系統になったか年代を絞る。
- [ ] 猫又橋の1918年以前の橋梁台帳・架替記録を確認し、「大正七年三月成」が新設か改築かを確定する。
- [ ] 猫又橋親柱の現在位置を旧版地形図・地籍図へ重ね、移設の有無と旧河道中心線を確認する。

