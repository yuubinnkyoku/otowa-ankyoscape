name: Temporary research append

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  append-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append newly verified research
        shell: bash
        env:
          APPEND_B64: 