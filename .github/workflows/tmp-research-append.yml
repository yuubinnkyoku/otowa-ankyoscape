# 123. 追加調査（2026-08-30・第109回）

## 123.1 上池袋から谷端川へ注いだ湧水支流：上池袋1-3→1-14→1-27→西巣鴨1-10まで地点を絞れる

豊島区立郷土資料館研究紀要『生活と文化』第11号（2001年12月25日）には、横山恵美「**豊島区の湧き水をたずねて**」が調査ノートとして収録されていることを豊島区公式の刊行物一覧で確認できる。[S236] その前年、郷土資料館は同名テーマの地域史講座を実施しており、豊島区の2000年10月7日付資料は、**武蔵野台地の地下水脈から湧いた水が谷に沿って小流となり、灌漑用の溜池・洗い場・飲用水・生活用水などに使われた**という調査の枠組みを説明している。〔確認／豊島区立郷土資料館〕[S236]

同調査ノートを引用する地域史資料では、谷端川へ注いだ上池袋の小流について、**上池袋1-3付近の湧水を起点に北上し、上池袋1-14で東へ折れ、上池袋1-27の洗い場を経て、西巣鴨1-10の丹羽藤吉郎邸（のち山口玉造邸）内を通り谷端川へ注いだ**とされる。上池袋1-27では勾配のある流れと洗い場が地域で「滝」と呼ばれたという。〔原典所在確認＋二次転記〕[S236]

さらに、谷端川との合流部にあった丹羽邸には**瓢箪形の大きな池**があり、のち山口玉造邸となってから「山玉（やまたま）の池」と呼ばれたとされる。〔原典所在確認＋二次転記〕[S236] これは既存READMEで追ってきた谷端川本流だけではなく、**崖線・浅い谷の湧水→短い支流→洗い場→屋敷池→谷端川**という小規模な水利用系を、現在の番地レベルで復元できる材料になる。〔観察〕

ただし、今回直接確認できた一次側は調査ノートの書誌と2000年の講座資料までであり、**第11号本文の該当頁画像そのものはオンラインで直接照合できていない**。流路・番地・池名の具体的記述は調査ノートを引用する二次資料を介しているため、原典本文を確認するまでは河道中心線や池の正確な範囲を確定しない。また「瓢箪池支流」は後世の調査者による便宜的呼称として使われる場合があり、当時の正式河川名だったとは扱わない。〔注意／未解決〕[S236]

## 123.2 北大塚・巣鴨新田の谷端川沿いには複数の湧水・洗い場があった：北大塚2-28と折戸通り入口を地点化

同じ横山恵美「豊島区の湧き水をたずねて」を引用する資料には、谷端川流域の具体的な水利用地点として、**北大塚2-28の湧水と王子電気軌道（現・都電荒川線）との間の洗い場**、**巣鴨新田停留所付近の洗い場**、さらに**折戸通り（旧王子道）入口の石材店に湧いた泉**が挙げられている。石材店の泉は通行人の飲用にも使われたとされる。〔原典所在確認＋二次転記〕[S237]

既存READMEでは北大塚2-14の「瀧不動」や谷端川沿いの土地利用・橋梁を追っているが、今回の記録はその周囲に**本流とは別の局所湧水と生活用の洗い場が複数存在した**ことを示す。谷端川流域の水環境を「谷端川本流＋千川上水からの分水」だけで説明するのではなく、崖下・低地の地下水が細かな生活用水系を補っていた可能性を具体的な地点で示す材料になる。〔観察〕[S237]

一方、これらの湧水が谷端川へ常時流入していたのか、洗い場だけに導かれたのか、暗渠・側溝へ排水された時期がいつかは今回の資料だけでは分からない。北大塚2-28の湧水量、折戸通り入口の石材店名・地番、巣鴨新田停留所付近の洗い場位置も、地籍図・住宅地図・下水道台帳などで追加照合が必要である。〔未解決〕[S237]

### ここから追えること

- [ ] 『生活と文化』第11号の横山恵美「豊島区の湧き水をたずねて」本文を入手し、上池袋1-3・1-14・1-27・西巣鴨1-10、北大塚2-28、巣鴨新田停留所付近、折戸通り入口の記述と図版を直接照合する。
- [ ] 上池袋支流について明治・大正期の地形図、地引絵図、現在の地籍図を重ね、番地間を結ぶ水路敷・筆界・低地を確認する。
- [ ] 丹羽藤吉郎邸／山口玉造邸の地籍・住宅地図・航空写真を確認し、瓢箪形の池の位置・面積・消滅時期を絞る。
- [ ] 北大塚2-28と折戸通り入口の湧水について、王子電気軌道の線路図、旧住宅地図、石材店の営業記録を照合し、洗い場・泉の位置を道路単位から敷地単位へ絞る。

