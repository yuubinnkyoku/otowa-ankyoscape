name: Temporary research append

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append verified research
        shell: bash
        run: |
          if grep -q '\[S230\]' README.md; then exit 1; fi
          echo 'Ci0tLQoKIyAxMjAuIOi/veWKoOiqv+afpe+8iDIwMjYtMDgtMzDvvIznrKwxMDblm57vvIkKCiMjIDEyMC4xIOawtOeqquW3neODu+W8puW3u+W3ne+8muingeWcqOOBrumbqOawtOW5uee··谷端川下流の小石川筋にあった猫又橋について、現地調査資料では、都道437号（不忍通り）付近に残る親柱に **「ねこまたはし」「大正七年三月成」** と刻まれていることが確認されている。大正7年3月は1918年3月であり、少なくともこの時点の架橋・改築を示す現物資料になる。〔現存親柱の観察／現地調査〕[S231]

さらに文京区『土木現況』（令和4年4月）は、旧橋際の**千石3-13と千石2-7**に「猫又橋際①」「猫又橋際②」という2か所のポケットパークがあり、いずれも **1975（昭和50）年3月設置**と記録している。①は79.6㎡で遊歩道・便所、②は51.5㎡で遊歩道を備える。〔確認／文京区公的土木資料〕[S231]

この二つを合わせると、暗渠化後に河道そのものが見えなくなっても、**1918年の橋梁部材と1975年の橋際公共空間が同じ横断地点の記憶を別の形で保持している**ことが分かる。旧河道を現在地へ落とす際、猫又橋は単なる橋名ではなく、親柱・不忍通り・2か所の橋際ポケットパークを組み合わせた位置基準点として使える。〔観察〕[S231]

一方、親柱の「大正七年三月成」が橋の初架設年を意味するとは限らず、改築・架替えの竣工年である可能性が高い。また、現在の親柱が原位置に完全に残るのか、暗渠化・道路改修時に数m単位で移設されたのかは今回の資料だけでは確定できない。1975年のポケットパークも旧河道敷そのものを全面的に占めるとは限らない。〔注意／未解決〕[S231]

### ここから追えること

- [ ] 東京都下水道局の下水道台帳で坂下幹線・雑司ヶ谷幹線の管径、管底高、交差位置、吐口番号を一次確認し、旧河道と現在管渠の水平・鉛直のずれを図化する。
- [ ] 江戸川橋付近の大正～昭和初期の下水道・河川工事図を探し、いつ現在の「東西を交差する」排水系統になったか年代を絞る。
- [ ] 猫又橋の1918年以前の橋梁台帳・架替記録を確認し、「大正七年三月成」が新設か改築かを確定する。
- [ ] 猫又橋親柱の現在位置を旧版地形図・地籍図へ重ね、移設の有無と旧河道中心線を確認する。

## 第106回の追加出典

- **[S230]** Natrium.jp「神田川周辺の水路敷群（水窪川）」「神田川周辺の水路敷群（弦巻川）」―東京都下水道局の下水道台帳を参照し、江戸川橋付近で水窪川側の雨水管が音羽通り下を西へ横断して坂下幹線吐口へ、弦巻川側の雑司ヶ谷幹線が東側の吐口へ出るとする現地調査。**台帳原画面は今回直接保存確認できていないため二次資料扱い。**
  https://natrium.jp/canal_lot/kanda/mizukubo/index.html
  https://natrium.jp/canal_lot/kanda/tsurumaki/index.html

- **[S231]** 文京区『土木現況』令和4年4月、ポケットパーク一覧―「猫又橋際①」（千石3-13、79.6㎡）、「猫又橋際②」（千石2-7、51.5㎡）をともに1975（昭和50）年3月設置と記録。あわせて Natrium.jp「小石川の水路跡」が現存親柱の「ねこまたはし」「大正七年三月成」の刻字を写真確認している。**1918年は親柱刻字による橋梁の成立・改築時点であり、初架設年とは断定しない。**
  https://www.city.bunkyo.lg.jp/documents/4645/20237148241.pdf
  https://natrium.jp/canal_lot/yabata/koishikawa/index.html
' | base64 -d >> README.md
