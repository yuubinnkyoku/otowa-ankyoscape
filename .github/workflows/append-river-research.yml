# 71. 追加調査（2026-08-26・第57回）

## 71.1 音六町会史の「昭和19年3月の空襲」は年次誤記の可能性が高い

既存[S30]の文京区「音六町会」は、戦災時の音羽について「昭和19年3月の空襲」で、音羽通り東側の鼠坂下・水窪川、西側の鳥尾坂下・弦巻川から江戸川橋までが焼けた、という趣旨を記している。この記述は水窪川・弦巻川を地域の東西境界として捉える史料として価値がある一方、空襲年月については既にREADMEで要再確認としていた。[S30]

文京ふるさと歴史館『歴史館だより』第22号（2015年6月19日）は、文京区の前身である本郷区・小石川区が被災した空襲日として、**1945（昭和20）年1月27・28日、2月25日、3月10日、4月13〜14日、5月24・25日**を列挙している。ここには1944（昭和19）年3月の空襲は含まれない。〔確認／文京区公的歴史資料〕[S142]

さらに衆議院憲政記念館の2015年特別展資料は、**1945年5月25日の山の手大空襲で音羽の鳩山邸が被害を受けた**ことを記録している。したがって、音六町会史の「昭和19年3月」は、少なくとも年については公的な戦災年表と整合せず、**昭和20（1945）年の空襲を誤記した可能性が高い**。〔観察／資料間照合〕[S30][S142][S143]

ただし、音六町会史が描く**「音羽通り東側の鼠坂下・水窪川、西側の鳥尾坂下・弦巻川から江戸川橋までが焼けた」範囲が、1945年4月13〜14日と5月24〜25日のどちらの空襲に対応するかは今回の資料だけでは確定できない**。音羽の鳩山邸で5月25日の被災が確認できるため5月25日説は有力候補だが、同じ地域が複数回被災した可能性も残る。〔推定／未解決〕[S142][S143]

この修正は河道史そのものを変えるものではないが、[S30]を使って**戦前・戦中の地域住民が水窪川と弦巻川を音羽谷の明瞭な東西境界として認識していた**ことを扱う際に、誤った年代をそのまま引用しないため重要である。

### ここから追えること

- [ ] 1945年4月13〜14日・5月24〜25日の戦災焼失区域図を音羽町の旧町界、水窪川・弦巻川旧河道と重ね、音六町会史の記述がどちらの空襲に対応するか確認する。
- [ ] 音羽六丁目相当区域の罹災証明、町会記録、警視庁・消防関係資料、航空写真から焼失日の地点差を確認する。
- [ ] [S30]の「昭和19年3月」は確定年代として用いず、原文引用時には公的戦災年表と不整合であることを併記する。

## 追加出典

