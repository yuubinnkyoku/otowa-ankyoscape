name: Apply README research patch

on:
  push:
    paths:
      - '.github/workflows/readme-research-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch README
        shell: python
        run: |
          from pathlib import Path

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')

          old = '''南側では、都下水道局からの承認を受けて、**1966年に谷端川第1～第3児童遊園、1967年に第4児童遊園、1980年に遊歩道として順次開放**された。その後、1983年から施設改修が始まり、1990年に整備を終え、西武池袋線～川越街道の区間が現在の谷端川南緑道となった。公式施設情報上の開園は1991年4月である。[S35]'''
          new = '''南側について、豊島区の施設説明は、都下水道局からの承認を受けて **1966年に谷端川第1～第3児童遊園として開放**し、1967年に第4児童遊園、1980年に遊歩道として順次開放したとする。[S35] 一方、豊島区史年表は『公共施設等の概要』を典拠に、**1967年1月10日に谷端川第1～第3児童遊園を「開設」**、**同年12月3日に第4児童遊園を「開設」**したと記録している。〔確認／公的資料間の年次差〕[S48] 1966年の「承認を受け開放」と1967年1月10日の「開設」が、実質供用と正式な施設開設など行政手続上の段階差を表すのか、単なる年次整理の差なのかは現時点では確定できない。その後、1983年から施設改修が始まり、1990年に整備を終え、西武池袋線～川越街道の区間が現在の谷端川南緑道となった。公式施設情報上の開園は1991年4月である。[S35]'''
          if old not in s:
              raise SystemExit('target paragraph not found')
          s = s.replace(old, new, 1)

          old = '''- 1966年：谷端川第1～第3児童遊園として暗渠上部を開放。[S35]\n- 1967年：谷端川第4児童遊園を開放。[S35]'''
          new = '''- 1966年：豊島区の施設説明では、谷端川第1～第3児童遊園として暗渠上部を「承認を受け開放」。[S35]\n- 1967年1月10日：区史年表では谷端川第1～第3児童遊園を「開設」。1966年の開放との行政上の区別は未解決。[S48]\n- 1967年12月3日：区史年表では谷端川第4児童遊園を「開設」。[S48]'''
          if old not in s:
              raise SystemExit('target bullets not found')
          s = s.replace(old, new, 1)

          old = '''| 1966～71 | 谷端川暗渠上を児童遊園・遊歩道として順次開放 | 第1～第5児童遊園と北側遊歩道。河道暗渠化後の上部利用史を具体化。[S35][S36] |'''
          new = '''| 1966～71 | 谷端川暗渠上を児童遊園・遊歩道として順次転用 | 第1～第3は施設説明で1966年「承認を受け開放」、区史年表で1967年1月10日「開設」。第4は1967年12月3日開設、第5は1971年。公的資料間の用語・年次差は要検証。[S35][S36][S48] |'''
          if old not in s:
              raise SystemExit('target timeline row not found')
          s = s.replace(old, new, 1)

          old = '''- **[S48]** 豊島区「としまひすとりぃ」谷端川関連年表―1960年3区治水懇談、1983年遊歩道計画住民説明会、1984年遊歩道完成・緑と水の整備開始、1985年谷端川親水公園、1987年谷端川第2親水公園など  \n  https://adeac.jp/toshima-history/detailed-search?mode=timeline&word=%E8%B0%B7%E7%AB%AF%E5%B7%9D'''
          new = '''- **[S48]** 豊島区「としまひすとりぃ」谷端川関連年表―1960年3区治水懇談、1967年1月10日谷端川第1～第3児童遊園開設、同年12月3日第4児童遊園開設、1983年遊歩道計画住民説明会、1984年遊歩道完成・緑と水の整備開始、1985年谷端川親水公園、1987年谷端川第2親水公園など  \n  https://adeac.jp/toshima-history/detailed-search?mode=timeline&word=%E8%B0%B7%E7%AB%AF%E5%B7%9D'''
          if old not in s:
              raise SystemExit('target S48 entry not found')
          s = s.replace(old, new, 1)

          marker = '''- [ ] 1960年の豊島・板橋・北3区治水懇談の議事・要望書を探し、狩野川台風後の治水計画との関係を確認する。'''
          replacement = marker + '''\n- [ ] 谷端川第1～第3児童遊園について、1966年「承認を受け開放」[S35]と1967年1月10日「開設」[S48]の行政上の違いを『公共施設等の概要』・公園台帳・下水道局占用承認資料で確認する。'''
          if marker not in s:
              raise SystemExit('target todo marker not found')
          s = s.replace(marker, replacement, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit README and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/readme-research-patch.yml
          git add README.md
          git commit -m "Clarify 谷端川児童遊園 chronology"
          git push
