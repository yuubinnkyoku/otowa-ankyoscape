name: Append pending research notes

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append S104 and S105
        shell: bash
        env:
          APPEND_B64: 
        run: |
          if grep -q '\[S104\]' README.md || grep -q '\[S105\]' README.md; then
            echo 'S104/S105 already present'
            exit 0
          fi
          printf '%s' "$APPEND_B64" | base64 -d >> README.md
          git diff --check
      - name: Commit if changed
        shell: bash
        run: |
          if git diff --quiet README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: add geomorphology and Kamakura Bridge findings'
          git push origin HEAD:main
