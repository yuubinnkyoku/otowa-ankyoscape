name: Append README once

on:
  push:
    paths:
      - '.readme-append.md'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append researched material
        run: |
          printf '\n' >> README.md
          cat .readme-append.md >> README.md
          git rm .readme-append.md
          git rm .github/workflows/append-readme-once.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: add river research notes' || exit 0
          git push
