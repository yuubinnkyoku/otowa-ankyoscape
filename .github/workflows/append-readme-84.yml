name: append-readme-84
on:
  push:
    paths:
      - '.github/workflows/append-readme-84.yml'
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append research
        shell: bash
        run: |
          cat .append-84.txt >> README.md
          git rm .append-84.txt .github/workflows/append-readme-84.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: add round 70 river research"
          git push origin HEAD:main
