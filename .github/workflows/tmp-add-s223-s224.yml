name: Temporary append S223 S224

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append research section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          if '[S223]' in text or '# 116. 追加調査' in text:
              raise SystemExit('S223 or section 116 already exists')
          data = '...snip...'
          addition = base64.b64decode(data).decode('utf-8')
          p.write_text(text.rstrip() + addition + '\n', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git commit -m "docs: add Yabata river narrowing and gravel-pit history"
          git push origin HEAD:main
