# 116. 追加調査（2026-08-29・第108回）

## 116.1 谷端川：『新編武蔵風土記稿』は、後世の道路敷などへの埋立で川幅が狭まったと記す

『新編武蔵風土記稿』巻之九「豊島郡之一」の「小石川幷谷端川」について、1884（明治17）年刊の内務省地理局版を典拠として原文を転記する地域史資料を確認した。同記述は、長崎村から出る細流が池袋村・滝野川村・巣鴨村などを経て小石川村へ至り、最終的に神田川へ合流する流路を述べたうえで、谷端川について、**昔はもっと大きな川だったらしいが、後年しだいに「道敷等」に埋め立てられ、当時は広い所でも川幅三～四間ほどになっていた**という趣旨を記している。三～四間を単純換算すると約5.5～7.3 mである。〔原典を転記する二次資料による確認／原画像該当コマ未特定〕[S223]

この記述は重要である。既存READMEでは、江戸後期の巣鴨村内の谷端川について『新編武蔵風土記稿』を引用する二次資料から「川幅三間或いは六間」という値を記録している。[S170] 今回の「広い所でも三四間」という記述は、それとは別に**河道が時間とともに道路敷などへ取り込まれて縮幅したという変化そのもの**を述べている。したがって、近代の改修・暗渠化より前から、谷端川の河道幅や河岸線が土地利用によって固定不変ではなかったことを示す史料として使える。〔観察〕[S170][S223]

ただし、「昔は大きな川だった」という部分は地誌編纂時点から過去を振り返った表現で、**いつ、どの区間を、どの道路造成によって、何m埋め立てたのか**は記していない。また「三四間」は最大幅についての概括的記述であり、谷端川全線の標準幅とみなさない。『新編武蔵風土記稿』の編纂は19世紀前半、今回参照した刊本は1884年であるため、記述内容の成立時期と刊行年も区別する。〔注意／未解決〕[S223]

## 116.2 谷端川・大塚：巣鴨監獄建設時の砂利採取跡が池として残り、大正期に埋め立てられたとの地域史記録

大塚・巣鴨地域史を調査した資料は、仰高西小学校同窓会記念誌編集委員会編『わが街大塚巣鴨 わが母校仰高西』（2000年）の「谷端川の橋 明治～昭和中期」図中解説を典拠として、**明治20年代の巣鴨監獄建設時、谷端川周辺から砂利が採取され、その採取跡が池として残った**と紹介している。さらに、浅見坂崖下・線路際にあった池は**大正期に埋め立てられてテニスコートになった**とする。1930（昭和5）年測図の日本地形社版『東京三千分一図 十九號ノ三 巢鴨』では、同付近に「運動場」が描かれるという。〔地域史資料の二次引用＋地図照合の紹介〕[S224]

これは谷端川低地の微地形が、河川作用だけでなく**近代の建設資材採取によって人工的に掘り下げられ、その後「池 → 埋立地・運動場」へ再転用された地点があった**可能性を示す。〔観察〕[S224] 既存READMEでは谷端川低地の水田・町工場・鉄道残土の「赤土山」などを記録しているが[S100]、今回の砂利採取跡は逆に地面を掘り下げた事例であり、旧版地図の小池・窪地をすべて自然の湧水池や旧河道と解釈しないための具体例になる。

一方、今回ウェブ上で直接確認できたのは2000年記念誌を引用する地域史ページで、**記念誌原本の該当図・砂利採取の一次工事記録は未確認**である。池の正確な位置・面積・採取深、谷端川本流との水理的接続、湧水の有無も分からない。したがって、この池を谷端川の旧河道、自然池、湧水池のいずれかに確定せず、〔地域史記録／要原典・地図検証〕として扱う。[S224]

### ここから追えること

- [ ] 『新編武蔵風土記稿』巻之九「小石川幷谷端川」の国立国会図書館デジタルコレクション該当コマを直接特定し、「後年追々道敷等ニ埋立ラレ」「三四間」の原文・前後文脈を画像で照合する。
- [ ] 「道敷等」への埋立がどの区間・年代を指すか、1801年巣鴨村絵図、近世道筋、明治初期地籍図・迅速測図で河道幅と道路境界を比較する。
- [ ] 『わが街大塚巣鴨 わが母校仰高西』（2000年）の「谷端川の橋 明治～昭和中期」原図を確認し、砂利採取跡の池の位置・形状・典拠を確定する。
- [ ] 1930年測図『東京三千分一図 十九號ノ三 巢鴨』の「運動場」と、明治～大正期の地形図・地籍図・監獄配置図を重ね、池の出現・埋立時期を絞る。
- [ ] 巣鴨監獄建設の工事記録・用地図を探し、谷端川周辺からの砂利採取が工事資料でも確認できるか検証する。

