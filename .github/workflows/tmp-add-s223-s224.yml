name: Temporary append S223 S224

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append research section
        shell: bash
        run: |
          if grep -q '\[S223\]' README.md; then
            echo 'S223 already present'
            exit 1
          fi
          cat .tmp-s223-s224.md >> README.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git commit -m "docs: add Yabata river narrowing and gravel-pit history"
          git push origin HEAD:main
