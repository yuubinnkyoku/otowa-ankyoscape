name: append research 33
on:
  pull_request:
    types: [opened, reopened]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply staged update
        shell: bash
        run: |
          if ! grep -q '^# 33\. 追加調査（2026-08-20・第19回）' README.md; then
            cat .research-update-20260820-33.md >> README.md
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git rm -f .github/workflows/append-research-33.yml .research-update-20260820-33.md
          git commit -m 'docs: add spring and sewer findings'
          git push origin HEAD:main
