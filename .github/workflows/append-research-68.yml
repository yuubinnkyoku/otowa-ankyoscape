name: Append research 68

on:
  push:
    paths:
      - '.append-research-68-trigger'

permissions:
  contents: write

jobs:
  append:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append and commit verified research
        shell: bash
        run: |
          cat .append-research-68.txt >> README.md
          rm -f .append-research-68-trigger .append-research-68.txt .github/workflows/append-research-68.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: add research on Takada irrigation and Mizukubo paper making'
          git push
