name: Temporary README research update

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append researched sources to README
        shell: bash
        run: |
          if grep -q '^# 21\. 追加調査（2026-08-20・第7回）' README.md; then
            echo 'README already updated.'
            exit 0
          fi
          cat .github/research-addition-20260820-7.md >> README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: add Takada photo and cadastral sources'
          git push origin main
