name: fix-s210-chronology

on:
  push:
    paths:
      - '.github/workflows/append-s209-s210.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Tighten chronology wording
        shell: bash
        run: |
          echo '' | base64 -d | python3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: tighten Senkawa sewer chronology"
          git push origin HEAD:main
