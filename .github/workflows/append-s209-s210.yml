name: append-s209-s210

on:
  push:
    paths:
      - '.github/workflows/append-s209-s210.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append research note
        shell: bash
        run: |
          printf '%s' '' | base64 -d >> README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: add valley geology and Senkawa sewer research"
          git push origin HEAD:main
