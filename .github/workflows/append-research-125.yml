name: Append research update 125

on:
  push:
    paths:
      - '.github/workflows/append-research-125.yml'

permissions:
  contents: write

jobs:
  append:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append research notes
        shell: bash
        run: |
          cat .github/research-update-125.md >> README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: add early Kanda waterworks maps for Koraku'
          git push
