          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/append-research-60.yml
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: add research round 60 on Tsurumaki River boundaries'
            git push
          fi
