name: Apply staged S168 note

on:
  push:
    paths:
      - '.github/workflows/apply-s168.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append staged note and clean temporary files
        shell: bash
        run: |
          cat .s168-append.md >> README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git rm .s168-append.md .github/workflows/apply-s168.yml
          git commit -m 'docs: add S168 on Moto-Ikebukuro and second Zoshigaya trunk'
          git push
